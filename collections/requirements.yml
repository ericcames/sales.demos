---
# Every collection is pinned to an exact version. Nothing floats.
#
# Floating versions mean two laptops resolve different code and a demo that
# works today breaks on the next install. The pins below are the versions
# Phase 0 was actually validated against — not the newest published ones.
# Bump a pin deliberately, re-run the phase against `sandbox`, then commit.
#
# Install to the recommended path (Ansible's default, ~/.ansible/collections):
#   ansible-galaxy collection install -r collections/requirements.yml
#
# Or use the `collections-sync` skill, which pins, installs, and then verifies
# that what is installed matches this file.
#
# Never install into the repo. `.ansible/` and `collections/ansible_collections/`
# are gitignored artifact directories, not somewhere collections belong.
#
# Never add a project-local ansible.cfg to make this work: Ansible picks ONE
# cfg file and does not merge. A local one shadows ~/.ansible.cfg, which holds
# the working Automation Hub token, and breaks certified content installs.
collections:
  # AAP 2.6 config-as-code.
  - name: infra.aap_configuration
    version: "4.7.0"
  - name: ansible.platform
    version: "2.7.20260604"
  # Legacy — prefer ansible.platform. Kept until the replacement is proven.
  - name: ansible.controller
    version: "4.8.0"

  # OpenShift / KubeVirt. kubernetes.core drives the Phase 0 CNV install;
  # redhat.openshift_virtualization drives VM lifecycle in Phases 1-4.
  - name: kubernetes.core
    version: "6.4.0"
  - name: redhat.openshift_virtualization
    version: "2.3.0"
