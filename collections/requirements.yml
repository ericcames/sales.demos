---
# Every collection is pinned to an exact version. Nothing floats.
#
# Floating versions mean two laptops resolve different code and a demo that
# works today breaks on the next install. The pins below are the versions
# Phase 0 was actually validated against — not the newest published ones.
# Bump a pin deliberately, re-run the phase against `sandbox`, then commit.
#
# Install to the recommended path (Ansible's default, ~/.ansible/collections):
#   ansible-galaxy collection install -r collections/requirements.yml
#
# Or use the `collections-sync` skill, which pins, installs, and then verifies
# that what is installed matches this file.
#
# Never install into the repo. `.ansible/` and `collections/ansible_collections/`
# are gitignored artifact directories, not somewhere collections belong.
#
# Never add a project-local ansible.cfg to make this work: Ansible picks ONE
# cfg file and does not merge. A local one shadows ~/.ansible.cfg, which holds
# the working Automation Hub token, and breaks certified content installs.
collections:
  # AAP 2.6 config-as-code.
  - name: infra.aap_configuration
    version: "4.7.0"
  - name: ansible.platform
    version: "2.7.20260604"
  # Legacy — prefer ansible.platform. Kept until the replacement is proven.
  - name: ansible.controller
    version: "4.8.0"
  # Private Automation Hub. Drives the EE registry/repository/sync objects that
  # mirror the execution environment into PAH (#35). Pinned to 1.1.0 to match
  # what ee-supported-rhel9 already ships — 1.0.4 was installed locally, and a
  # laptop resolving different code from the EE is exactly the drift this file
  # exists to stop.
  - name: ansible.hub
    version: "1.1.0"

  # OpenShift / KubeVirt. kubernetes.core drives the Phase 0 CNV install;
  # redhat.openshift_virtualization drives VM lifecycle in Phases 1-4.
  - name: kubernetes.core
    version: "6.4.0"
  - name: redhat.openshift_virtualization
    version: "2.3.0"

  # Demo content (Phase 4, #5). Both are ALREADY IN THE EXECUTION ENVIRONMENT at
  # these versions — verified against the published image — so pinning them here
  # changes nothing about AAP. It exists so the laptop resolves the same code the
  # image does, which is the whole job of this file. No EE rebuild needed.
  #
  # rhel_system_roles supplies the certified `rhc` role that registers the guest
  # to the Red Hat CDN. That is not optional decoration: the CNV rhel9 image
  # ships with NO repositories, so nothing installs until it registers.
  - name: redhat.rhel_system_roles
    version: "1.120.5"
  # ansible.posix supplies firewalld, used by roles/linux_configure.
  - name: ansible.posix
    version: "2.2.0"

  # Windows demo content (#339, #340). ALREADY IN THE EXECUTION ENVIRONMENT at
  # this exact version -- measured against the published image
  # quay.io/zigfreed/sales-demos-ee:v1.2.0, not assumed, and against the base
  # digest it was built from. So pinning it changes nothing about AAP and needs
  # no rebuild; it exists so the laptop resolves the same code the image does.
  # That is not academic here: 3.0.0 was installed locally against the image's
  # 3.6.1, which is the same drift the ansible.hub pin above was added to stop.
  #
  # community.windows is NOT pinned, and is the one collection that would have
  # forced a rebuild -- it is absent from both the base and the published image.
  # Nothing needs it. ansible.windows carries every module the Windows Day 1
  # chain uses: win_feature, win_template, win_copy, win_service, win_wait_for,
  # win_reboot, win_regedit, win_user, win_updates, win_reg_stat, win_powershell,
  # win_audit_policy_system, win_uri, win_ping. The only draw was
  # win_security_policy, and both callers went away: the ported account role used
  # it solely to set PasswordComplexity: 0, which would fail the compliance node
  # that runs next, and the compliance role's use was a *set* module read in
  # check mode -- password and lockout policy are read honestly through
  # win_powershell. Its IIS modules are not needed either: the demo page is
  # served from the default site at C:\inetpub\wwwroot, so win_feature plus
  # win_template is the whole story.
  - name: ansible.windows
    version: "3.6.1"

  # Terraform. Phase 3 drives the terraform CLI through ansible.builtin.command,
  # so the binary — not this collection — is the hard requirement; the custom
  # execution environment exists to supply it (#31, execution-environment.yml).
  # Pinned here anyway so the module set is available and identical on both
  # entry points, and so `ansible-lint` can resolve it locally.
  - name: cloud.terraform
    version: "4.0.0"
