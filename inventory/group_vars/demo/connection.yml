---
# ===========================================================================
# connection.yml — everything about the demo environment that is NOT a
# credential. Committed, plaintext.
#
# This is the file you edit when you get a fresh RHDP demo environment: paste
# the new hostname and API URL here, then update the two credential keys under
# `env_secrets.demo` in the vault-encrypted
# playbooks/group_vars/all/secrets.yml.
#
# LIVE as of 2026-09-03, repointed at a rebuilt environment (#135). It first
# went live 2026-08-10 (#30); before that it was placeholders, and an apply
# against `demo` correctly failed rather than silently borrowing sandbox's
# values — the bug fixed in #16. Now that both environments are real, that
# isolation is load-bearing rather than theoretical: `--limit demo` and
# `--limit sandbox` reach two different clusters.
#
# THE CREDENTIALS AND THESE HOSTNAMES ARE REFRESHED SEPARATELY, and that is how
# this file goes stale unnoticed: the vault was updated for the rebuilt
# environment while these three lines still named the old cluster. Nothing
# fails in a way that points here — DNS simply stops resolving, so every
# connection dies at the network layer and the MCP server reports only
# CONNECTION_CLOSED. When an environment is rebuilt, change BOTH.
#
# CLONED THIS REPO AND WANT YOUR OWN ENVIRONMENT? Do not edit this file --
# create inventory/group_vars/demo/local.yml beside it and redefine only what
# differs:
#
#     ---
#     aap_hostname: "aap-aap.apps.cluster-<id>.dyn.redhatworkshops.io"
#     openshift_api_url: "https://api.cluster-<id>.dyn.redhatworkshops.io:6443"
#     openshift_apps_domain: "apps.cluster-<id>.dyn.redhatworkshops.io"
#
# It is gitignored, so you never diverge from upstream and never conflict on a
# pull. Ansible loads every file in this directory in sorted order and the LAST
# one wins, so local.yml ('l' > 'c') overrides connection.yml. (#131)
#
# THE NAME MUST BE local.yml. "connection.local.yml" sorts BEFORE
# "connection.yml" and loses -- it would be read, ignored, and leave you running
# against the cluster named below while believing you had repointed it.
#
# It is a LAPTOP mechanism. AAP checks this repo out from SCM and gitignored
# files are not in the checkout, so a job template still sees the values below.
# Repointing AAP means changing this file on a branch of your own.
#
#   ansible-vault edit playbooks/group_vars/all/secrets.yml \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
# ===========================================================================

aap_env_name: "demo"

# --- Ansible Automation Platform -------------------------------------------
aap_hostname: "aap-aap.apps.cluster-6d5xj.dyn.redhatworkshops.io"
aap_username: "admin"
aap_validate_certs: false
aap_request_timeout: 30

# --- OpenShift -------------------------------------------------------------
openshift_api_url: "https://api.cluster-6d5xj.dyn.redhatworkshops.io:6443"
openshift_validate_certs: false

# --- Credentials, resolved from the vaulted secrets.yml --------------------
# Do not inline real values here. This selects this environment's slice, so
# `--limit demo` can never pick up sandbox's credentials (#16).
aap_password: "{{ env_secrets[aap_env_name].aap_password }}"
openshift_api_token: "{{ env_secrets[aap_env_name].openshift_api_token }}"
linux_admin_password: "{{ env_secrets[aap_env_name].linux_admin_password | default('') }}"
# SEPARATE FROM THE LINUX ONE, and that does not undo #201 (#305). #201's defect
# was SCOPE: windows_admin_password was a single GLOBAL value because it lived
# baked in the golden image both environments pull. #201 moved the real password
# onto the CLONE via the sysprep unattend, and once it left the image nothing
# forced it to equal the Linux one -- sharing was a convenience, not a
# constraint. Keyed per environment here, it stays compatible; a global one
# would not. It is also the only one long enough: CIS L1 for Windows Server 2022
# requires 14 characters and linux_admin_password is 8.
windows_admin_password: "{{ env_secrets[aap_env_name].windows_admin_password | default('') }}"

# --- Demo VM defaults (not secret) -----------------------------------------
windows_admin_username: "demoadmin"
linux_admin_username: "cloud-user"
quay_windows_image: "quay.io/zigfreed/win2k22-cis-l1-golden:20260907-0516"

# SSH public key injected into demo VMs by cloud-init at first boot. Not a
# credential — a public key is safe in plaintext. When set, password-based SSH
# is disabled on the guest (main.tf:145).
#
# LEAVING THIS EMPTY MAKES THE VM UNREACHABLE. cloud-init then emits
# ssh_pwauth: true with no authorized key and no password, so cloud-user has no
# credentials at all — by SSH, by virtctl, by anything.
#
# The matching PRIVATE half is demo_ssh_private_key in the vaulted
# playbooks/group_vars/all/secrets.yml, which feeds the "Sales Demos - Linux
# Machine"
# credential in AAP. Change one and you must change the other.
demo_ssh_public_key: "ssh-rsa "

# The *.apps ingress domain for this cluster. Used to construct Route
# hostnames for HTTP access to demo VMs.
#   oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
openshift_apps_domain: "apps.cluster-6d5xj.dyn.redhatworkshops.io"

# Namespace the demo VMs are created in.
ocpvirt_namespace: "sales-demos-demo"

# --- Cluster memory budget -------------------------------------------------
# Guest memory this cluster will admit, in GiB. Measured by
# playbooks/probe_env.yml -- re-run /sales-demos-probe-env rather than
# hand-adjusting (#118, #141).
#
# IT LIVES HERE NOW, NOT ONLY IN TERRAFORM (#301). It used to exist solely as a
# default on terraform/ocpvirt's `available_memory_gb` variable, which Ansible
# never passed -- so the number in variables.tf was the only one that ever
# applied, identically to both clusters, and could not differ per environment
# even though it is a per-cluster measurement. provision_vm.yml now needs it too
# for the cluster-wide check that Terraform cannot do, and two copies of a
# measured number is exactly the drift this repo avoids. Defined here, passed to
# Terraform on apply; the Terraform default remains only for hand-runs.
#
# Overstating it is the dangerous direction: the guards fail closed, so a figure
# that is too small merely refuses tiers the cluster could run, while one that is
# too large admits a plan that will not schedule.
available_memory_gb: 63
