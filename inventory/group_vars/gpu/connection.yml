---
# ===========================================================================
# connection.yml — everything about the GPU environment that is NOT a
# credential. Committed, plaintext.
#
# This is an RHDP "Red Hat OpenShift AI" environment — a standalone OCP
# cluster with RHOAI pre-installed and a GPU node. It has no AAP and no
# nested virtualization. The AI model serves from here; AAP environments
# (sandbox/demo) consume the endpoint.
#
# RHDP URLs are deliberately in the clear, same as the AAP environments.
#
# DO NOT EDIT THIS FILE TO POINT AT YOUR CLUSTER. The URLs below are
# placeholders. Copy local.yml.example to local.yml in this directory and
# fill in your cluster's values there. local.yml is gitignored and sorts
# after connection.yml, so Ansible picks it up automatically.
#
# connection.yml is only updated (via utilities/update-connection.sh) when
# the environment is stable enough to commit as the upstream reference.
# ===========================================================================

gpu_env_name: "gpu"

# --- OpenShift -------------------------------------------------------------
# No aap_hostname — this cluster has no AAP.
openshift_api_url: "https://api.cluster-<id>.dyn.redhatworkshops.io:6443"
openshift_validate_certs: false

# htpasswd identity provider. The username is not secret.
openshift_admin_username: "admin"

# --- Credentials, resolved from the vaulted secrets.yml --------------------
# TOP-LEVEL vault keys, not under env_secrets. This cluster has no AAP, no
# VMs, and no passwords besides the OpenShift admin — env_secrets would force
# dummy keys for credentials that do not exist here.
openshift_admin_password: "{{ gpu_admin_password }}"
openshift_api_token: "{{ gpu_openshift_api_token }}"

# The *.apps ingress domain for this cluster. Used to construct the Route
# hostname for the inference endpoint.
openshift_apps_domain: "apps.cluster-<id>.dyn.redhatworkshops.io"
