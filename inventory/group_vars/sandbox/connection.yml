---
# ===========================================================================
# connection.yml — everything about the sandbox environment that is NOT a
# credential. Committed, plaintext.
#
# This is the file you edit when you get a fresh RHDP sandbox: paste the new
# hostname and API URL here, then update the two credential keys under
# `env_secrets.sandbox` in the vault-encrypted
# playbooks/group_vars/all/secrets.yml.
#
# RHDP URLs are deliberately in the clear. They are ephemeral demo-platform
# addresses, not customer-identifying, and keeping them readable is what lets
# the vaulted file hold credentials only.
#
# CLONED THIS REPO AND WANT YOUR OWN ENVIRONMENT? Do not edit this file --
# create inventory/group_vars/sandbox/local.yml beside it and redefine only what
# differs:
#
#     ---
#     aap_hostname: "aap-aap.apps.cluster-<id>.dyn.redhatworkshops.io"
#     openshift_api_url: "https://api.cluster-<id>.dyn.redhatworkshops.io:6443"
#     openshift_apps_domain: "apps.cluster-<id>.dyn.redhatworkshops.io"
#
# It is gitignored, so you never diverge from upstream and never conflict on a
# pull. Ansible loads every file in this directory in sorted order and the LAST
# one wins, so local.yml ('l' > 'c') overrides connection.yml. (#131)
#
# THE NAME MUST BE local.yml. "connection.local.yml" sorts BEFORE
# "connection.yml" and loses -- it would be read, ignored, and leave you running
# against the cluster named below while believing you had repointed it.
#
# It is a LAPTOP mechanism. AAP checks this repo out from SCM and gitignored
# files are not in the checkout, so a job template still sees the values below.
# Repointing AAP means changing this file on a branch of your own.
#
#   ansible-vault edit playbooks/group_vars/all/secrets.yml \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
# ===========================================================================

aap_env_name: "sandbox"

# --- Ansible Automation Platform -------------------------------------------
aap_hostname: "aap-aap.apps.cluster-kbjvc.dyn.redhatworkshops.io"
aap_username: "admin"
aap_validate_certs: false
aap_request_timeout: 30

# --- OpenShift -------------------------------------------------------------
openshift_api_url: "https://api.cluster-kbjvc.dyn.redhatworkshops.io:6443"
openshift_validate_certs: false

# --- Credentials, resolved from the vaulted secrets.yml --------------------
# Do not inline real values here. This selects this environment's slice, so
# `--limit demo` can never pick up sandbox's credentials (#16).
aap_password: "{{ env_secrets[aap_env_name].aap_password }}"
openshift_api_token: "{{ env_secrets[aap_env_name].openshift_api_token }}"

# --- Demo VM defaults (not secret) -----------------------------------------
windows_admin_username: "demoadmin"
linux_admin_username: "cloud-user"
quay_windows_image: "quay.io/<user>/windows2k22-golden:<date>"

# SSH public key injected into demo VMs by cloud-init at first boot. Not a
# credential — a public key is safe in plaintext. When set, password-based SSH
# is disabled on the guest (main.tf:145).
#
# LEAVING THIS EMPTY MAKES THE VM UNREACHABLE. cloud-init then emits
# ssh_pwauth: true with no authorized key and no password, so cloud-user has no
# credentials at all — by SSH, by virtctl, by anything.
#
# The matching PRIVATE half is demo_ssh_private_key in the vaulted
# playbooks/group_vars/all/secrets.yml, which feeds the "Sales Demos - Linux
# Machine"
# credential in AAP. Change one and you must change the other.
demo_ssh_public_key: "ssh-rsa "

# The *.apps ingress domain for this cluster. Used to construct Route
# hostnames for HTTP access to demo VMs.
#   oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}'
openshift_apps_domain: "apps.cluster-kbjvc.dyn.redhatworkshops.io"

# Namespace the demo VMs are created in.
ocpvirt_namespace: "sales-demos-sandbox"
