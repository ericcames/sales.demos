---
# ============================================================================
# group_vars/sandbox/controller_schedules.yml — nightly teardown for sandbox (#6)
# ============================================================================
# LIVES IN THE PER-ENVIRONMENT DIRECTORY, and that is what scopes it. The
# `_sandbox` suffix only tells dispatch's wildcard merge how to COMBINE variables;
# it does not filter by environment. A suffixed variable placed in group_vars/aap/
# loads for EVERY environment regardless of its name — which is exactly the bug
# this file was split to fix: demo picked up sandbox's 10 PM sweep as well as its
# own 6 PM one, because both were declared in the shared directory.
#
# Same pattern as gateway_settings.yml, which has lived split this way since #21.
#
# Demo VMs should never run overnight. The reason is quota, not headroom, and
# that distinction got sharper in #118: this comment used to argue from "roughly
# 14 GiB of headroom", but the probe measured 75.63 GiB free on sandbox and
# available_memory_gb is now 67. Memory pressure is no longer the argument.
#
# The schedule is still right. An RHDP environment is metered and reclaimed, so
# a VM left running from yesterday burns quota against an environment that
# expires either way — and #92's platform add-ons come out of the same budget
# as the VMs. Capacity is comfortable today and is not guaranteed to stay that
# way, which is an argument for keeping the teardown, not for removing it.
#
# TIMEZONE: America/Phoenix observes NO daylight saving, so times there are a
# fixed UTC offset year-round and a schedule written once never drifts by an
# hour twice a year. TZID makes AAP render and fire them as local Phoenix time
# regardless of the server's timezone.
#
# THERE IS NO `state: absent` BLOCK FOR THE OLD SCHEDULE NAMES, and that is
# deliberate. Deleting a job template in AAP cascades to its schedules, and
# controller_templates.yml retires "Sales Demos - Teardown VMs" in the same
# config.yml run -- so the old schedules go with it. Verify that rather than
# trusting it: after the run, the renamed template should carry these
# schedules and no others.
#
# ONE SWEEP PER OS, AND THAT IS NOT OPTIONAL (#301). Terraform state is keyed
# per OS now, so `Linux Day 1 - Teardown` destroys ONLY the Linux VM -- it can no
# longer see the Windows one. A Windows VM would therefore burn quota all night
# with nothing to reclaim it, which is exactly what the note here predicted when
# the split was still hypothetical. Adding an OS means adding its sweep.
#
# The teardown job template is idempotent: with no VMs in state, terraform
# destroy is skipped outright, so a schedule firing against an already-clean
# environment reports success having done nothing.
#
# "COSTS NOTHING" WAS WRONG, AND THAT IS WHY THE MINUTES BELOW DIFFER (#783).
# Until #783 an empty state key still got a full `terraform init` plus
# `terraform destroy`, and two stray empty keys meant the Linux sweep did that
# three times for one live role. Combined with Linux and Windows firing on the
# same minute, the 10 PM sweep on 2026-09-21 had four EE pods starting at once
# on a node with 1.4 points of disk headroom; kubelet evicted jobs 591 and 593
# mid-run (#782). The sweep now skips empty state and collects the key, and
# Windows runs fifteen minutes after Linux.
#
# THE MINUTE IS THE ONLY THING THAT MOVED. Renaming these schedules would not
# retime them -- infra.aap_configuration looks a schedule up by `name`, so a
# new name creates a SECOND schedule and leaves the original firing at the old
# minute. The names stay as they are, "(6 PM)" and "(10 PM safety net)", and
# the description carries the exact time.
#
# DTSTART is the date the rule starts counting from, not a one-off run date.
# ============================================================================

# TWO SWEEPS. sandbox is the environment being actively built against and work
# sessions run late: 6 PM is the real one, 10 PM catches VMs created after it.
#
# EVERY ROLE, NOT JUST web (#393). Each entry passes all_roles: true, so the
# sweep removes every role that has Terraform state for that OS, db and app
# farms included, not only the job template's `vm_role: web`. It arrives as
# extra_data, which AAP accepts only because the teardown templates prompt for
# variables on launch. Manual launches still remove one role.
controller_schedules_sandbox:
  - name: "Linux Day 1 - Nightly teardown (6 PM)"
    unified_job_template: "Linux Day 1 - Teardown"
    description: "Destroy sandbox demo VMs every day at 6 PM America/Phoenix."
    rrule: "DTSTART;TZID=America/Phoenix:20260810T180000 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true
    extra_data:
      all_roles: true

  - name: "Linux Day 1 - Nightly teardown (10 PM safety net)"
    unified_job_template: "Linux Day 1 - Teardown"
    description: "Second sweep at 10 PM America/Phoenix — catches VMs created after the 6 PM run."
    rrule: "DTSTART;TZID=America/Phoenix:20260810T220000 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true
    extra_data:
      all_roles: true

  - name: "Windows Day 1 - Nightly teardown (6 PM)"
    unified_job_template: "Windows Day 1 - Teardown"
    description: "Destroy sandbox Windows demo VMs every day at 6:15 PM America/Phoenix — fifteen minutes after the Linux sweep, so the two never start together (#783)."
    rrule: "DTSTART;TZID=America/Phoenix:20260810T181500 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true
    extra_data:
      all_roles: true

  - name: "Windows Day 1 - Nightly teardown (10 PM safety net)"
    unified_job_template: "Windows Day 1 - Teardown"
    description: "Second Windows sweep at 10:15 PM America/Phoenix — matches the Linux safety net, offset fifteen minutes (#783)."
    rrule: "DTSTART;TZID=America/Phoenix:20260810T221500 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true
    extra_data:
      all_roles: true
