---
# ===========================================================================
# group_vars/sandbox/gateway_settings.yml — sandbox-only gateway settings
# ===========================================================================
# The other half of the suffix convention: `gateway_settings_all` (in
# group_vars/aap/) holds the pre-login banner every environment shares, and
# this file adds a key only sandbox gets. dispatch MERGES them — see
# infra.aap_configuration/roles/dispatch/tasks/include_wildcard_vars.yml, which
# combines mappings with combine(recursive=true). This file does not replace
# the shared one.
#
# THE TWO FILES MUST SET DISJOINT KEYS. Merging is per-key: a scalar present in
# both does not combine, the environment file simply wins. custom_login_info
# stays shared in group_vars/aap/gateway_settings.yml; only custom_logo is set
# here.
#
# custom_logo is the logo on the AAP SIGN-IN PAGE, shown next to
# custom_login_info. It does NOT change the masthead after login — that is a
# bundled UI asset rather than a setting. Re-measured in #54 with custom_logo
# already applied — 26 KB of base64 PNG — and the masthead still rendered the
# stock lockup. No setting will change that.
#
# RE-VERIFIED ON AAP 2.7 (#101), because this file used to assert a count that
# was measured on 2.6 and is not true here. The live 2.7 gateway on
# cluster-kbjvc returns 41 settings, not the 44 recorded for 2.6. All 41 were
# enumerated and none marks the environment post-login, and custom_logo still
# reads back at 26,714 characters — so the finding held across the version
# change and only the number moved. That is why the count is no longer quoted:
# the conclusion is stable, the tally is not.
#
# So this is a sign-in-time environment marker. You see which environment you
# are entering before you touch anything.
#
# THE POST-LOGIN HALF IS utilities/aap-env-badge/, a browser extension that
# paints a matching pill in the masthead using the same colors. It has to be
# browser-side precisely because of the paragraph above; it changes nothing on
# the cluster, and this file is unaffected by it.
#
# Green for sandbox, red for demo: the environment you break, and the one you
# show customers. Reuses aap_config's severity convention. Regenerate with:
#
#   python3 utilities/make-env-logo.py --env sandbox
#
# The image extends the official product lockup rather than replacing it, so
# Red Hat branding survives and only an environment badge is added. The badge
# carries its own solid background so the environment stays legible in both
# light and dark themes, even where the white wordmark does not.
# ===========================================================================

gateway_settings_sandbox:
  custom_logo: "data:image/png;base64,{{ lookup('ansible.builtin.file', inventory_dir + '/../docs/images/logo-sandbox.png.b64') }}"
