---
# ============================================================================
# group_vars/aap/hub_ee_repositories.yml — mirror the EE into PAH (#35)
# ============================================================================
# Creates the Hub-side EE repository and syncs the image from the stock
# "Red Hat Quay.io" registry (see hub_ee_registries.yml), so the image is present in PAH by
# the time controller_execution_environments.yml points Controller at it.
# Dispatch ordering guarantees the registry is created first.
#
# THE SYNC HAS TWO GATES AND NEEDS BOTH. This was learned the hard way in
# dc1.azure and is repeated here because half of it is invisible:
#
#   1. DISPATCH GATE — a variable named `hub_ee_repository_sync` must be
#      DEFINED. Dispatch includes the role on `when: vars[...] is defined`, and
#      the role never reads the value. Its only job is to exist.
#   2. ROLE GATE — the repository item itself must carry `sync: true`.
#
# Miss either and there is no error: the repository is created, stays empty, and
# Controller later fails to pull an image that was never mirrored.
#
# `wait: true` blocks until the sync finishes, so the EE object is not
# registered against an image that has not landed yet.
# ============================================================================

hub_ee_repositories_all:
  # Alphanumerics and underscores only — this name becomes the image name in
  # Hub, which is why it is sales_demos_ee and not sales-demos-ee. The
  # controller_execution_environments image reference must match it exactly.
  - name: sales_demos_ee
    description: >-
      sales.demos EE — Terraform 1.15.8 · cloud.terraform · kubernetes.core ·
      redhat.openshift_virtualization · infra.aap_configuration. Mirrored from
      quay.io/zigfreed/sales-demos-ee.
    # The registry this repo CREATES, in hub_ee_registries.yml -- not the stock
    # `Red Hat Quay.io`, which #320 found is not present on every environment.
    registry: quay_io
    # A fork that builds and pushes its OWN execution environment mirrors from
    # its own namespace (#132). Pulls from the default are public and work for
    # anyone, so this only matters once you push your own image -- but leaving
    # it hardcoded means a fork silently mirrors someone else's EE. Keep it in
    # step with EE_IMAGE in utilities/build-ee.sh, which is already
    # env-overridable.
    upstream_name: >-
      {{ sales_demos_ee_upstream | default('zigfreed/sales-demos-ee', true) }}
    # Only the pinned immutable tag. Deliberately NOT `latest`: nothing in this
    # repo publishes or references a floating tag, and mirroring one would
    # create a second, moving copy of an image the whole design treats as
    # immutable (see utilities/build-ee.sh — never re-push a tag).
    include_tags:
      # ALL THREE, and that is the additive rule (#122). v1.2.0 adds the helm
      # binary (#324); v1.1.0 stays mirrored as the rollback, so reverting is a
      # one-line change to controller_execution_environments.yml rather than a
      # re-mirror. v1.0.0's stated retirement condition is now met -- v1.1.0 has
      # run real job templates in both environments -- but dropping it is a
      # separate concern and is deliberately not bundled with a version bump.
      - v1.0.0
      - v1.1.0
      - v1.2.0
    # ROLE GATE, and the one place the flag's VALUE is read (#831). Dispatch
    # only checks that hub_ee_repository_sync is defined, so `-e
    # hub_ee_repository_sync=false` used to change nothing. Deriving the role
    # gate from it makes false mean false. Measured: this evaluates to a real
    # bool, and the role's `when: item.sync | default(false)` skips on false.
    # Only pass false on a RE-RUN, when the tags are already in PAH -- on a
    # fresh environment Controller would have nothing to pull.
    sync: "{{ hub_ee_repository_sync | default(true) | bool }}"
    wait: true

# DISPATCH GATE. Dispatch reads only whether this is defined; removing it
# silently skips the sync and leaves the Hub repository empty. Its VALUE is read
# by the role gate above (#831): `-e hub_ee_repository_sync=false` skips the
# multi-minute sync on a re-run where the EE is already mirrored.
#
# Deliberately NOT suffixed `_all`. It is a scalar flag, and the wildcard merge
# in dispatch's include_wildcard_vars.yml only handles lists and dicts — a
# suffixed scalar would be fed to `[] + true` and blow up.
hub_ee_repository_sync: true

# FRESH-ENVIRONMENT EE SYNC RESILIENCE (#547, #831). The upstream defaults (50
# retries x 1s delay = 50s of polling) are not enough on a new cluster where
# the quay registry was just created. #547 raised it to 120 x 2s = 4 minutes,
# and the 2026-09-28 bootstrap measured that as too tight: one config.yml run
# hit 120/120 and failed with "Unknown Error", the next needed 101/120. 300 x 2s
# = 10 minutes. A ceiling, not a delay: a finished sync returns immediately.
hub_configuration_ee_repository_sync_async_retries: 300
hub_configuration_ee_repository_sync_async_delay: 2
