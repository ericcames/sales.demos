---
# ============================================================================
# group_vars/aap/controller_credentials.yml — AAP credentials (#4)
# ============================================================================
# NO OpenShift CREDENTIAL AND NO CONTROLLER CREDENTIAL, and that is still the
# point, even though this file now holds four entries rather than the original
# two. dc1.azure has both; this does not.
#
# Because the job templates run against an inventory sourced from this repo,
# every connection value already arrives through group_vars/<env>/connection.yml:
# openshift_api_url, aap_hostname, namespaces, usernames. Adding AAP credentials
# for those would create a SECOND copy of every hostname, which is exactly what
# CLAUDE.md forbids and what keeps a new RHDP environment to a one-file edit.
# playbooks/provision_vm.yml does still fall back to K8S_AUTH_* / CONTROLLER_*
# environment variables if they are injected, so adding such a credential later
# needs no playbook change — it is just not needed today.
#
# What genuinely cannot come from connection.yml is here:
#   - the vault password, which decrypts secrets.yml (it IS the secret)
#   - the VM's SSH private key, which AAP needs to log in
#   - the credentials themselves, once secrets.yml stops being tracked (#129)
#
# THAT LAST ONE CHANGED THE SHAPE OF THIS FILE. "Sales Demos - Vault" used to be
# sufficient on its own: AAP received the vault-encrypted secrets.yml in the
# project checkout and that credential decrypted it. #130 untracks the file --
# this repo is public and shipping one person's encrypted credentials is what
# makes it un-reusable -- so there is nothing in the checkout left to decrypt.
# "Sales Demos - Env Secrets" carries those values instead. See
# controller_credential_types.yml for why extra_vars means no playbook changed.
# ============================================================================

controller_credentials_all:
  # ---------------------------------------------------------------------
  # Decrypts a vault-encrypted secrets.yml IF the project checkout has one.
  #
  # KEPT ON PURPOSE THOUGH IT IS NOW INERT. Once #130 untracks secrets.yml the
  # project checkout carries no vaulted file, so this credential has nothing to
  # decrypt and "Sales Demos - Env Secrets" below is what actually feeds a job.
  # It stays because it costs nothing, because removing it is a behaviour change
  # for no gain (CLAUDE.md -> additive only), and because anyone who does commit
  # a vaulted file to a fork gets a working decrypt path for free.
  #
  # Attach it to BOTH the job template and the inventory source: the source
  # needs it to read vaulted group_vars during a sync, and the job needs it to
  # read them at run time.
  #
  # vault_id must be `sales.demos` — it must match the label in the file's
  # header ($ANSIBLE_VAULT;1.2;AES256;sales.demos) or AAP will not use this
  # credential to decrypt it.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Vault"
    description: "Vault password for group_vars/aap/secrets.yml (vault_id: sales.demos)"
    organization: "IT Service Automation"
    credential_type: "Vault"
    inputs:
      vault_id: "sales.demos"
      vault_password: "{{ lookup('ansible.builtin.file', '~/secrets/.vault_pass_sales_demos') | trim }}"

  # ---------------------------------------------------------------------
  # Logs in to the provisioned Linux VMs. This is what makes "run playbooks
  # against the VM from AAP" work.
  #
  # AAP reaches the VMs DIRECTLY: it runs on the same cluster, the VMs have
  # headless Services giving stable in-cluster DNS, and there is no
  # NetworkPolicy between the namespaces. So this is plain ssh to port 22 —
  # no bastion, and no virtctl (the execution environment does not have it;
  # `virtctl ssh` is the laptop path, not this one).
  #
  # The key is the private half of demo_ssh_public_key, which cloud-init injects
  # at first boot. If the VM was created while that public key was empty it has
  # NO credentials at all and must be re-created — cloud-init only writes
  # authorized keys on first boot.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Linux Machine"
    description: "SSH into demo RHEL VMs over in-cluster DNS. Private half of demo_ssh_public_key."
    organization: "IT Service Automation"
    credential_type: "Machine"
    inputs:
      username: "{{ linux_admin_username | default('cloud-user') }}"
      ssh_key_data: "{{ demo_ssh_private_key }}"

  # ---------------------------------------------------------------------
  # Lets Controller pull the execution environment from this environment's own
  # Private Automation Hub (#35). PAH requires authentication for container
  # pulls even when the repository is not private, so this is needed regardless
  # of repository visibility.
  #
  # `host` is the AAP hostname itself: the gateway fronts Hub on the same name,
  # so the registry and the API share a host. Verified on 2.6 (#35) and
  # re-verified on 2.7 (#116) — no separate hub route exists on either. It
  # comes from each
  # environment's connection.yml, which is what keeps this credential correct in
  # both sandbox and demo without duplicating a hostname.
  #
  # TLS is genuinely valid here — the *.apps certificate is issued by Google
  # Trust Services — so no `verify_ssl: false` and no cluster-wide
  # insecureRegistries entry. If a future environment serves a self-signed
  # ingress cert, fix the trust, do not disable verification.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - PAH Registry"
    description: "Pull the execution environment from this environment's Private Automation Hub."
    organization: "IT Service Automation"
    credential_type: "Container Registry"
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: true

  # ---------------------------------------------------------------------
  # The credentials a job actually needs, now that they do not arrive in the
  # project checkout (#129). Its type, and the reasoning, are in
  # controller_credential_types.yml.
  #
  # ONE ENTRY, BOTH ENVIRONMENTS, RESOLVED PER RUN. Every value below is read
  # from the vault at CaC time on a laptop -- config.yml is laptop-only, like
  # PAH work -- and pushed into whichever controller --limit selected. So
  # `--limit sandbox` fills sandbox's AAP from env_secrets['sandbox'] and
  # `--limit demo` fills demo's from env_secrets['demo'], off these same lines.
  # Exactly how "Sales Demos - PAH Registry" above already resolves aap_hostname.
  #
  # A MIS-LIMITED RUN WOULD PUT THE WRONG ENVIRONMENT'S TOKEN IN THE WRONG AAP,
  # which is a worse outcome here than it was for a hostname. It is already
  # guarded: playbooks/tasks/assert_target_environment.yml fails closed when
  # --limit and target_env disagree, and config.yml calls it as its first task.
  # That assert is now load-bearing for a second reason -- do not relax it.
  #
  # The two rhsm_* values are NOT per-environment. They are one Red Hat account's
  # org and activation key, shared by both, which is why they are top-level in
  # the vault rather than under env_secrets.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Env Secrets"
    description: "Vault credentials injected as extra_vars, so secrets.yml need not be tracked."
    organization: "IT Service Automation"
    credential_type: "Sales Demos - Env Secrets"
    inputs:
      aap_password: "{{ env_secrets[aap_env_name].aap_password }}"
      openshift_api_token: "{{ env_secrets[aap_env_name].openshift_api_token }}"
      rhsm_org_id: "{{ rhsm_org_id }}"
      rhsm_activation_key: "{{ rhsm_activation_key }}"
