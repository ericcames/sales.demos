---
# ============================================================================
# group_vars/aap/controller_credentials.yml — AAP credentials (#4)
# ============================================================================
# ONLY TWO, AND THAT IS THE POINT. There is deliberately no OpenShift credential
# and no Controller credential here, even though dc1.azure has both.
#
# Because the job templates run against an inventory sourced from this repo,
# every connection value already arrives through group_vars/<env>/connection.yml:
# openshift_api_url, aap_hostname, namespaces, usernames. Adding AAP credentials
# for those would create a SECOND copy of every hostname, which is exactly what
# CLAUDE.md forbids and what keeps a new RHDP environment to a one-file edit.
# playbooks/provision_vm.yml does still fall back to K8S_AUTH_* / CONTROLLER_*
# environment variables if they are injected, so adding such a credential later
# needs no playbook change — it is just not needed today.
#
# What genuinely cannot come from connection.yml is here:
#   - the vault password, which decrypts secrets.yml (it IS the secret)
#   - the VM's SSH private key, which AAP needs to log in
# ============================================================================

controller_credentials_all:
  # ---------------------------------------------------------------------
  # Decrypts the committed, vault-encrypted group_vars/aap/secrets.yml.
  #
  # Attach it to BOTH the job template and the inventory source: the source
  # needs it to read vaulted group_vars during a sync, and the job needs it to
  # read them at run time. Without it every playbook fails on the connection
  # asserts with values that look simply undefined.
  #
  # vault_id must be `sales.demos` — it must match the label in the file's
  # header ($ANSIBLE_VAULT;1.2;AES256;sales.demos) or AAP will not use this
  # credential to decrypt it.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Vault"
    description: "Vault password for group_vars/aap/secrets.yml (vault_id: sales.demos)"
    organization: "IT Service Automation"
    credential_type: "Vault"
    inputs:
      vault_id: "sales.demos"
      vault_password: "{{ lookup('ansible.builtin.file', '~/secrets/.vault_pass_sales_demos') | trim }}"

  # ---------------------------------------------------------------------
  # Logs in to the provisioned Linux VMs. This is what makes "run playbooks
  # against the VM from AAP" work.
  #
  # AAP reaches the VMs DIRECTLY: it runs on the same cluster, the VMs have
  # headless Services giving stable in-cluster DNS, and there is no
  # NetworkPolicy between the namespaces. So this is plain ssh to port 22 —
  # no bastion, and no virtctl (the execution environment does not have it;
  # `virtctl ssh` is the laptop path, not this one).
  #
  # The key is the private half of demo_ssh_public_key, which cloud-init injects
  # at first boot. If the VM was created while that public key was empty it has
  # NO credentials at all and must be re-created — cloud-init only writes
  # authorized keys on first boot.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Linux Machine"
    description: "SSH into demo RHEL VMs over in-cluster DNS. Private half of demo_ssh_public_key."
    organization: "IT Service Automation"
    credential_type: "Machine"
    inputs:
      username: "{{ linux_admin_username | default('cloud-user') }}"
      ssh_key_data: "{{ demo_ssh_private_key }}"
