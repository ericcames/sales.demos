---
# ============================================================================
# group_vars/aap/controller_workflows.yml — the one-button demo build (#47)
# ============================================================================
# NOTE THE VARIABLE NAME. The dispatch role reads workflows from
# `controller_workflows`, not `controller_workflow_job_templates` — the same
# class of quirk as `controller_templates` for job templates. Naming it the
# obvious way means the object is silently never created, with no error.
#
# WHY A WORKFLOW AT ALL. Every step already worked, but building a demo VM took
# three launches in the right order, and the order is not guessable: register
# has to precede configure because the CNV rhel9 image has no repositories, so
# every dnf task fails on an unregistered guest. Encoding the sequence here
# means it cannot be got wrong at 9am in front of a customer.
#
# THE NODES ARE CHAINED ON success_nodes, so a failure stops the chain rather
# than cascading. There are deliberately NO failure_nodes: this repo has no
# ServiceNow incident path, and a failure node that does nothing useful is worse
# than an obvious stop. Why there is no incident path -- and why the write path
# would be servicenow.itsm rather than an MCP server -- is written up in
# docs/demos/mcp-servers/servicenow.md.
#
# THE SURVEY LIVES HERE as well as on the provision template. A workflow survey
# feeds its answers to every node, so one prompt drives the whole chain; the
# nodes that ignore vm_size_tier simply ignore it.
#
# IT ASKS ONE QUESTION, AND IT USED TO ASK TWO (#300). `os_type` was a dropdown
# both here and on the provision template. Answering `windows` set
# create_linux=false in terraform/ocpvirt, which drops `count` to 0 on every
# Linux resource -- and since state is keyed per ENVIRONMENT rather than per OS,
# terraform then planned the RUNNING LINUX VM for destruction. Two places to
# make that mistake, one of them a survey shown to an SE mid-demo.
#
# This is the Linux workflow; it builds Linux, and os_type is pinned on the
# provision template instead. Windows gets its own chain once #301 splits the
# state per OS, which is what actually makes the two independent.
# ============================================================================

# THE `0` IS LOAD-BEARING, AND `Linux Day 1 Workflow` DID NOT WORK (#303).
# #300 named it that expecting it to head its family. Measured against the live
# API -- /unified_job_templates/?order_by=name, which is what the Templates
# page renders -- it sorted LAST, below Teardown.
#
# A dash does not fix it. The same query shows `Windows Day 2 Audit` sorting
# before `Windows Day 2 - Check SMB Server`, so Postgres ignores the
# punctuation at the primary collation level and `Linux Day 1 - Workflow`
# normalises to exactly what the old name did. What the same data does show is
# digits sorting ahead of letters (`5 Check` before `Repair`) -- which is what
# makes the numbered steps work, and which rules out any word-based name here
# because `- Build` would land after all five steps.
#
# So: step 0 is the thing that runs steps 1-5. Measure, do not assume, if this
# is ever renamed again.
controller_workflows_all:
  # =====================================================================
  # CLUSTER DAY 0 (#330) — one button from a bare cluster to demo-ready.
  #
  # NAMED BARE, WITH NO SUFFIX, AND THAT ASYMMETRY IS DELIBERATE. `Linux Day 1
  # - 0 Workflow` needed the `0` because "Workflow" sorts after "Teardown";
  # here the workflow name is a PREFIX of every template in its family, and a
  # shorter string that prefixes the others sorts first for free. Do not
  # "fix" this into consistency with the Linux one -- that would push it to the
  # bottom of its own family, which is exactly what #303 had to undo.
  #
  # IT CROSSES FAMILIES, ON PURPOSE. The middle node is a `Golden Image`
  # template, not a `Cluster Day 0` one. That is a real dependency rather than
  # untidiness: `2 Verify Environment` builds an actual VM from a boot source,
  # so running it before the RHEL 9 image is linked reports a false failure on
  # a cluster that is fine. This is the first workflow here to span two
  # prefixes; if a third family ever joins, keep the reason in the comment.
  #
  # WINDOWS IS DELIBERATELY NOT A NODE. That import is the slow one, and an
  # environment that only ever shows the Linux demo should not pay for it.
  # Run `Golden Image - Link Windows 2022 CIS L1` separately when it is wanted.
  # =====================================================================
  - name: "Cluster Day 0"
    description: >-
      Take a bare cluster to demo-ready: install OpenShift Virtualization, link
      the RHEL 9 CIS L1 golden image, then prove the environment really works by
      building a VM and timing it.
    organization: "IT Service Automation"
    labels:
      - cluster
      - day-0
      - ocpvirt
    inventory: "Sales Demo VMs"
    # Same reason as the Linux workflow: the module only ADDS nodes, it does not
    # diff them, so a renamed template leaves a stale reference behind (#240).
    destroy_current_nodes: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: "How to install OpenShift Virtualization"
      # TWO QUESTIONS, AND THE SHORTNESS IS THE POINT. Nearly every Day 0 input
      # is auto-detected -- cnv_storage_class defaults to "" and discovers the
      # class, the timeouts are already tuned. A survey padded with defaults
      # nobody changes makes the automation look arbitrary rather than
      # considered, which is the opposite of why it is shown to a customer.
      # These two are real decisions.
      spec:
        - question_name: OpenShift Virtualization update channel
          question_description: >-
            Which operator channel to subscribe to. `stable` is what every demo
            environment should use; the choice is surfaced so the version is
            visibly a decision rather than an accident.
          variable: cnv_channel
          type: multiplechoice
          required: true
          default: stable
          choices:
            - stable
            - candidate
        - question_name: Wait for the boot source to finish importing
          question_description: >-
            Blocks until the RHEL 9 DataSource reports Ready. Leave this on —
            it is most of why the run takes ten minutes or more, and turning it
            off means the next step can start against an image that has not
            landed.
          variable: cnv_wait_for_datasource
          type: multiplechoice
          required: true
          default: "true"
          choices:
            - "true"
            - "false"

    related:
      workflow_nodes:
        - identifier: install_cnv
          unified_job_template:
            name: "Cluster Day 0 - 1 Install OpenShift Virtualization"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: link_rhel9

        # The cross-family node. See the header.
        - identifier: link_rhel9
          unified_job_template:
            name: "Golden Image - Link RHEL 9 CIS L1"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: verify

        - identifier: verify
          unified_job_template:
            name: "Cluster Day 0 - 2 Verify Environment"
            type: job_template
            organization:
              name: "IT Service Automation"

  - name: "Linux Day 1 - 0 Workflow"
    description: >-
      Build a Linux demo VM end to end: provision, register it to the Red Hat
      CDN, configure the web server, scan it for CIS compliance, and verify it
      — one button, in the only order that works.
    organization: "IT Service Automation"
    # ocpvirt because this chains Provision, which runs terraform. The nodes
    # that only reach the guest over SSH do not carry it -- see the header of
    # controller_labels.yml for why that line is drawn where it is (#303).
    labels:
      - linux
      - day-1
      - ocpvirt
    # Force the module to tear down the existing nodes and recreate them from
    # the definition below. Without this, renaming the JTs in #240 left the
    # old node references in place — the module only adds, it does not diff.
    destroy_current_nodes: true
    # The inventory the nodes run against. Each job template also carries its
    # own, and the node-level template wins; this is the workflow's default.
    inventory: "Sales Demo VMs"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a VM size tier"
      spec:
        - question_name: VM size tier
          question_description: >-
            T-shirt size (2v/4G, 2v/8G, 4v/16G). Sized for doubled RHDP
            hardware; terraform/ocpvirt enforces a memory budget.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: small
          choices:
            - small
            - medium
            - large

    related:
      workflow_nodes:
        # 1. Terraform creates the VM and registers it as a managed host.
        #    Note this returns BEFORE the guest's sshd is up — the next node
        #    handles that, see below.
        - identifier: provision
          unified_job_template:
            name: "Linux Day 1 - 1 Provision"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: register

        # 2. Waits for SSH, then attaches to the Red Hat CDN.
        #
        #    THE WAIT IS THE REASON THIS WORKFLOW IS NOT NAIVE. provision
        #    returns as soon as terraform apply finishes, and the guest takes
        #    roughly another minute to accept connections — observed twice as
        #    "Connection refused" on a job run immediately after provisioning.
        #    In a workflow the nodes run back to back with no human pause, so
        #    the gate lives in register_linux_vm.yml itself rather than here, where it
        #    also protects the one-shot and by-hand paths.
        - identifier: register
          unified_job_template:
            name: "Linux Day 1 - 2 Register"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: configure

        # 3. httpd, firewalld, Cockpit, the demo page and its logos, security
        #    patching, and facts.json. Fails on an unregistered guest, which is
        #    why it is chained rather than run in parallel with register.
        - identifier: configure
          unified_job_template:
            name: "Linux Day 1 - 3 Configure"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: compliance

        # 4. OpenSCAP CIS Level 1 scan (#202). Proves the golden image's
        #    hardening by running oscap and publishing the report at
        #    <web_url>/compliance/. Expected to show some deviations after
        #    configure — httpd, cockpit, and firewall changes are the delta.
        - identifier: compliance
          unified_job_template:
            name: "Linux Day 1 - 4 Compliance Scan"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: check

        # 5. Logs in and gathers facts, so the workflow ends by proving the VM
        #    is genuinely reachable and configured rather than that the tasks
        #    merely ran. Caches facts into AAP, where they show on the host.
        - identifier: check
          unified_job_template:
            name: "Linux Day 1 - 5 Check"
            type: job_template
            organization:
              name: "IT Service Automation"

  # -------------------------------------------------------------------
  # WINDOWS DAY 1 (#340). The Linux workflow's counterpart, node for node.
  #
  # THE `0` IN THE NAME IS LOAD-BEARING, AND IT WAS MEASURED RATHER THAN
  # ASSUMED. Postgres ignores punctuation at the primary collation level, so
  # `Windows Day 1 - Workflow` would sort AFTER every numbered step and land
  # last in its own family. Confirmed against the live API before this was
  # committed — /api/controller/v2/unified_job_templates/?order_by=name returns
  # `Linux Day 1 - 0 Workflow` ahead of `Linux Day 1 - 1 Provision`, and the
  # same rule puts this ahead of `Windows Day 1 - 1 Provision`. #303 is the
  # precedent; `Cluster Day 0` is bare only because its name already prefixes
  # every template in that family.
  #
  # NODE 2 IS PATCH, WHERE LINUX HAS REGISTER — see the header above the
  # Windows templates in controller_templates.yml for why.
  #
  # SUCCESS NODES ONLY, NO FAILURE NODES, matching Linux. A failed node should
  # stop the chain and leave the VM where it broke, so an SE can run the
  # remaining steps by hand against a guest they can still inspect.
  # -------------------------------------------------------------------
  - name: "Windows Day 1 - 0 Workflow"
    description: >-
      Build a Windows demo VM end to end: provision, patch it from Windows
      Update, install IIS and publish the demo page, verify its CIS L1
      hardening, and check the Route actually serves — one button, in the only
      order that works.
    organization: "IT Service Automation"
    # ocpvirt because this chains Provision, which runs terraform. The four
    # nodes that only reach the guest over WinRM do not carry it -- see the
    # header of controller_labels.yml for why that line is drawn where it is.
    labels:
      - windows
      - day-1
      - ocpvirt
    # Force the module to tear down the existing nodes and recreate them from
    # the definition below. The module only adds; it does not diff.
    destroy_current_nodes: true
    # The inventory the nodes run against. Each job template also carries its
    # own, and the node-level template wins; this is the workflow's default.
    inventory: "Sales Demo VMs"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a VM size tier"
      spec:
        - question_name: VM size tier
          question_description: >-
            T-shirt size (2v/4G, 2v/8G, 4v/16G). Windows gets a 60 GiB root
            disk regardless of tier — see windows_min_disk_gb in
            terraform/ocpvirt/locals.tf.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: small
          choices:
            - small
            - medium
            - large

    related:
      workflow_nodes:
        # 1. Terraform creates the VM and registers it as a managed host.
        #    Returns BEFORE the guest is reachable — the next node handles
        #    that, see below.
        - identifier: provision
          unified_job_template:
            name: "Windows Day 1 - 1 Provision"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: patch

        # 2. Waits for WinRM, then applies Security and Critical updates.
        #
        #    THE WAIT IS THE REASON THIS WORKFLOW IS NOT NAIVE, and the Windows
        #    gap is much wider than the Linux one. Provision returns as soon as
        #    terraform apply finishes; the clone then completes sysprep's
        #    specialize and oobeSystem passes and runs the FirstLogonCommands
        #    that stand up the WinRM listener. The gate lives in
        #    patch_windows_vm.yml itself rather than here, where it also
        #    protects the one-shot and by-hand paths.
        - identifier: patch
          unified_job_template:
            name: "Windows Day 1 - 2 Patch"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: configure

        # 3. IIS, the port 80 firewall rule, the demo page and its logos,
        #    facts.json, and the pre-authentication legal notice.
        #
        #    CHAINED AFTER PATCH BY PREFERENCE, NOT BY REQUIREMENT — and that
        #    is the opposite of the Linux pair, where configure genuinely fails
        #    on an unregistered guest. The Windows golden image ships complete,
        #    so IIS would install either way. Running patch first means any
        #    reboot happens before anything is serving.
        - identifier: configure
          unified_job_template:
            name: "Windows Day 1 - 3 Configure"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: compliance

        # 4. CIS L1 verification, published at <web_url>/compliance/ beside the
        #    demo page. Expected to show documented EXCEPTIONS rather than
        #    failures -- the opposite of the Linux node, whose story is the
        #    delta a workload introduces.
        - identifier: compliance
          unified_job_template:
            name: "Windows Day 1 - 4 Compliance Scan"
            type: job_template
            organization:
              name: "IT Service Automation"
          related:
            success_nodes:
              - identifier: check

        # 5. Logs in, gathers facts, and proves the ROUTE serves the page --
        #    not merely that IIS is up. So the workflow ends on the claim the
        #    demo is actually judged on.
        - identifier: check
          unified_job_template:
            name: "Windows Day 1 - 5 Check"
            type: job_template
            organization:
              name: "IT Service Automation"

  # -------------------------------------------------------------------
  # Retired name — #300 moved every template and workflow into a family
  # prefix. The module does not rename in place: it creates the new name
  # and leaves the old one behind, so without this the two would sit side
  # by side in the AAP UI and the stale one would still be launchable.
  #
  # Deleting a workflow deletes its nodes with it. The nodes of the NEW
  # workflow are rebuilt from the definition above by destroy_current_nodes.
  # -------------------------------------------------------------------
  - name: "Sales Demos - Build Demo VM"
    organization: "IT Service Automation"
    state: absent

  # Retired by #303 — `Linux Day 1 Workflow` sorted last in its own family.
  - name: "Linux Day 1 Workflow"
    organization: "IT Service Automation"
    state: absent
