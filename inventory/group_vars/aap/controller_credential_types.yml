---
# ============================================================================
# group_vars/aap/controller_credential_types.yml — the vault's replacement (#129)
# ============================================================================
# ONE CUSTOM CREDENTIAL TYPE, AND IT EXISTS SO secrets.yml NEED NOT BE COMMITTED.
#
# Until now every job template carried "Sales Demos - Vault", whose only job was
# to decrypt the vault-encrypted secrets.yml that AAP received *in the project's
# SCM checkout*. That works only while the file is tracked. #130 untracks it —
# the repo is public and shipping one person's encrypted credentials is what
# makes it un-reusable — and the moment it is untracked AAP's checkout has no
# secrets.yml at all: env_secrets goes undefined and every template fails on the
# connection asserts.
#
# So the secrets have to reach a job some other way. AAP's own answer is a custom
# credential type whose fields are write-only and whose injectors set extra_vars.
#
# WHY THIS NEEDS NO PLAYBOOK OR connection.yml CHANGE. group_vars/<env>/
# connection.yml defines aap_password as env_secrets[aap_env_name].aap_password.
# extra_vars outrank group_vars, so in AAP the injected extra_var wins and that
# env_secrets expression is never evaluated — lazily shadowed, not failed. On a
# laptop there are no extra_vars, the local vaulted file supplies env_secrets,
# and the identical line resolves. One variable contract, both entry points,
# which is the rule in CLAUDE.md -> "Skills and playbooks".
#
# THIS IS NOT THE #4 RESTRICTION. AAP rejects Vault credentials on SCM inventory
# SOURCES ("Credentials of type insights and vault are disallowed for scm
# inventory sources"). That is about inventory sources. This is a job template
# credential, which is the sanctioned way to feed a job a secret.
#
# ONE TYPE, TWO ENVIRONMENTS, NO ENV KEY IN THE FIELDS. Each RHDP environment has
# its OWN AAP — see the note on aap_env_name in controller_templates.yml. There is
# no single controller that has to hold both sets, so the fields are flat and
# `config.yml --limit sandbox` fills sandbox's controller from
# env_secrets['sandbox'] while `--limit demo` fills demo's from env_secrets['demo'].
# Same as "Sales Demos - PAH Registry" already does with aap_hostname.
#
# ROTATION IS NOW AN EXPLICIT ACT, and that is the one real regression. With the
# vaulted file in SCM, editing the vault propagated on the next project sync. Now
# a rotated token does nothing until config.yml is re-run FOR THAT ENVIRONMENT.
# Say so out loud when handing this to anyone: refresh the vault, then re-apply.
#
# ADDING A FIELD TO A TYPE THAT IS ALREADY IN USE MAY BE REFUSED. AAP will not
# always let a credential type's inputs change while credentials of that type
# exist. If a config.yml run fails on this type, delete the credential and then
# the type, and re-run -- dispatch recreates both from this file and
# controller_credentials.yml, and every value comes from the vault, so nothing
# is lost but the objects themselves. Job templates re-attach by name.
#
# `{  {` IS NOT A TYPO. The controller_credential_types role rewrites `{  {`
# (brace, two spaces, brace) into `{{` before sending the injectors to AAP. That
# is the collection's documented escape hatch for Jinja that AAP must evaluate
# rather than Ansible: written normally, Ansible would expand `{{ aap_password }}`
# against this inventory at CaC time and inject the *value* as a literal template
# default. Written with the two spaces, AAP receives `{{ aap_password }}` and
# substitutes the credential's own field at launch. Do not "fix" the spacing.
# ============================================================================

controller_credential_types_all:
  - name: "Sales Demos - Env Secrets"
    description: "Credentials from the vault, injected as extra_vars so secrets.yml need not be tracked."
    kind: cloud
    inputs:
      fields:
        # Every field is secret: true, which makes it WRITE-ONLY. AAP will accept
        # a new value and never return it — not through the API, not in the UI,
        # and not in job output while aap_configuration_secure_logging is on.
        # That is the property that lets these live in a controller at all.
        - id: aap_password
          type: string
          label: "AAP admin password"
          secret: true
          help_text: "env_secrets[<env>].aap_password. Shadows the value connection.yml would resolve."
        - id: openshift_api_token
          type: string
          label: "OpenShift API token"
          secret: true
          help_text: "env_secrets[<env>].openshift_api_token. RHDP tokens are short-lived — expect to re-apply."
        - id: rhsm_org_id
          type: string
          label: "Red Hat org ID"
          secret: true
          help_text: "Required by playbooks/roles/linux_register. Without it the guests never get package repos."
        - id: rhsm_activation_key
          type: string
          label: "Red Hat activation key"
          secret: true
          help_text: "Required by playbooks/roles/linux_register, alongside rhsm_org_id."
        - id: linux_admin_password
          type: string
          label: "Linux VM password"
          secret: true
          help_text: "Cockpit login password (#63). Optional — empty disables Cockpit auth."
        - id: windows_admin_password
          type: string
          label: "Windows VM password"
          secret: true
          help_text: "Local administrator password set by the sysprep unattend (#305). Needs 14+ characters — CIS L1 for Windows Server 2022 rejects shorter."

        # --- Grafana Cloud (#318) -------------------------------------------
        # ONE GRAFANA CLOUD SPANS BOTH ENVIRONMENTS, so unlike the credentials
        # above these are NOT keyed per environment -- they are top-level in the
        # vault and both controllers receive identical values.
        #
        # URLS AND USERNAMES ARE DELIBERATELY NOT SECRET. A write-only field
        # renders as "ENCRYPTED" in the AAP UI, which makes a mistyped push
        # endpoint undiagnosable without re-reading the vault. Only the tokens
        # are genuinely credentials.
        - id: grafana_cloud_url
          type: string
          label: "Grafana Cloud URL"
          help_text: "Stack URL, e.g. https://<stack>.grafana.net. Read by deploy_dashboard.yml."
        - id: grafana_cloud_editor_sa_token
          type: string
          label: "Grafana Cloud editor token"
          secret: true
          help_text: "Editor-role service account token. Separate from the Viewer token the MCP server reads — MCP reads, Ansible writes, and that split is a demo talking point."
        - id: grafana_cloud_prom_push_url
          type: string
          label: "Grafana Cloud Prometheus push URL"
          help_text: "Remote-write endpoint Alloy federates metrics to."
        - id: grafana_cloud_prom_username
          type: string
          label: "Grafana Cloud Prometheus user"
          help_text: "Numeric instance ID for the Prometheus endpoint."
        - id: grafana_cloud_loki_push_url
          type: string
          label: "Grafana Cloud Loki push URL"
          help_text: "Log push endpoint Alloy streams pod logs to."
        - id: grafana_cloud_loki_username
          type: string
          label: "Grafana Cloud Loki user"
          help_text: "Numeric instance ID for the Loki endpoint."
        - id: grafana_cloud_push_api_key
          type: string
          label: "Grafana Cloud push API key"
          secret: true
          help_text: "Shared by both push endpoints. Read by deploy_alloy.yml."

        # --- Quay, for the private Windows containerdisk (#318) --------------
        # ONLY link_windows_image.yml needs these. link_rhel9_image.yml does
        # not: that repository is public, which is why the RHEL link would have
        # worked from AAP without any credential change at all.
        - id: quay_username
          type: string
          label: "Quay username"
          help_text: "Pull credentials for the PRIVATE Windows golden containerdisk. A Windows image cannot be redistributed publicly."
        - id: quay_password
          type: string
          label: "Quay password"
          secret: true
          help_text: "Paired with quay_username. Read by link_windows_image.yml."
      # THESE FOUR ARE REQUIRED so a half-filled credential fails at creation
      # rather than mid-demo. Every one is already in the vault, so there is
      # nothing extra for an operator to find.
      #
      # The Grafana and quay fields added in #318 are deliberately NOT required.
      # They are consumed by four templates out of fifteen, and an environment
      # that never deploys Alloy or links the Windows image should not be blocked
      # from creating the credential every Day 1 template depends on.
      required:
        - aap_password
        - openshift_api_token
        - rhsm_org_id
        - rhsm_activation_key
    injectors:
      extra_vars:
        aap_password: "{  { aap_password }}"
        openshift_api_token: "{  { openshift_api_token }}"
        rhsm_org_id: "{  { rhsm_org_id }}"
        rhsm_activation_key: "{  { rhsm_activation_key }}"
        linux_admin_password: "{  { linux_admin_password }}"
        windows_admin_password: "{  { windows_admin_password }}"
        grafana_cloud_url: "{  { grafana_cloud_url }}"
        grafana_cloud_editor_sa_token: "{  { grafana_cloud_editor_sa_token }}"
        grafana_cloud_prom_push_url: "{  { grafana_cloud_prom_push_url }}"
        grafana_cloud_prom_username: "{  { grafana_cloud_prom_username }}"
        grafana_cloud_loki_push_url: "{  { grafana_cloud_loki_push_url }}"
        grafana_cloud_loki_username: "{  { grafana_cloud_loki_username }}"
        grafana_cloud_push_api_key: "{  { grafana_cloud_push_api_key }}"
        quay_username: "{  { quay_username }}"
        quay_password: "{  { quay_password }}"
