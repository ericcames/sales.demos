  #
  # Day 1 and Day 2 are not properties of the WORK, they are properties of when
  # you press the button. `Windows Day 1 - 2 Patch` and `Windows Day 2 - Patch`
  # already run the same patch_windows_vm.yml; #300's taxonomy made that call
  # once, and repeating it beats inventing a second convention. So a Day 2 entry
  # is an ALIAS, NOT A FORK -- same playbook, same role, different defaults.
  #
  # THE DEFAULT DIFFERENCE IS WHAT EARNS THE SECOND OBJECT, and it is real:
  # demo_facts_compare is false on the chain step because a VM the chain has
  # just built has nothing to compare against, and true here because drift is
  # the entire reason to press this button. Anything that made the two
  # identical would mean deleting one of them.
  #
  # NO NUMBER, because these are off-chain -- the same reason Repair, Teardown
  # and every other Windows Day 2 template carries none.
