---
# ============================================================================
# group_vars/aap/controller_templates.yml — job templates and surveys (#4)
# ============================================================================
# THE VARIABLE IS controller_templates, NOT controller_job_templates. A known
# quirk of infra.aap_configuration — the role reads job templates from
# `controller_templates`, confirmed in dc1.azure and a sibling daily-demo repo,
# both of which carry the same note. Naming it the obvious way means the
# objects are silently never created, with no error.
#
# SURVEY VARIABLE NAMES ARE THE CONTRACT. `hypervisor` and `vm_size_tier`
# here must match playbooks/provision_vm.yml's extra_vars and the
# ocpvirt-provision skill prompts exactly. The tier strings must also match
# the validation block in terraform/ocpvirt/variables.tf. Changing one means
# changing all of them. `os_type` is part of the same contract but is NOT
# surveyed -- it is pinned on the templates, for the reason written at the
# Provision entry below.
#
# TEMPLATE NAMES ARE A TAXONOMY, NOT DECORATION (#300). Two families:
#
#   AAP Ecosystem - <verb>        platform add-ons; installs AAP capability,
#                                 belongs to no demo story
#   <OS> Day <n> - <step>         one demo story's chain
#
# The rule that decides which objects get renamed: `Sales Demos` survives on
# SHARED PLATFORM objects -- the project, the EE, the inventory, every
# credential -- because Windows Day 1 will use exactly the same ones, so the
# repo's name is their correct scope. Templates and workflows belong to one
# story, so they take that story's name. This is why the credential lists
# below still say "Sales Demos - Vault" and always will.
#
# CHAIN STEPS CARRY THEIR POSITION (`1 Provision`, `2 Register`). AAP sorts
# the templates list alphabetically, which groups the families correctly but
# would otherwise scramble the chain into dictionary order -- and an SE
# following along mid-demo needs to know what runs next, not what starts with
# C. Off-chain templates (Repair, Teardown) take no number and sort after.
# Inserting a step means renumbering, which means a rename: add the new name
# and a `state: absent` for the old, the same as every other rename here.
#
# MOST TEMPLATES RUN AGAINST "Sales Demo VMs", which holds the synced control
# hosts and the demo VMs together — see controller_inventories.yml. They differ
# only in `limit`: provisioning targets `sandbox` (a control host, because
# provision_vm.yml is `hosts: aap`), VM-facing work targets `linuxweb`.
#
# "Sales Demo VMs - Control" is NOT used here. It is reserved for teardown (#6),
# which cannot run in the inventory whose hosts it deletes.
# ============================================================================

controller_templates_all:
  # ---------------------------------------------------------------------
  # Provision. The template that finally exercises the execution environment
  # built in #31 — nothing had run on it before this.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 1 Provision"
    description: "Run Terraform for the selected hypervisor and register the new VMs in the Sales Demo VMs inventory."
    labels:
      - linux
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/provision_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      # Everything that is not a credential comes from connection.yml via the
      # project-sourced inventory. The credentials themselves come from these
      # two, and BOTH are on every template in this file.
      #
      # "Sales Demos - Env Secrets" is the one that does the work: it injects
      # aap_password, openshift_api_token and the two rhsm_* values as extra_vars,
      # which outrank the group_vars definitions in connection.yml. "Sales Demos
      # - Vault" is the old path, kept and inert -- see the headers of
      # controller_credentials.yml and controller_credential_types.yml (#129).
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    # `limit` selects the environment, exactly as --limit does on the CLI, and
    # target_env makes the run fail closed if the two ever disagree — see
    # playbooks/tasks/assert_target_environment.yml.
    #
    # BOTH ARE TEMPLATED OFF aap_env_name, and that matters. Each RHDP
    # environment has its OWN AAP, and this `_all` entry is created in every one
    # of them. A literal `sandbox` here would put a sandbox-limited template
    # inside demo's AAP — and because both environments sync the same
    # hosts.yml, `sandbox-local` exists there too, so it would happily run
    # against sandbox's cluster from demo's controller. aap_env_name comes from
    # each environment's connection.yml, so every AAP gets a template pointed at
    # itself.
    #
    # There is deliberately no survey question for the environment: a dropdown
    # is one mis-click away from provisioning into the customer-facing env.
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # PINNED, NOT SURVEYED, AND THAT IS A SAFETY FIX (#300). os_type used to
      # be a dropdown here. terraform/ocpvirt/locals.tf derives create_linux
      # from it and that drives `count` on every Linux resource block, while
      # tasks/terraform_ocpvirt.yml keys state as secret_suffix=<env> -- one
      # state per ENVIRONMENT, holding both OSes. So picking `windows` in the
      # survey set create_linux=false, count dropped to 0, and terraform
      # planned the RUNNING LINUX VM for destruction. A dropdown that destroys
      # the demo you are standing in front of does not belong in the UI.
      #
      # This template is the Linux family's, so it only ever builds Linux.
      # Windows gets its own once state is split per OS -- see #301, which is
      # what actually makes the two independent.
      os_type: linux
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a hypervisor and VM size tier"
      spec:
        - question_name: Hypervisor
          question_description: >-
            Which infrastructure provider to provision on. OCP Virt is the
            default and only provider today; others will be added in later
            phases of #237.
          variable: hypervisor
          type: multiplechoice
          required: true
          default: ocpvirt
          choices:
            - ocpvirt
        - question_name: VM size tier
          question_description: >-
            T-shirt size (2v/4G, 2v/8G, 4v/16G). Sized for doubled RHDP
            hardware; terraform/ocpvirt enforces a memory budget.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          # LARGE, NOT SMALL, AND THAT IS THE POINT OF A DEMO. Set 2026-09-08:
          # these are demo machines and the thing being demonstrated is speed,
          # so the default should not be the tier that makes every step slower.
          # A large guest is 4 vCPU / 16 GiB; the cluster has room for a large
          # Linux and a large Windows at once. Pick a smaller tier deliberately
          # when the smaller tier is what you are showing.
          default: large
          choices:
            - small
            - medium
            - large

  # ---------------------------------------------------------------------
  # Teardown (#6). The ONLY template that runs against the control inventory,
  # because it deletes hosts from "Sales Demo VMs" and AAP locks the hosts of
  # the inventory a running job is using.
  #
  # Scheduled nightly — see controller_schedules.yml.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - Teardown"
    description: "Destroy the demo VMs and deregister them. Leaves CNV, the boot-source DataSources, and the Terraform state namespace intact."
    labels:
      - linux
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs - Control"
    project: "Sales Demos"
    playbook: playbooks/teardown.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
      # Teardown now CONNECTS to the guests before destroying them, to release
      # the Red Hat subscription and remove the Insights host (#47). Without
      # this credential those steps fail silently-ish — they are best-effort by
      # design — and every cycle leaks an entitlement.
      - "Sales Demos - Linux Machine"
    limit: "{{ aap_env_name }}"
    extra_vars:
      # teardown.yml REQUIRES target_env explicitly — stricter than every other
      # playbook here, because a mistyped limit on a destroy is the difference
      # between rebuilding a sandbox VM and wiping the environment a customer is
      # about to be shown.
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # Must match what was provisioned, or destroy plans a different shape than
      # was built. These are the defaults; a run that used another tier should
      # pass its own on launch.
      os_type: linux
      vm_size_tier: small
    # So a teardown of a non-default tier can be launched without editing the
    # template. The scheduled runs use the extra_vars above.
    ask_variables_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4, split into two templates so Linux Day 1 - 0 Workflow can gate
  # them separately (#47). `Linux Day 1 - Repair` below still does
  # both in one shot for re-configuring Linux VMs that already exist.
  #
  # REGISTER MUST SUCCEED BEFORE CONFIGURE. They look independent and are not:
  # the CNV rhel9 image has no repositories, so every dnf task in configure
  # fails on an unregistered guest.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 2 Register"
    description: "Wait for SSH, then attach the Linux demo VMs to the Red Hat CDN. Nothing can install packages until this succeeds."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/register_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  - name: "Linux Day 1 - 3 Configure"
    description: "Install and configure the Linux demo web server. Requires a registered guest."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/configure_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4 (#5) — the demo itself. Registers the guest to the Red Hat CDN,
  # then installs and configures the web server.
  #
  # THE REGISTRATION STEP IS NOT OPTIONAL. The CNV rhel9 image ships with no
  # repositories, so every dnf task fails without it.
  #
  # Needs BOTH credentials: Machine to log in to the guest, and Vault to
  # decrypt the registration credentials out of secrets.yml.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - Repair"
    description: "Register the Linux demo VMs and configure the web server. Turns the web_url Route from 503 into the demo page."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/repair_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    # So a single misbehaving VM can be targeted without editing the template.
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Reach the VMs. This is the one that proves AAP can run playbooks AGAINST
  # a demo VM, rather than merely create it.
  #
  # Runs against the TARGET inventory with the Machine credential, connecting
  # over in-cluster DNS on port 22. No bastion, no virtctl.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 5 Check"
    description: "Smoke test: log in to the provisioned Linux VMs over in-cluster DNS and gather facts."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/check_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      # THE VAULT CREDENTIAL IS REQUIRED EVEN THOUGH THIS PLAYBOOK USES NO
      # SECRETS. group_vars/all/secrets.yml is loaded for every play, so Ansible
      # parses the vaulted file whatever the playbook does with it. Without this
      # the job dies before its first task with
      #   ERROR! Attempting to decrypt but no vault secrets found
      # which says nothing about credentials. That is the cost of `all` scope,
      # and it applies to every job template in this repo.
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    # Defaults to the linuxweb group; ask on launch so the same template can be
    # pointed at one host when a single VM is misbehaving.
    limit: linuxweb
    ask_limit_on_launch: true
    # Persist the gathered facts in AAP's database, so they appear in the host's
    # Facts tab and survive the job that collected them (#47). The same
    # information is written to <web_url>/facts.json by linux_configure — this
    # is the controller-side copy, that one is the curl-able copy.
    use_fact_cache: true

  # ---------------------------------------------------------------------
  # CIS compliance scan (#202). Runs OpenSCAP with the CIS Level 1 Server
  # profile against the demo VMs and publishes an HTML report at
  # <web_url>/compliance/report.html. Expected to show some deviations
  # after linux_configure, since httpd/cockpit/firewall changes depart
  # from a hardened baseline — that delta is the demo point.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 4 Compliance Scan"
    description: "Run an OpenSCAP CIS Level 1 scan and publish the report at <web_url>/compliance/."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/linux_compliance_scan.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Automation Orchestrator (#141). Installs CloudNativePG, builds the three
  # databases, installs the AO operator and creates the instance.
  #
  # RUNS AGAINST THE CLUSTER, NOT THE GUESTS, so it takes `limit:
  # {{ aap_env_name }}` like Provision does rather than `linuxweb` — the
  # playbook is `hosts: aap`. No Machine credential for the same reason.
  #
  # setup.yml already runs this stage by default, so this template is for
  # re-running it on its own: an environment that was built with
  # `install_ao=false`, or one where the AO stack needs reconciling without
  # re-running CNV and the whole AAP configuration.
  # ---------------------------------------------------------------------
  # AAP VALIDATES `playbook:` AGAINST THE PROJECT'S SCM CHECKOUT, so this entry
  # cannot be created until playbooks/install_ao.yml is on the branch the "Sales
  # Demos" project syncs. Adding a template and its playbook in the same PR
  # therefore fails config.yml once, with
  #   Unable to create job_template ...: {'playbook': ['Playbook not found for project.']}
  # and succeeds on the first run after the merge. That is ordering, not
  # misconfiguration — do not "fix" it by removing the template.
  - name: "AAP Ecosystem - Install Automation Orchestrator"
    description: "Install Automation Orchestrator and its CloudNativePG database, then verify the Route serves a page."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/install_ao.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # The self-service portal (#103), runnable from AAP since #324.
  #
  # IT WAS LAPTOP-ONLY UNTIL THEN, AND THE REASON IS WORTH KEEPING. Added in
  # #300, it failed ten seconds after every launch for two independent reasons:
  # portal.yml pointed Helm at a gitignored .kube/<env>.kubeconfig the SCM
  # checkout never had, and the EE carried no helm binary at all. Fixing either
  # alone only moved the failure.
  #
  # WHY #300 GOT IT WRONG, recorded so the check is not skipped again: the
  # template was justified on `hosts: aap` plus the right credentials, matching
  # Install Automation Orchestrator. But AO and Install MCP Server use
  # kubernetes.core.k8s, which reaches the API directly through K8S_AUTH_*.
  # portal.yml SHELLS OUT to a binary.
  #
  # WHAT A PLAYBOOK EXECUTES IS PART OF WHETHER IT CAN RUN FROM AAP, not just
  # what it targets. utilities/run-in-ee.sh and /sales-demos-verify-ee exist to
  # catch exactly that, and neither was run against this template before it
  # shipped.
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Install Self-Service Portal"
    description: "Deploy the AAP self-service portal (RHDH with the AAP plugin), create its OAuth application, and sync the org list. Needs EE v1.2.0 or later — it is the first template here that depends on the helm binary."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/portal.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # The AAP MCP server (#102), which setup.yml installs as stage 4 but which
  # had no way to be re-run on its own until #308.
  #
  # WHY RE-RUNNING IT STANDALONE MATTERS. aap_mcp_allow_write_operations is the
  # write posture for an AI agent against AAP, and Red Hat's documentation is
  # explicit that changing it requires deleting and recreating the
  # AnsibleMCPServer CR rather than patching it. mcp_server.yml already does
  # exactly that — it reads the live object and deletes it when the flag
  # differs. Without this template the only way to reach that logic was to
  # re-run the whole of setup.yml, which also reinstalls CNV and reapplies the
  # entire AAP configuration.
  #
  # THIS DEPLOYS THE SERVER, NOT THE CLIENT. Wiring a laptop to it is
  # `claude mcp add --scope local` via the sales-demos-mcp skill, which writes
  # to the operator's own config and is deliberately laptop-only (#102). Do not
  # expect this template to change anything on your machine.
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Install MCP Server"
    description: "Deploy the AAP MCP server into this environment. Deploys the SERVER only — wiring a laptop to it is the sales-demos-mcp skill."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/mcp_server.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # =====================================================================
  # CLUSTER DAY 0 (#330). Prepare the CLUSTER to host demos, before any VM
  # exists. The subject of Day 1 is the VM; the subject of Day 0 is the cluster.
  #
  # THIS IS THE "MINIMUM LAPTOP" HALF. Standing up an environment used to be a
  # terminal job end to end. It is now one laptop command -- config.yml, which
  # creates these very templates and therefore cannot be one of them -- and
  # then buttons. Work in a terminal is invisible to a customer; work in AAP is
  # the demo.
  #
  # WHAT DELIBERATELY STAYS ON THE LAPTOP, so nobody hunts for a template that
  # cannot exist: the EE build (podman plus the Red Hat offline token that #22
  # and #68 keep to a single copy), config.yml itself, and sync_hub /
  # curate_hub for the same token reason.
  #
  # ALL THREE ARE `hosts: aap` WITH NO SHELL-OUTS -- kubernetes.core and
  # ansible.builtin only. That check is not ceremony: #324 shipped a template
  # for a playbook that shells out to helm, which the EE did not carry, and it
  # failed on every launch for a week. What a playbook EXECUTES decides whether
  # it can run from AAP, not what it targets.
  # =====================================================================
  - name: "Cluster Day 0 - 1 Install OpenShift Virtualization"
    description: "Install OpenShift Virtualization on this cluster and wait for the operator to be ready. Idempotent — converges on a cluster that already has it."
    labels:
      - cluster
      - day-0
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/install_cnv.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  - name: "Cluster Day 0 - 2 Verify Environment"
    description: "Prove the environment is genuinely demo-ready: boot sources imported, storage on the fast clone path, ingress admitting Routes. Builds one real VM, times it, destroys it."
    labels:
      - cluster
      - day-0
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/prepare_env.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # UNNUMBERED, because it is not part of the chain -- same rule as Repair and
  # Teardown. It is read-only and runs at any time, including mid-demo, which
  # is what the `read-only` label exists to say.
  - name: "Cluster Day 0 - Probe Capacity"
    description: "Measure what this cluster actually has — allocatable, already requested, genuinely free — and recommend available_memory_gb. Strictly read-only, safe to run during a live demo."
    labels:
      - cluster
      - ocpvirt
      - read-only
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/probe_env.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # =====================================================================
  # AAP OBSERVABILITY (#318). Instrument the platform, then visualise it.
  #
  # NUMBERED BECAUSE IT IS A CHAIN. Dashboards pushed at a cluster with no
  # Alloy render twelve empty panels — the data has to be flowing first. The
  # two are not wired into a workflow because the dashboard half is not
  # per-environment (see below), so a workflow would imply a per-env sequence
  # that does not exist.
  # =====================================================================
  - name: "AAP Observability - 1 Deploy Alloy"
    description: "Deploy Grafana Alloy into this cluster: federate metrics from the built-in Prometheus and stream pod logs to Grafana Cloud."
    labels:
      - observability
      - install
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/deploy_alloy.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # THE ONLY TEMPLATE HERE THAT IS NOT PER-ENVIRONMENT, and that has to be
  # said out loud or it will be assumed otherwise.
  #
  # deploy_dashboard.yml is `hosts: localhost` and takes no --limit: Grafana
  # Cloud is ONE external service spanning both environments. So this template
  # exists in both controllers and pushes to the SAME Grafana folder. That is
  # idempotent and harmless — re-runs update in place — but it means running it
  # from demo also updates what sandbox sees, and vice versa.
  #
  # `inventory` is set only because AAP requires one. The play targets implicit
  # localhost and never touches those hosts, which is also why there is no
  # `limit` and no target_env: there is no environment to assert against.
  # ---------------------------------------------------------------------
  - name: "AAP Observability - 2 Deploy Dashboards"
    description: "Push the Cluster Health dashboard to Grafana Cloud as code. NOT per-environment — one Grafana Cloud spans both, so this updates the same folder whichever controller runs it."
    labels:
      - observability
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/deploy_dashboard.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"

  # =====================================================================
  # GOLDEN IMAGE (#318). Point CNV at the CIS-hardened images that
  # image.builder.pipeline publishes.
  #
  # "GOLDEN IMAGE", NOT "IMAGE BUILD". These CONSUME a published
  # containerdisk; nothing here builds one. Building lives in the producer
  # repo, and naming this family for a verb it does not perform would send
  # someone to the wrong repository.
  #
  # NOT NUMBERED, unlike the Observability pair: the two links are entirely
  # independent and either can run alone. Same rule as Repair and Teardown.
  #
  # THEY ARE NOT SYMMETRIC IN WHAT THEY NEED. The RHEL 9 repository is public,
  # so that link needs no quay credentials at all and would have run from AAP
  # before #318. Windows is private — a Windows image cannot be redistributed
  # publicly — so it needs quay_username / quay_password, and those are the
  # reason the credential type had to be rebuilt.
  # =====================================================================
  - name: "Golden Image - Link RHEL 9 CIS L1"
    description: "Point CNV at the published RHEL 9 CIS L1 golden image, populating the rhel9-cis-l1 boot source. Public repository — no pull secret needed."
    labels:
      - golden-image
      - linux
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/link_rhel9_image.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  - name: "Golden Image - Link Windows 2022 CIS L1"
    description: "Point CNV at the published Windows Server 2022 CIS L1 golden image, taking over the empty win2k22 placeholder. Creates a pull secret for the private quay repository."
    labels:
      - golden-image
      - windows
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/link_windows_image.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # WINDOWS DAY 1 (#301, completed by #340). The full eight-object family,
  # mirroring Linux: a workflow, five numbered steps, an off-chain Repair,
  # plus Provision and Teardown.
  #
  # THIS BLOCK USED TO SAY "Provision and Teardown only — deliberately", and
  # gave three reasons that have each since stopped being true. Recorded rather
  # than deleted, because the shape of the answer matters:
  #
  #   * "this repo has no configure_windows_vm.yml" — it does now (#340 part 2),
  #     along with patch, compliance, check and repair.
  #   * "ansible.windows is not in collections/requirements.yml" — pinned at
  #     3.6.1 in #339.
  #   * "would need ... an EE rebuild" — it did not. The published image
  #     already shipped ansible.windows 3.6.1 and pywinrm 0.5.0; #339 measured
  #     it rather than assuming, and the riskiest step in the plan evaporated.
  #
  # SLOT 2 IS PATCH, WHERE LINUX HAS REGISTER. Windows has no CDN registration
  # to do — the golden image ships complete, unlike the CNV rhel9 image which
  # has no repositories at all. The honest analogue of "entitle the guest to
  # content" is "point it at its update source and bring it current", and it
  # puts any reboot BEFORE IIS is installed, which is the safe order.
  #
  # THE `ocpvirt` LABEL GOES ON PROVISION AND TEARDOWN ONLY. Those two run
  # terraform; the five guest-facing steps reach the VM over WinRM and know
  # nothing about the hypervisor. Same line as the Linux family draws — see the
  # header of controller_labels.yml (#303).
  #
  # EVERY ONE CARRIES THE VAULT CREDENTIAL, including the steps that use no
  # secrets, because group_vars/all/secrets.yml is parsed for every play. See
  # the note on Linux Day 1 - 5 Check above.
  #
  # THESE COULD NOT EXIST BEFORE THE STATE SPLIT. With one state per
  # environment, launching a Windows provision set create_linux=false and
  # planned the running Linux VM for destruction, so shipping this button
  # earlier would have handed an SE a way to delete the demo mid-demo. #300
  # removed the dropdown that did it; #301 removed the possibility.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - 1 Provision"
    description: "Build a Windows demo VM from the CIS L1 hardened golden image. Independent of the Linux VM — separate Terraform state."
    labels:
      - windows
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/provision_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # Pinned, not surveyed — the same reasoning as the Linux template.
      os_type: windows
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a hypervisor and VM size tier"
      spec:
        - question_name: Hypervisor
          question_description: >-
            Which infrastructure provider to provision on. OCP Virt is the
            default and only provider today.
          variable: hypervisor
          type: multiplechoice
          required: true
          default: ocpvirt
          choices:
            - ocpvirt
        - question_name: VM size tier
          question_description: >-
            T-shirt size. Windows gets a 60 GiB root disk regardless of tier —
            see windows_min_disk_gb in terraform/ocpvirt/locals.tf.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          # LARGE, NOT SMALL, AND THAT IS THE POINT OF A DEMO. Set 2026-09-08:
          # these are demo machines and the thing being demonstrated is speed,
          # so the default should not be the tier that makes every step slower.
          # A large guest is 4 vCPU / 16 GiB; the cluster has room for a large
          # Linux and a large Windows at once. Pick a smaller tier deliberately
          # when the smaller tier is what you are showing.
          default: large
          choices:
            - small
            - medium
            - large

  # ---------------------------------------------------------------------
  # Node 2. Windows Update, in the slot Linux uses for CDN registration.
  #
  # IT WAITS FOR WinRM BEFORE ANYTHING ELSE, and that wait is the reason the
  # workflow is not naive. Provision returns as soon as terraform apply
  # finishes; a Windows clone then has to complete sysprep's specialize and
  # oobeSystem passes and run the FirstLogonCommands that stand up the WinRM
  # listener. That is considerably longer than the Linux guest's ~1 minute to
  # sshd. The gate lives in patch_windows_vm.yml itself rather than here, so it
  # also protects the one-shot and by-hand paths.
  #
  # THE SURVEY ACTUALLY WORKS, WHICH IS NOT A GIVEN. The role this was ported
  # from kept both of these in vars/, which outranks a survey — so its patching
  # survey could not change anything it appeared to control, and wrote to a
  # variable named `patches` the role never read. Both live in defaults/ here.
  # The variable names below and the role's defaults ARE the contract; changing
  # one without the other silently restores the original defect.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - 2 Patch"
    description: "Wait for WinRM, then search Windows Update and install one of what it finds. Installing everything takes 45+ minutes on a fresh guest, so it is opt-in."
    labels:
      - windows
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/patch_windows_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Windows Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: windemo
    ask_limit_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Choose how much to patch, and whether to reboot"
      spec:
        # REPORT-ONLY IS THE DEFAULT, AND IT IS A MEASUREMENT. Timed on sandbox
        # 2026-09-08 against a large guest built from the golden image: search
        # ~2 min, download ~4 min, install 10 min+ -- over 16 minutes for the
        # node, with the phases separated using this repo's own Grafana
        # dashboard. Reporting drift in ~2 minutes is the better demo beat;
        # installing is one click away here for when patching IS the story.
        - question_name: What to do
          question_description: >-
            Report only (~2 min) tells you how far behind the machine is without
            changing it. One (the default) installs a single update, so the demo
            shows a real change without the wait. Install applies everything and
            took over 45 minutes on a fresh guest -- opt into it deliberately.
          variable: windows_patching_state
          # `one` HERE, MATCHING THE ROLE'S OWN DEFAULT. It read `searched` for
          # one commit and the two disagreed, which is worse than either value:
          # a survey default always wins over a role default, so the shipped
          # behaviour was report-only while the role, the CHANGELOG and the
          # docs all said it installed one. Measured on job 435 -- "Mode:
          # searched" in the output against `windows_patching_state: one` in
          # defaults/main.yml. The survey values ARE the contract; when they
          # drift from the role the role loses silently.
          type: multiplechoice
          required: true
          default: one
          # `one` MUST BE IN THIS LIST, and it was not: AAP rejects the whole
          # survey with "Default choice must be answered from the choices
          # listed" and config.yml fails. The mode was added to the role and the
          # choices here were left behind.
          #
          # `downloaded` IS DELIBERATELY GONE. It was offered here and the role
          # has no branch for it, so choosing it did exactly what `searched`
          # does -- a decorative option, which is the same defect this role was
          # ported to fix. Three modes, each of which does something distinct.
          choices:
            - searched
            - one
            - installed
        - question_name: Update categories
          question_description: >-
            Which Windows Update categories to apply. The default two keep the
            node short enough to run in front of a customer; the wider sets can
            take half an hour on a fresh clone.
          variable: windows_patching_categories
          type: multiselect
          required: true
          default: "SecurityUpdates\nCriticalUpdates"
          choices:
            - SecurityUpdates
            - CriticalUpdates
            - UpdateRollups
            - DefinitionUpdates
            - Updates
        - question_name: Reboot if updates require it
          question_description: >-
            Off by default — a reboot mid-demo takes the page away with someone
            watching, and these VMs are rebuilt nightly. Turn it on when
            patching IS the demo. Note the node runs before IIS is installed,
            so a reboot here costs nothing that is serving yet.
          variable: windows_patching_reboot
          type: multiplechoice
          required: true
          default: "no"
          choices:
            - "no"
            - "yes"

  # ---------------------------------------------------------------------
  # Node 3. IIS, the demo page, the firewall rule, and the legal notice.
  #
  # THIS IS THE NODE THAT TURNS web_url FROM 503 INTO A PAGE. terraform/ocpvirt
  # wires the Windows Service and Route to port 80 (#340 part 1) and until
  # something serves there the Route correctly returns 503.
  #
  # UNLIKE ITS LINUX COUNTERPART IT DOES NOT DEPEND ON THE NODE BEFORE IT. The
  # Linux configure step fails outright on an unregistered guest because every
  # dnf task has no repository to reach. The Windows golden image ships
  # complete and carries its own feature source, so IIS installs whether or not
  # patching ran. The chain still runs Patch first — that is ordering by
  # preference, not by requirement, and it is worth knowing which.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - 3 Configure"
    description: "Install IIS, open the firewall for HTTP, and publish the demo page. Turns the web_url Route from 503 into the demo page."
    labels:
      - windows
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/configure_windows_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Windows Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: windemo
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Node 4. CIS L1 verification, published beside the demo page.
  #
  # NAMED "Compliance Scan" TO SIT WITH ITS LINUX SIBLING; THE ROLE VERIFIES.
  # OpenSCAP ships no Windows agent, so there is no oscap to run. Instead the
  # role reads 27 controls that image.builder.pipeline's cis_profile.yml
  # ENABLES back off the running guest, in one WinRM round trip, and reports
  # the controls that file does not enable as documented exceptions rather than
  # as failures. The published report says "verification" in its own title, so
  # the artifact cannot mislead anyone who opens it.
  #
  # THE EXCEPTIONS NUMBER SIXTEEN, NOT FOUR. cis_profile.yml sets four
  # win22cis_rule_*: false, but it also sets win_skip_for_test: true, which the
  # vendored ansible-lockdown role documents as skipping eleven more. The
  # sixteenth is this repo's own: terraform/ocpvirt/main.tf puts
  # LocalAccountTokenFilterPolicy back to 1 in the sysprep unattend so NTLM
  # works for demoadmin, which is CIS 18.4.1 undone at provisioning time.
  #
  # ALL READS, so it is safe to re-run mid-demo — and it does NOT fail the node
  # on a non-compliant control by default, for the same reason linux_compliance
  # treats oscap's exit code 2 as expected: the report is the deliverable, and
  # a red node in front of a customer teaches nothing.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - 4 Compliance Scan"
    description: "Verify the CIS Level 1 hardening on the guest and publish the report at <web_url>/compliance/. All reads — safe to re-run mid-demo."
    labels:
      - windows
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/windows_compliance_scan.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Windows Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: windemo
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Node 5. Reach the VM, and prove the Route — two separate claims.
  #
  # win_uri to http://localhost/ runs ON the guest and proves IIS is serving.
  # It deliberately cannot prove the firewall rule, because loopback traffic is
  # not filtered by Windows Firewall. The second check runs ansible.builtin.uri
  # on the EXECUTION NODE against web_url, traversing the Route, the Service,
  # the pod network and the guest's firewall — the path a customer's browser
  # takes.
  #
  # A 503 FAILS THIS NODE; UNREACHABLE DOES NOT. IIS up plus a 503 is a
  # specific, actionable failure, almost always the guest firewall. An
  # execution node that cannot reach the Route at all says nothing about the
  # guest, and failing there would blame the VM for the network between AAP and
  # the router.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - 5 Check"
    description: "Smoke test: log in over WinRM, gather facts, and prove the Route serves the page rather than only that IIS is running."
    labels:
      - windows
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/check_windows_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Windows Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: windemo
    ask_limit_on_launch: true
    # Persist the gathered facts in AAP's database so they appear in the host's
    # Facts tab, matching Linux Day 1 - 5 Check. The same information is written
    # to <web_url>/facts.json by windows_configure — this is the controller-side
    # copy, that one is the curl-able copy.
    use_fact_cache: true

  # ---------------------------------------------------------------------
  # Off-chain. For a Windows VM that ALREADY EXISTS — a page tweak, a re-run
  # after a failed step, or the recovery half of a break/fix story — without
  # going anywhere near terraform.
  #
  # IT RUNS THE COMPLIANCE STEP TOO, AND THAT IS #300'S LESSON TAKEN RATHER
  # THAN RE-LEARNED. The Linux repair path did not scan at first, so a repair
  # rewrote the demo page and left YESTERDAY'S report beside it, still being
  # served, now describing a machine that no longer existed in that state. The
  # workflow scanned and this path did not, and the two entry points disagreed
  # about what "configured" means. Building the Windows wrapper with all three
  # from the outset is cheaper than fixing it twice.
  # ---------------------------------------------------------------------
  - name: "Windows Day 1 - Repair"
    description: "Patch, configure and re-verify an existing Windows demo VM in one shot. Lands it in the same state a freshly built one reaches."
    labels:
      - windows
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/repair_windows_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Windows Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: windemo
    # So a single misbehaving VM can be targeted without editing the template.
    ask_limit_on_launch: true

  - name: "Windows Day 1 - Teardown"
    description: "Destroy the Windows demo VM only. The Linux VM has its own state and is untouched."
    labels:
      - windows
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs - Control"
    project: "Sales Demos"
    playbook: playbooks/teardown.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      os_type: windows
      vm_size_tier: small
    ask_variables_on_launch: true

  # -------------------------------------------------------------------
  # Retired names. Two rounds of renaming live here.
  #
  # #240 renamed the originals to Linux-scoped equivalents; #300 then moved
  # every template into a family prefix -- `Linux Day 1 - ` for the demo
  # chain, `AAP Ecosystem - ` for platform add-ons -- so an SE reading the
  # AAP templates list can tell a demo step from an installer, and so the
  # alphabetical sort puts the chain in run order.
  #
  # state: absent removes them from AAP on the next config.yml run. Leave
  # them here: both environments are configured from this one file, and a
  # name is only really retired once config.yml has run against demo too.
  # -------------------------------------------------------------------
  - name: "Sales Demos - Register VMs"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Configure VMs"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Run Demo"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Check VMs"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Compliance Scan"
    organization: "IT Service Automation"
    state: absent

