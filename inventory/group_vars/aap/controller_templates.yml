  # The fix step is a real remediation, targeted at linuxweb. One
  # template per remediation; the allow-list maps drift → template.
  # -------------------------------------------------------------------
  - name: "Linux Day 2 - Decide Remediation"
    description: >-
      Rule-table decide step: reads the drift diff, looks up the first
      investigate-severity row in the allow-list, and proposes a
      remediation. Publishes the template name as a workflow artifact.
    labels:
      - linux
      - day-2
      - agentic
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/decide_remediation.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    ask_variables_on_launch: true

