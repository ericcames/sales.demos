---
# ============================================================================
# group_vars/aap/controller_templates.yml — job templates and surveys (#4)
# ============================================================================
# THE VARIABLE IS controller_templates, NOT controller_job_templates. A known
# quirk of infra.aap_configuration — the role reads job templates from
# `controller_templates`, confirmed in dc1.azure and a sibling daily-demo repo,
# both of which carry the same note. Naming it the obvious way means the
# objects are silently never created, with no error.
#
# SURVEY VARIABLE NAMES ARE THE CONTRACT. `hypervisor` and `vm_size_tier`
# here must match playbooks/provision_vm.yml's extra_vars and the
# ocpvirt-provision skill prompts exactly. The tier strings must also match
# the validation block in terraform/ocpvirt/variables.tf. Changing one means
# changing all of them. `os_type` is part of the same contract but is NOT
# surveyed -- it is pinned on the templates, for the reason written at the
# Provision entry below.
#
# TEMPLATE NAMES ARE A TAXONOMY, NOT DECORATION (#300). Two families:
#
#   AAP Ecosystem - <verb>        platform add-ons; installs AAP capability,
#                                 belongs to no demo story
#   <OS> Day <n> - <step>         one demo story's chain
#
# The rule that decides which objects get renamed: `Sales Demos` survives on
# SHARED PLATFORM objects -- the project, the EE, the inventory, every
# credential -- because Windows Day 1 will use exactly the same ones, so the
# repo's name is their correct scope. Templates and workflows belong to one
# story, so they take that story's name. This is why the credential lists
# below still say "Sales Demos - Vault" and always will.
#
# CHAIN STEPS CARRY THEIR POSITION (`1 Provision`, `2 Register`). AAP sorts
# the templates list alphabetically, which groups the families correctly but
# would otherwise scramble the chain into dictionary order -- and an SE
# following along mid-demo needs to know what runs next, not what starts with
# C. Off-chain templates (Repair, Teardown) take no number and sort after.
# Inserting a step means renumbering, which means a rename: add the new name
# and a `state: absent` for the old, the same as every other rename here.
#
# MOST TEMPLATES RUN AGAINST "Sales Demo VMs", which holds the synced control
# hosts and the demo VMs together — see controller_inventories.yml. They differ
# only in `limit`: provisioning targets `sandbox` (a control host, because
# provision_vm.yml is `hosts: aap`), VM-facing work targets `linuxweb`.
#
# "Sales Demo VMs - Control" is NOT used here. It is reserved for teardown (#6),
# which cannot run in the inventory whose hosts it deletes.
# ============================================================================

controller_templates_all:
  # ---------------------------------------------------------------------
  # Provision. The template that finally exercises the execution environment
  # built in #31 — nothing had run on it before this.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 1 Provision"
    description: "Run Terraform for the selected hypervisor and register the new VMs in the Sales Demo VMs inventory."
    labels:
      - linux
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/provision_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      # Everything that is not a credential comes from connection.yml via the
      # project-sourced inventory. The credentials themselves come from these
      # two, and BOTH are on every template in this file.
      #
      # "Sales Demos - Env Secrets" is the one that does the work: it injects
      # aap_password, openshift_api_token and the two rhsm_* values as extra_vars,
      # which outrank the group_vars definitions in connection.yml. "Sales Demos
      # - Vault" is the old path, kept and inert -- see the headers of
      # controller_credentials.yml and controller_credential_types.yml (#129).
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    # `limit` selects the environment, exactly as --limit does on the CLI, and
    # target_env makes the run fail closed if the two ever disagree — see
    # playbooks/tasks/assert_target_environment.yml.
    #
    # BOTH ARE TEMPLATED OFF aap_env_name, and that matters. Each RHDP
    # environment has its OWN AAP, and this `_all` entry is created in every one
    # of them. A literal `sandbox` here would put a sandbox-limited template
    # inside demo's AAP — and because both environments sync the same
    # hosts.yml, `sandbox-local` exists there too, so it would happily run
    # against sandbox's cluster from demo's controller. aap_env_name comes from
    # each environment's connection.yml, so every AAP gets a template pointed at
    # itself.
    #
    # There is deliberately no survey question for the environment: a dropdown
    # is one mis-click away from provisioning into the customer-facing env.
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # PINNED, NOT SURVEYED, AND THAT IS A SAFETY FIX (#300). os_type used to
      # be a dropdown here. terraform/ocpvirt/locals.tf derives create_linux
      # from it and that drives `count` on every Linux resource block, while
      # tasks/terraform_ocpvirt.yml keys state as secret_suffix=<env> -- one
      # state per ENVIRONMENT, holding both OSes. So picking `windows` in the
      # survey set create_linux=false, count dropped to 0, and terraform
      # planned the RUNNING LINUX VM for destruction. A dropdown that destroys
      # the demo you are standing in front of does not belong in the UI.
      #
      # This template is the Linux family's, so it only ever builds Linux.
      # Windows gets its own once state is split per OS -- see #301, which is
      # what actually makes the two independent.
      os_type: linux
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a hypervisor, VM size tier, workload role and farm size"
      spec:
        - question_name: Hypervisor
          question_description: >-
            Which infrastructure provider to provision on. OCP Virt is the
            default and only provider today; others will be added in later
            phases of #237.
          variable: hypervisor
          type: multiplechoice
          required: true
          default: ocpvirt
          choices:
            - ocpvirt
        - question_name: VM size tier
          question_description: >-
            T-shirt size (2v/4G, 2v/8G, 4v/16G). Sized for doubled RHDP
            hardware; terraform/ocpvirt enforces a memory budget.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          # LARGE, NOT SMALL, AND THAT IS THE POINT OF A DEMO. Set 2026-09-08:
          # these are demo machines and the thing being demonstrated is speed,
          # so the default should not be the tier that makes every step slower.
          # A large guest is 4 vCPU / 16 GiB; the cluster has room for a large
          # Linux and a large Windows at once. Pick a smaller tier deliberately
          # when the smaller tier is what you are showing.
          default: large
          choices:
            - small
            - medium
            - large
        - question_name: Workload role
          question_description: >-
            What these machines are FOR, not how big they are. Becomes part of
            the VM name (web-win-1), the NetBIOS hostname, and the AAP host
            name. Each role has its OWN Terraform state, so a `db` build cannot
            disturb a running `web` farm — and a teardown must be given the
            same role it was built with, or it destroys nothing.
          variable: vm_role
          type: multiplechoice
          required: true
          default: web
          choices:
            - web
            - db
            - app
        - question_name: How many VMs
          question_description: >-
            Size of the farm, 1 or 2. The memory budget is checked twice
            before anything is built — terraform/ocpvirt multiplies the tier by
            this count, and provision_vm.yml asks the cluster what is already
            running. 1 builds a single VM, exactly as before this was added.
            The ceiling was 10 until #397, which is not a number this platform
            can reach: three large guests already exceed available_memory_gb,
            so the dropdown was offering eight values whose only outcome was
            the budget refusing them.
          variable: vm_count
          type: integer
          required: true
          default: 1
          min: 1
          max: 2

  # ---------------------------------------------------------------------
  # Teardown (#6). The ONLY template that runs against the control inventory,
  # because it deletes hosts from "Sales Demo VMs" and AAP locks the hosts of
  # the inventory a running job is using.
  #
  # Scheduled nightly — see controller_schedules.yml.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - Teardown"
    description: "Destroy the demo VMs and deregister them. Leaves CNV, the boot-source DataSources, and the Terraform state namespace intact."
    labels:
      - linux
      - day-1
      - ocpvirt
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs - Control"
    project: "Sales Demos"
    playbook: playbooks/teardown.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
      # Teardown now CONNECTS to the guests before destroying them, to release
      # the Red Hat subscription and remove the Insights host (#47). Without
      # this credential those steps fail silently-ish — they are best-effort by
      # design — and every cycle leaks an entitlement.
      - "Sales Demos - Linux Machine"
    limit: "{{ aap_env_name }}"
    extra_vars:
      # teardown.yml REQUIRES target_env explicitly — stricter than every other
      # playbook here, because a mistyped limit on a destroy is the difference
      # between rebuilding a sandbox VM and wiping the environment a customer is
      # about to be shown.
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # THE CLUSTER THIS DESTROYS, RENDERED BY config.yml (#611). This template
      # runs against `Sales Demo VMs - Control`, which #528's host vars do not
      # reach (its inventory source has overwrite_vars: true). Without these
      # lines the job reads connection.yml from the SCM checkout, which is
      # allowed to be stale, and aims every destroy at a dead cluster while
      # local.yml names the live one. config.yml renders them from the laptop,
      # so local.yml wins exactly as it does for the main inventory.
      # Credentials still arrive through the Env Secrets credential (#129).
      aap_hostname: "{{ aap_hostname }}"
      openshift_api_url: "{{ openshift_api_url }}"
      openshift_apps_domain: "{{ openshift_apps_domain }}"
      ocpvirt_namespace: "{{ ocpvirt_namespace }}"
      demo_ssh_public_key: "{{ demo_ssh_public_key }}"
      # Must match what was provisioned, or destroy plans a different shape than
      # was built. These are the defaults; a run that used another tier should
      # pass its own on launch.
      os_type: linux
      vm_size_tier: small
      # THE ROLE MUST MATCH WHAT WAS BUILT (#389). It is part of the Terraform
      # state key, so a teardown given the wrong role inits an EMPTY state,
      # destroys nothing, and still goes green — the VMs keep running and
      # nothing says so. `web` is the provision default, so the scheduled
      # nightly runs match the scheduled nightly builds. A farm built under
      # another role must be torn down by passing that role on launch, which is
      # what ask_variables_on_launch below is for.
      #
      # THE NIGHTLY SCHEDULES DO NOT USE THIS ROLE (#393). Each passes
      # `all_roles: true` in its extra_data, and teardown.yml then tears down
      # every role with Terraform state for this OS, found from the state
      # Secrets. A manual launch removes only this `web` unless it also passes
      # `all_roles: true`.
      vm_role: web
    # So a teardown of a non-default tier can be launched without editing the
    # template. The scheduled runs use the extra_vars above.
    ask_variables_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4, split into two templates so Linux Day 1 - 0 Workflow can gate
  # them separately (#47). `Linux Day 1 - Repair` below still does
  # both in one shot for re-configuring Linux VMs that already exist.
  #
  # REGISTER MUST SUCCEED BEFORE CONFIGURE. They look independent and are not:
  # the CNV rhel9 image has no repositories, so every dnf task in configure
  # fails on an unregistered guest.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 2 Register"
    description: "Wait for SSH, then attach the Linux demo VMs to the Red Hat CDN. Nothing can install packages until this succeeds."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/register_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  - name: "Linux Day 1 - 3 Configure"
    description: "Install and configure the Linux demo web server. Requires a registered guest."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/configure_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4 (#5) — the demo itself. Registers the guest to the Red Hat CDN,
  # then installs and configures the web server.
  #
  # THE REGISTRATION STEP IS NOT OPTIONAL. The CNV rhel9 image ships with no
  # repositories, so every dnf task fails without it.
  #
  # Needs BOTH credentials: Machine to log in to the guest, and Vault to
  # decrypt the registration credentials out of secrets.yml.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - Repair"
    description: "Register the Linux demo VMs and configure the web server. Turns the web_url Route from 503 into the demo page."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/repair_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    # So a single misbehaving VM can be targeted without editing the template.
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Reach the VMs. This is the one that proves AAP can run playbooks AGAINST
  # a demo VM, rather than merely create it.
  #
  # Runs against the TARGET inventory with the Machine credential, connecting
  # over in-cluster DNS on port 22. No bastion, no virtctl.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 5 Check and Gather Facts"
    description: "Log in to the provisioned Linux VMs over in-cluster DNS, then curate, cache and publish their facts."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/check_linux_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      # THE VAULT CREDENTIAL IS REQUIRED EVEN THOUGH THIS PLAYBOOK USES NO
      # SECRETS. group_vars/all/secrets.yml is loaded for every play, so Ansible
      # parses the vaulted file whatever the playbook does with it. Without this
      # the job dies before its first task with
      #   ERROR! Attempting to decrypt but no vault secrets found
      # which says nothing about credentials. That is the cost of `all` scope,
      # and it applies to every job template in this repo.
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
      # Lets demo_facts read this host's PREVIOUSLY cached facts back out of
      # the controller (#648). Unused unless comparison is turned on, and
      # harmless when it is off. controller_credentials.yml explains why the
      # one extra_var it collides with carries the same value either way.
      - "Sales Demos - Controller"
    # Defaults to the linuxweb group; ask on launch so the same template can be
    # pointed at one host when a single VM is misbehaving.
    limit: linuxweb
    ask_limit_on_launch: true
    # Persist the gathered facts in AAP's database, so they appear in the host's
    # Facts tab and survive the job that collected them (#47). The same
    # information is written to <web_url>/facts.json by linux_configure — this
    # is the controller-side copy, that one is the curl-able copy.
    #
    # THE NAME NOW SAYS SO (#647). This flag has been set since #47 and nothing
    # in the template list mentioned it, so the capability was plumbed and
    # un-narrated — every Day 1 run was already populating the Facts tab and no
    # SE had a reason to look. The playbook now also prints a curated summary
    # and publishes <web_url>/facts.html, which is what the rename describes.
    use_fact_cache: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: "How much of the fact set to show, and whether to compare against last time"
      spec:
        - question_name: Show full facts
          question_description: >-
            Also print the entire ansible_facts dict to the job log. Off by
            default because on Windows it is roughly a megabyte and unreadable
            on screen. The full set is stored in AAP's database either way —
            that is what use_fact_cache does, and it is the point being made.
          variable: demo_facts_show_full
          type: multiplechoice
          required: false
          default: "false"
          choices:
            - "false"
            - "true"
        - question_name: Compare against the previously cached facts
          question_description: >-
            Report what changed since the last run. Off here because a VM this
            chain has just built has no previous facts to compare against; the
            Day 2 template defaults it on. Implemented in #648.
          variable: demo_facts_compare
          type: multiplechoice
          required: false
          default: "false"
          choices:
            - "false"
            - "true"

  # ---------------------------------------------------------------------
  # CIS compliance scan (#202). Runs OpenSCAP with the CIS Level 1 Server
  # profile against the demo VMs and publishes an HTML report at
  # <web_url>/compliance/report.html. Expected to show some deviations
  # after linux_configure, since httpd/cockpit/firewall changes depart
  # from a hardened baseline — that delta is the demo point.
  # ---------------------------------------------------------------------
  - name: "Linux Day 1 - 4 Compliance Scan"
    description: "Run an OpenSCAP CIS Level 1 scan and publish the report at <web_url>/compliance/."
    labels:
      - linux
      - day-1
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/linux_compliance_scan.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Automation Orchestrator (#141). Installs CloudNativePG, builds the three
  # databases, installs the AO operator and creates the instance.
  #
  # RUNS AGAINST THE CLUSTER, NOT THE GUESTS, so it takes `limit:
  # {{ aap_env_name }}` like Provision does rather than `linuxweb` — the
  # playbook is `hosts: aap`. No Machine credential for the same reason.
  #
  # setup.yml already runs this stage by default, so this template is for
  # re-running it on its own: an environment that was built with
  # `install_ao=false`, or one where the AO stack needs reconciling without
  # re-running CNV and the whole AAP configuration.
  # ---------------------------------------------------------------------
  # AAP VALIDATES `playbook:` AGAINST THE PROJECT'S SCM CHECKOUT, so this entry
  # cannot be created until playbooks/install_ao.yml is on the branch the "Sales
  # Demos" project syncs. Adding a template and its playbook in the same PR
  # therefore fails config.yml once, with
  #   Unable to create job_template ...: {'playbook': ['Playbook not found for project.']}
  # and succeeds on the first run after the merge. That is ordering, not
  # misconfiguration — do not "fix" it by removing the template.
  - name: "AAP Ecosystem - Install Automation Orchestrator"
    description: "Install Automation Orchestrator and its CloudNativePG database, then verify the Route serves a page."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/install_ao.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # Configure Automation Orchestrator (#457). Connects AO to AAP via OIDC
  # and creates the AAP integration so AO can see job templates.
  #
  # RUNS AFTER INSTALL. setup.yml gates both on `install_ao`. This template
  # is for re-running configuration on its own — after a sandbox rebuild,
  # or to re-apply the SSRF allowlist in the ao-admin-settings ConfigMap
  # after an operator upgrade (#621, #608).
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Configure Automation Orchestrator"
    description: "Connect Automation Orchestrator to AAP — OIDC SSO and the AAP integration for job template visibility."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/configure_ao.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # Load Automation Orchestrator workflows as code (#474). Creates or updates
  # every workflow in group_vars/aap/ao_workflows.yml, resolving template,
  # credential, integration and approver NAMES to this environment's IDs.
  #
  # NOT A setup.yml STAGE, ON PURPOSE. Building the workflow live on the AO
  # canvas is the demo; this loaded copy is the fallback and the rehearsal
  # source. Runs after Configure — it needs the AAP integration and the
  # "AAP Admin" credential that playbook creates.
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Load Automation Orchestrator Workflows"
    description: "Create or update the Automation Orchestrator demo workflows from config-as-code, resolving names to this environment's IDs."
    labels:
      - aap-ecosystem
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/ao_workflows.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # Rehearse the Automation Orchestrator demo (#623). Preflights every fault
  # the first rehearsal hit (#621, #622, #474, #616), then breaks compliance
  # on the Windows guest so the workflow has something to fix. Add
  # ao_rehearse_run: true to extra vars to also start the loaded workflow —
  # it stops at the approval, because a person approving is the demo.
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Rehearse Automation Orchestrator Demo"
    description: "Preflight the AO demo's known failure points, break compliance on the Windows guest, and optionally run the workflow to its approval gate."
    labels:
      - aap-ecosystem
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/ao_rehearse.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    ask_variables_on_launch: true
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # The self-service portal (#103), runnable from AAP since #324.
  #
  # IT WAS LAPTOP-ONLY UNTIL THEN, AND THE REASON IS WORTH KEEPING. Added in
  # #300, it failed ten seconds after every launch for two independent reasons:
  # portal.yml pointed Helm at a gitignored .kube/<env>.kubeconfig the SCM
  # checkout never had, and the EE carried no helm binary at all. Fixing either
  # alone only moved the failure.
  #
  # WHY #300 GOT IT WRONG, recorded so the check is not skipped again: the
  # template was justified on `hosts: aap` plus the right credentials, matching
  # Install Automation Orchestrator. But AO and Install MCP Server use
  # kubernetes.core.k8s, which reaches the API directly through K8S_AUTH_*.
  # portal.yml SHELLS OUT to a binary.
  #
  # WHAT A PLAYBOOK EXECUTES IS PART OF WHETHER IT CAN RUN FROM AAP, not just
  # what it targets. utilities/run-in-ee.sh and /sales-demos-verify-ee exist to
  # catch exactly that, and neither was run against this template before it
  # shipped.
  # ---------------------------------------------------------------------
  - name: "AAP Ecosystem - Install Self-Service Portal"
    description: "Deploy the AAP self-service portal (RHDH with the AAP plugin), create its OAuth application, and sync the org list. Needs EE v1.2.0 or later — it is the first template here that depends on the helm binary."
    labels:
      - aap-ecosystem
      - install
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/portal.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"

  # ---------------------------------------------------------------------
  # The AAP MCP server (#102), which setup.yml installs as stage 4 but which
  # had no way to be re-run on its own until #308.
  #
  # WHY RE-RUNNING IT STANDALONE MATTERS. aap_mcp_allow_write_operations is the
  # write posture for an AI agent against AAP, and Red Hat's documentation is
  # explicit that changing it requires deleting and recreating the
  # AnsibleMCPServer CR rather than patching it. mcp_server.yml already does
  # exactly that — it reads the live object and deletes it when the flag
  # differs. Without this template the only way to reach that logic was to
  # re-run the whole of setup.yml, which also reinstalls CNV and reapplies the
  # entire AAP configuration.
  #
  # THIS DEPLOYS THE SERVER, NOT THE CLIENT. Wiring a laptop to it is the
  # sales-demos-mcp skill: utilities/make-aap-mcp.sh mints a token and writes
  # the gitignored .aap/<env>.token and .aap/<env>.url, which the committed
  # .mcp.json stdio entry (utilities/aap-mcp-stdio.sh, #515) reads at launch.
  # That half is deliberately laptop-only (#102). Do not expect this template
  # to change anything on your machine.
  # ---------------------------------------------------------------------
