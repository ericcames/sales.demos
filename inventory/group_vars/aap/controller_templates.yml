    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Configure Linux VMs"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Linux Compliance Scan"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Check Linux VMs"
    organization: "IT Service Automation"
    state: absent
  - name: "Sales Demos - Run Linux Demo"
    organization: "IT Service Automation"
    state: absent
