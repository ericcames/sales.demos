---
# ============================================================================
# group_vars/aap/controller_templates.yml — job templates and surveys (#4)
# ============================================================================
# THE VARIABLE IS controller_templates, NOT controller_job_templates. A known
# quirk of infra.aap_configuration — the role reads job templates from
# `controller_templates`, confirmed in dc1.azure and a sibling daily-demo repo,
# both of which carry the same note. Naming it the obvious way means the
# objects are silently never created, with no error.
#
# SURVEY VARIABLE NAMES ARE THE CONTRACT. `vm_size_tier` and `os_type` here must
# match playbooks/provision_vm.yml's extra_vars and the ocpvirt-provision skill
# prompts exactly. The tier strings must also match the validation block in
# terraform/ocpvirt/variables.tf. Changing one means changing all of them.
#
# BOTH TEMPLATES RUN AGAINST "Sales Demo VMs", which holds the synced control
# hosts and the demo VMs together — see controller_inventories.yml. They differ
# only in `limit`: provisioning targets `sandbox` (a control host, because
# provision_vm.yml is `hosts: aap`), VM-facing work targets `linuxweb`.
#
# "Sales Demo VMs - Control" is NOT used here. It is reserved for teardown (#6),
# which cannot run in the inventory whose hosts it deletes.
# ============================================================================

controller_templates_all:
  # ---------------------------------------------------------------------
  # Provision. The template that finally exercises the execution environment
  # built in #31 — nothing had run on it before this.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Provision VM"
    description: "Run terraform/ocpvirt and register the new VMs in the Sales Demo VMs inventory."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/provision_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      # Everything that is not a credential comes from connection.yml via the
      # project-sourced inventory. The credentials themselves come from these
      # two, and BOTH are on every template in this file.
      #
      # "Sales Demos - Env Secrets" is the one that does the work: it injects
      # aap_password, openshift_api_token and the two rhsm_* values as extra_vars,
      # which outrank the group_vars definitions in connection.yml. "Sales Demos
      # - Vault" is the old path, kept and inert -- see the headers of
      # controller_credentials.yml and controller_credential_types.yml (#129).
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    # `limit` selects the environment, exactly as --limit does on the CLI, and
    # target_env makes the run fail closed if the two ever disagree — see
    # playbooks/tasks/assert_target_environment.yml.
    #
    # BOTH ARE TEMPLATED OFF aap_env_name, and that matters. Each RHDP
    # environment has its OWN AAP, and this `_all` entry is created in every one
    # of them. A literal `sandbox` here would put a sandbox-limited template
    # inside demo's AAP — and because both environments sync the same
    # hosts.yml, `sandbox-local` exists there too, so it would happily run
    # against sandbox's cluster from demo's controller. aap_env_name comes from
    # each environment's connection.yml, so every AAP gets a template pointed at
    # itself.
    #
    # There is deliberately no survey question for the environment: a dropdown
    # is one mis-click away from provisioning into the customer-facing env.
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick an OS and a VM size tier"
      spec:
        - question_name: Operating system
          question_description: >-
            Which guests to provision. Windows needs the golden image from Phase
            2 (#3) and will not boot until that lands.
          variable: os_type
          type: multiplechoice
          required: true
          default: linux
          choices:
            - linux
            - windows
            - both
        - question_name: VM size tier
          question_description: >-
            T-shirt size. Small tiers on purpose — these VMs share a node with
            AAP and CNV, and terraform/ocpvirt enforces a memory budget.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: small-1cpu-2gb
          choices:
            - small-1cpu-2gb
            - medium-1cpu-4gb
            - large-2cpu-6gb

  # ---------------------------------------------------------------------
  # Teardown (#6). The ONLY template that runs against the control inventory,
  # because it deletes hosts from "Sales Demo VMs" and AAP locks the hosts of
  # the inventory a running job is using.
  #
  # Scheduled nightly — see controller_schedules.yml.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Teardown VMs"
    description: "Destroy the demo VMs and deregister them. Leaves CNV, the boot-source DataSources, and the Terraform state namespace intact."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs - Control"
    project: "Sales Demos"
    playbook: playbooks/teardown.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
      # Teardown now CONNECTS to the guests before destroying them, to release
      # the Red Hat subscription and remove the Insights host (#47). Without
      # this credential those steps fail silently-ish — they are best-effort by
      # design — and every cycle leaks an entitlement.
      - "Sales Demos - Linux Machine"
    limit: "{{ aap_env_name }}"
    extra_vars:
      # teardown.yml REQUIRES target_env explicitly — stricter than every other
      # playbook here, because a mistyped limit on a destroy is the difference
      # between rebuilding a sandbox VM and wiping the environment a customer is
      # about to be shown.
      target_env: "{{ aap_env_name }}"
      provision_inventory: "Sales Demo VMs"
      # Must match what was provisioned, or destroy plans a different shape than
      # was built. These are the defaults; a run that used another tier should
      # pass its own on launch.
      os_type: linux
      vm_size_tier: small-1cpu-2gb
    # So a teardown of a non-default tier can be launched without editing the
    # template. The scheduled runs use the extra_vars above.
    ask_variables_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4, split into two templates so the Build Demo VM workflow can gate
  # them separately (#47). `Sales Demos - Run Demo` below still does both in
  # one shot for re-configuring VMs that already exist.
  #
  # REGISTER MUST SUCCEED BEFORE CONFIGURE. They look independent and are not:
  # the CNV rhel9 image has no repositories, so every dnf task in configure
  # fails on an unregistered guest.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Register VMs"
    description: "Wait for SSH, then attach the demo VMs to the Red Hat CDN. Nothing can install packages until this succeeds."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/register_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  - name: "Sales Demos - Configure VMs"
    description: "Install and configure the demo web server. Requires a registered guest."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/configure_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Phase 4 (#5) — the demo itself. Registers the guest to the Red Hat CDN,
  # then installs and configures the web server.
  #
  # THE REGISTRATION STEP IS NOT OPTIONAL. The CNV rhel9 image ships with no
  # repositories, so every dnf task fails without it.
  #
  # Needs BOTH credentials: Machine to log in to the guest, and Vault to
  # decrypt the registration credentials out of secrets.yml.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Run Demo"
    description: "Register the demo VMs and configure the web server. Turns the web_url Route from 503 into the demo page."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/run_demo.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    # So a single misbehaving VM can be targeted without editing the template.
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Reach the VMs. This is the one that proves AAP can run playbooks AGAINST
  # a demo VM, rather than merely create it.
  #
  # Runs against the TARGET inventory with the Machine credential, connecting
  # over in-cluster DNS on port 22. No bastion, no virtctl.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Check VMs"
    description: "Smoke test: log in to the provisioned VMs over in-cluster DNS and gather facts."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/check_vm.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      # THE VAULT CREDENTIAL IS REQUIRED EVEN THOUGH THIS PLAYBOOK USES NO
      # SECRETS. group_vars/all/secrets.yml is loaded for every play, so Ansible
      # parses the vaulted file whatever the playbook does with it. Without this
      # the job dies before its first task with
      #   ERROR! Attempting to decrypt but no vault secrets found
      # which says nothing about credentials. That is the cost of `all` scope,
      # and it applies to every job template in this repo.
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    # Defaults to the linuxweb group; ask on launch so the same template can be
    # pointed at one host when a single VM is misbehaving.
    limit: linuxweb
    ask_limit_on_launch: true
    # Persist the gathered facts in AAP's database, so they appear in the host's
    # Facts tab and survive the job that collected them (#47). The same
    # information is written to <web_url>/facts.json by linux_configure — this
    # is the controller-side copy, that one is the curl-able copy.
    use_fact_cache: true

  # ---------------------------------------------------------------------
  # CIS compliance scan (#202). Runs OpenSCAP with the CIS Level 1 Server
  # profile against the demo VMs and publishes an HTML report at
  # <web_url>/compliance/report.html. Expected to show some deviations
  # after linux_configure, since httpd/cockpit/firewall changes depart
  # from a hardened baseline — that delta is the demo point.
  # ---------------------------------------------------------------------
  - name: "Sales Demos - Compliance Scan"
    description: "Run an OpenSCAP CIS Level 1 scan and publish the report at <web_url>/compliance/."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/compliance_scan.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Linux Machine"
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: linuxweb
    ask_limit_on_launch: true

  # ---------------------------------------------------------------------
  # Automation Orchestrator (#141). Installs CloudNativePG, builds the three
  # databases, installs the AO operator and creates the instance.
  #
  # RUNS AGAINST THE CLUSTER, NOT THE GUESTS, so it takes `limit:
  # {{ aap_env_name }}` like Provision does rather than `linuxweb` — the
  # playbook is `hosts: aap`. No Machine credential for the same reason.
  #
  # setup.yml already runs this stage by default, so this template is for
  # re-running it on its own: an environment that was built with
  # `install_ao=false`, or one where the AO stack needs reconciling without
  # re-running CNV and the whole AAP configuration.
  # ---------------------------------------------------------------------
  # AAP VALIDATES `playbook:` AGAINST THE PROJECT'S SCM CHECKOUT, so this entry
  # cannot be created until playbooks/install_ao.yml is on the branch the "Sales
  # Demos" project syncs. Adding a template and its playbook in the same PR
  # therefore fails config.yml once, with
  #   Unable to create job_template ...: {'playbook': ['Playbook not found for project.']}
  # and succeeds on the first run after the merge. That is ordering, not
  # misconfiguration — do not "fix" it by removing the template.
  - name: "Sales Demos - Install Automation Orchestrator"
    description: "Install Automation Orchestrator and its CloudNativePG database, then verify the Route serves a page."
    job_type: run
    organization: "IT Service Automation"
    inventory: "Sales Demo VMs"
    project: "Sales Demos"
    playbook: playbooks/install_ao.yml
    execution_environment: "Sales Demos - OCP Virt EE"
    credentials:
      - "Sales Demos - Vault"
      - "Sales Demos - Env Secrets"
    limit: "{{ aap_env_name }}"
    extra_vars:
      target_env: "{{ aap_env_name }}"
