---
# ============================================================================
# group_vars/aap/controller_execution_environments.yml — the custom EE (#31)
# ============================================================================
# Registers the image built by utilities/build-ee.sh so job templates can
# select it. Applied by playbooks/config.yml via infra.aap_configuration.dispatch,
# like every other object here — there is no separate step to run.
#
# WHY THIS DIRECTORY AND NOT demos/ocpvirt/. The plan puts job templates under
# demos/ocpvirt/, but nothing loads that directory yet: dispatch reads
# group_vars implicitly, and this object has to be applied to be worth
# committing. When demos/ocpvirt/ gains a loader in #4, this can move with it.
#
# NOTE THE VARIABLE NAME, as in aap_organizations.yml. The dispatch role reads
# this object type from `controller_execution_environments`, plus the
# _all / _<env> suffix that dispatch_include_wildcard_vars merges on. `_all`
# because the image is identical in sandbox and demo — it is a public quay
# repository with nothing environment-specific baked in.
#
# Shipped in ansible.controller / ansible.platform terms this is a "controller_"
# object, not a legacy choice: infra.aap_configuration 4.7.0 names the role
# controller_execution_environments regardless of which underlying collection
# it calls.
# ============================================================================

controller_execution_environments_all:
  - name: "Sales Demos - OCP Virt EE"
    description: |-
      {%- raw -%}
      sales.demos EE v1.0.0 (base ee-supported-rhel9, AAP 2.6) — Terraform 1.15.8 · cloud.terraform · kubernetes.core · redhat.openshift_virtualization · infra.aap_configuration
      {%- endraw -%}
    organization: "IT Service Automation"
    # PULLED FROM THIS ENVIRONMENT'S OWN PRIVATE AUTOMATION HUB (#35), not from
    # quay.io directly. quay remains the published artifact and the source of
    # truth; hub_ee_repositories.yml mirrors it into PAH, and Controller pulls
    # the local copy. That removes quay.io from the demo's runtime dependencies
    # and makes the pull cluster-local rather than an internet round trip.
    #
    # THE HOST IS TEMPLATED, and it has to be. PAH is fronted by the AAP gateway
    # on the AAP hostname, which differs per environment — a literal here would
    # make this `_all` entry wrong for one of sandbox/demo. `aap_hostname` comes
    # from each environment's connection.yml, so one entry stays correct for
    # both and a new RHDP environment remains a one-file edit.
    #
    # The image NAME is sales_demos_ee, with underscores: Hub repository names
    # allow only alphanumerics and underscores. It must match
    # hub_ee_repositories.yml exactly.
    #
    # Pinned to an immutable tag. Never re-push a tag referenced here — a job
    # template would silently change underneath a running demo. Publish a new
    # tag, mirror it, and bump this line.
    #
    # Upstream audit trail — if the digest under the quay tag ever differs from
    # this, someone re-pushed:
    #   sha256:a6ee9e4b110bc12d47b222af93127f8fae9f8e3d02599dd8f1b35e3204d3559b
    #   skopeo inspect --no-creds docker://quay.io/zigfreed/sales-demos-ee:v1.0.0
    image: "{{ aap_hostname }}/sales_demos_ee:v1.0.0"
    # PAH requires authentication for container pulls even when the repository
    # is not private, so this is required regardless of visibility.
    credential: "Sales Demos - PAH Registry"
    pull: "missing"
