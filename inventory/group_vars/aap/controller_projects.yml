---
# ============================================================================
# group_vars/aap/controller_projects.yml — the AAP project (#4)
# ============================================================================
# The git checkout AAP runs playbooks from. Applied by playbooks/config.yml via
# infra.aap_configuration.dispatch, like every other object here.
#
# NOTE THE VARIABLE NAME, as in aap_organizations.yml: dispatch reads this
# object type from `controller_projects`, plus the _all suffix that
# dispatch_include_wildcard_vars merges on. `_all` because the project is the
# same repository for sandbox and demo — only the environment it targets
# differs, and that is decided by the job template's inventory and limit.
#
# NO SCM CREDENTIAL. This repository is public, so AAP clones it anonymously.
# That is a deliberate property of the design, not an oversight: nothing in the
# repo is secret except the vault-encrypted secrets.yml, which stays encrypted
# in the checkout and is decrypted at runtime by the Vault credential.
# ============================================================================

controller_projects_all:
  - name: "Sales Demos"
    description: "sales.demos — OpenShift Virtualization demo platform"
    organization: "IT Service Automation"
    scm_type: git
    # THE SHARP ONE FOR A FORK (#132). A fork whose AAP still names this URL
    # syncs UPSTREAM, so job templates run this repo's playbooks rather than the
    # fork's -- and nothing about that looks wrong until a change fails to take
    # effect. Overridable exactly like scm_branch below; the default keeps this
    # repo's own behaviour identical.
    #
    #   ansible-playbook playbooks/config.yml -i inventory --limit sandbox \
    #     -e sales_demos_scm_url=https://github.com/<you>/sales.demos.git ...
    #
    # `true` as default()'s second argument matters: an empty override would
    # otherwise be passed through as an empty scm_url.
    scm_url: >-
      {{ sales_demos_scm_url
         | default('https://github.com/ericcames/sales.demos.git', true) }}
    # `main` unless deliberately overridden. The override exists because a job
    # template validates its `playbook:` against the project's CURRENT checkout,
    # so a playbook that has not merged yet cannot be wired up at all — there is
    # no way to test config-as-code end to end before merging without it:
    #
    #   ansible-playbook playbooks/config.yml -i inventory --limit sandbox \
    #     -e target_env=sandbox -e sales_demos_branch=my-branch ...
    #
    # Always re-apply without the override before calling anything done; a
    # demo environment left pointing at a branch is drift waiting to bite.
    scm_branch: "{{ sales_demos_branch | default('main', true) }}"
    # The EE built by utilities/build-ee.sh (#31). Terraform is in this image
    # and in no stock one, which is the entire reason it exists.
    default_environment: "Sales Demos - OCP Virt EE"
    # Wipe local modifications before each update, so a job never runs against
    # a checkout someone poked at.
    scm_clean: true
    # THE KEY IS scm_update_on_launch, NOT update_on_launch. Set explicitly
    # rather than omitted: the config-as-code role only changes fields it is
    # given, so leaving it out means "whatever AAP already had" rather than
    # "false". False on purpose — a demo should run the revision that was
    # tested, not whatever landed on main five minutes ago. Sync deliberately
    # from the UI or by re-running config.yml.
    #
    # RE-RUNNING config.yml NOW GENUINELY SYNCS IT (#148). That sentence used to
    # describe an intention rather than a behaviour: config.yml created job
    # templates against whatever checkout the project happened to hold, and a
    # stale one failed the run with "Playbook not found for project." The sync
    # is a task in config.yml itself now, before the dispatch role.
    #
    # scm_update_on_launch stays false regardless, and the two are not in
    # tension: syncing at CONFIGURATION time is a different moment from syncing
    # at LAUNCH time, and only the second would make a running demo
    # unpredictable.
    scm_update_on_launch: false
