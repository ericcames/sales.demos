---
# ===========================================================================
# Shared, demo-agnostic AAP configuration. Applies to every environment.
# ===========================================================================

# The version this repo targets. Measured on the live sandbox 2026-09-03:
# GET /api/gateway/v1/ping/ returns {"status":"good","version":"2.7"}, and the
# controller behind it reports 4.8.6. The old comment here said the catalog
# item ships 2.6 and to pin to that; the catalog item moved, and #92's
# environment arrived on 2.7. (#101)
#
# THIS PIN IS DECLARATIVE — nothing reads it. Verified with a grep across the
# repo and across ~/.ansible/collections: the only occurrence is this line.
# It records which version the surrounding configuration was authored and
# measured against, so a future reader knows what the file's claims were true
# of. Changing it alters no behaviour; it stops the repo asserting a version
# its only live environment does not run.
#
# Note the two are different claims: the CONTROLLER version is 4.8.x and the
# PLATFORM version is 2.7. Reading the first as the second is how the stale
# 2.6 pin survived. The platform version has no MCP tool — see the sanctioned
# curl in CLAUDE.md.
aap_target_version: "2.7"

# Kept in step with aap_organizations.yml, which declares the organization this
# repo creates. A fresh RHDP environment ships `Default` and `Ansible Product
# Demos (APD)` instead, so the first apply creates this one. (#14)
aap_organization_name: "IT Service Automation"

# Prefer ansible.platform over ansible.controller — controller is legacy.
# Any playbook that creates a token must delete it in an `always:` block.

# ---------------------------------------------------------------------------
# Automation Hub token — read from ~/.ansible.cfg, NOT stored in the vault.
#
# PRECISELY: this is the Red Hat OFFLINE token, an SSO refresh token tied to your
# Red Hat account's subscription entitlement. Two consumers, both presenting it
# to console.redhat.com:
#   - `ansible-galaxy collection install` for certified content (#22)
#   - Private Automation Hub's rh-certified and validated remotes (#68,
#     group_vars/aap/hub_collection_remotes.yml)
#
# IT IS ONE OF THREE CREDENTIALS CALLED "TOKEN" around Automation Hub, and
# mixing them up is the most common day-one mistake. The other two are not
# stored anywhere in this repo, on purpose:
#
#   PAH API token   — a client authenticating TO your own hub. Per-user and
#                     short-lived, so a stored copy is a guaranteed stale value.
#                     ansible.hub uses ah_username/ah_password instead, already
#                     resolved from connection.yml plus the vault.
#   galaxy.ansible.com token — only needed to PUBLISH to public Galaxy. Reading
#                     public collections is anonymous, which is why the
#                     community remote carries no credential at all.
#
# The full table, written for someone who has never run a PAH, is in
# docs/demos/private-automation-hub/architecture.md.
#
# IT EXPIRES after 30 days of non-use, and regenerating it on the portal
# invalidates the old one. The failure mode is not an auth error: a sync
# authenticates fine and then returns zero collections.
#
# ~/.ansible.cfg already holds this token and is the authoritative copy: it is
# what `ansible-galaxy collection install` uses for Red Hat certified content,
# and it is shared across every one of Eric's repos. Vaulting a second copy
# would mean a value that silently goes stale the next time the token is
# rotated, with nothing to detect the drift. Same approach as aap.as.code and
# aap-skills, which read it the same way. (#22)
#
# Use ~/.ansible.cfg, not ~/.ansible/ansible.cfg. Both currently hold the same
# token, but the latter is a frozen leftover from when the former was a symlink
# (converted because ansible-builder's COPY does not follow symlinks). It will
# drift on the next rotation. aap-skills still points at the stale path — do
# not copy that detail.
#
# ONE COPY, DELIBERATELY, AND THAT MAKES PAH WORK LAPTOP-ONLY. This lookup
# resolves on the controller, so it does NOT resolve inside an AAP execution
# environment, where ~/.ansible.cfg does not exist.
#
# A vaulted fallback was built and verified working, then removed on purpose
# (#68). It bought exactly one thing — a hub-sync job template — at the cost of
# a second copy of a rotating credential, which is the specific failure #22
# above exists to prevent. PAH configuration therefore runs from a laptop, the
# same as every other config-as-code object here: `config.yml` has never had a
# job template either, because you cannot use AAP to bootstrap itself.
#
# The consequence is worth stating plainly. An EE has no ~/.ansible.cfg, and
# what happens then was measured in #120 rather than assumed -- the old wording
# here said it "resolves to an empty string, which is not an error", and that is
# wrong. The ini lookup RAISES:
#
#   AnsibleParserError: Invalid filename: 'None'
#
# Which is the better of the two failures, and it is worth knowing which one you
# are looking at. The quiet failure is the one that follows if the token is ever
# empty rather than absent: the certified and validated remotes are configured
# with no credential, authenticate as anonymous, and sync nothing.
# playbooks/sync_hub.yml asserts the token is non-empty up front for that case.
#
# NEITHER IS A PERMANENT EXCLUSION FROM THE EE ANY MORE (#120).
# utilities/run-in-ee.sh --with-hub-token mounts this file read-only into the
# container for the duration of one run. That is not a second stored copy of a
# rotating credential -- which is what #68 refused -- it is the same single file,
# read at run time and never persisted. It is required for config.yml,
# validate.yml, setup.yml, sync_hub.yml and curate_hub.yml, and the wrapper
# refuses to start those without it.
#
# WHAT DOES NOT CHANGE: none of this makes the hub playbooks runnable as an AAP
# JOB TEMPLATE. AAP has no laptop to mount from. #120 changes the laptop story
# only.
# ---------------------------------------------------------------------------
automation_hub_token: >-
  {{ lookup('ansible.builtin.ini',
            'token section=galaxy_server.rh_certified file=~/.ansible.cfg') }}

# ---------------------------------------------------------------------------
# Where the vault password lives (#131).
#
# ~/secrets/.vault_pass_sales_demos is the convention and stays the default, so
# nothing changes for an existing setup. It is a variable because it is one of
# only two places in this repo where that path is EXECUTED rather than
# documented -- the other is utilities/make-kubeconfig.sh -- and a cloner who
# keeps their vault passwords somewhere else had no way to say so.
#
# The env var is what makes the two agree: the shell script reads the same
# SALES_DEMOS_VAULT_PASS, so one export repoints both. Override per-machine
# with that, or per-environment in inventory/group_vars/<env>/local.yml.
#
# `default(..., true)` is deliberate: an UNSET env var resolves to an empty
# string here, not to Undefined, and a plain `default()` would happily hand the
# lookup "" and fail with a confusing "file not found: ". The second argument
# makes it treat empty as absent.
# ---------------------------------------------------------------------------
sales_demos_vault_password_file: >-
  {{ lookup('ansible.builtin.env', 'SALES_DEMOS_VAULT_PASS')
     | default('~/secrets/.vault_pass_sales_demos', true) }}
