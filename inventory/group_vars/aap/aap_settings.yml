---
# ============================================================================
# group_vars/aap/aap_settings.yml — settings shared by EVERY environment
# ============================================================================
# Ported from ericcames/aap_config (#14). Values verbatim; comments adapted to
# this repo, which has two environments rather than azure/dev/qa/prod.
#
# Loaded automatically for any host under the `aap` group (sandbox, demo)
# because this directory is named for that group. No include_vars needed.
#
# Connection credentials (aap_hostname, aap_username, aap_password,
# aap_validate_certs) are NOT here. In this repo EVERY environment-specific
# value lives in the gitignored inventory/group_vars/<env>/secrets.yml —
# hostnames and URLs included, not just the strictly secret ones — so that
# re-pointing at a fresh RHDP environment is a one-file edit. Committed
# connection.yml holds structure only.
#
# That differs from aap_config, which splits hostname into a committed
# connection.yml and vaults only the credentials. Do not reintroduce that split
# here; see CLAUDE.md -> Secrets.
# ============================================================================

# Let the dispatch role merge suffix-named variables so shared objects
# (controller_projects_all) combine with per-env ones (controller_projects_dev).
dispatch_include_wildcard_vars: true

# Do not log object bodies (which may contain resolved secrets) by default.
aap_configuration_secure_logging: true
