---
# Environment axis. A demo is chosen by extra-var / CI matrix; an environment
# by inventory group. Two environments only — see docs/plan for why there is
# deliberately no "golden" env (that is a git tag, not a connection target).
#
# EACH ENVIRONMENT HAS ITS OWN HOST, AND THAT IS THE WHOLE POINT. (#16)
#
# Both groups previously pointed at the same host, `localhost`. `--limit`
# filters which hosts run, not which group_vars load — so a host belonging to
# two environment groups loads both environments' variables, and same-level
# groups resolve alphabetically with the later name winning. `--limit demo`
# silently resolved to sandbox's hostname and sandbox's bearer token, with no
# warning at all. Adding demo/secrets.yml would not have fixed it: sandbox
# still won, and the bug would have been harder to see.
#
# Distinct host aliases give each group exactly one member, so group_vars stop
# merging. `--limit sandbox` and `--limit demo` are unchanged as invocations —
# playbooks target `hosts: aap` and the limit selects the environment.
#
# Never point two environment groups at the same host again.
#
# ansible_python_interpreter is pinned to the interpreter running
# ansible-playbook. Interpreter discovery otherwise picks whatever /usr/bin
# python it finds first, which on Fedora can be an older minor version that
# does not have the `kubernetes` client the CNV install needs. Pinning it here
# rather than in an ansible.cfg is deliberate — a project-local ansible.cfg
# would shadow ~/.ansible.cfg and break certified collection installs.
all:
  children:
    aap:
      children:
        sandbox:   # the RHDP env you are actively building against
          hosts:
            sandbox-local:
              ansible_connection: local
              ansible_host: 127.0.0.1
              ansible_python_interpreter: "{{ ansible_playbook_python }}"
        demo:      # the RHDP env you show customers
          hosts:
            demo-local:
              ansible_connection: local
              ansible_host: 127.0.0.1
              ansible_python_interpreter: "{{ ansible_playbook_python }}"
