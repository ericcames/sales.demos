---
# ============================================================================
# hub/approved-collections.yml — the curated repository's desired contents (#68)
# ============================================================================
# GENERATED. Do not hand-edit; run the refresh and commit the diff:
#
#   python3 utilities/refresh-hub-requirements.py
#   git diff hub/
#
# THIS IS NOT collections/requirements.yml. That file is what your laptop and
# the execution environment INSTALL. This file is what Private Automation Hub
# SYNCS from upstream. Confusing the two is the likeliest mistake here.
#
# The curated set: what this repo itself installs, at the exact pinned
# version, PLUS every collection those pins depend on. Derived from
# collections/requirements.yml -- bump a pin there and re-run with
# --write-approved.
#
# THE DEPENDENCIES ARE NOT OPTIONAL. An AAP project sync runs
# `ansible-galaxy collection install -r collections/requirements.yml`,
# which resolves transitive dependencies. Seeded with the direct pins
# alone, this repository failed the first real #69 run on
# ansible.eda:>=2.5.0 (dependency of infra.aap_configuration:4.7.0).
# Dependencies are curated at their sync-window floor, the oldest version
# the hub is guaranteed to hold.
#
# UNLIKE THE OTHER THREE FILES, THIS ONE IS A TRUE DESIRED STATE. Delete a
# line and playbooks/curate_hub.yml removes that collection from the
# repository. A sync cannot do that; a curated repository can, which is the
# whole reason it exists (#70).
#
# 10 collections, exact versions — 9 pinned by this repo,
# 1 pulled in as dependencies.
# ============================================================================
collections:
  - name: ansible.controller
    version: "4.8.0"
  - name: ansible.eda
    version: "2.12.0"  # dependency of infra.aap_configuration
  - name: ansible.hub
    version: "1.1.0"
  - name: ansible.platform
    version: "2.7.20260604"
  - name: ansible.posix
    version: "2.2.0"
  - name: cloud.terraform
    version: "4.0.0"
  - name: infra.aap_configuration
    version: "4.7.0"
  - name: kubernetes.core
    version: "6.4.0"
  - name: redhat.openshift_virtualization
    version: "2.3.0"
  - name: redhat.rhel_system_roles
    version: "1.120.5"