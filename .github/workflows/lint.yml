---
name: Lint
# PR gate. yamllint + ansible-lint + the secret-hygiene guard + a portability
# check on in-repo skills. No secrets needed: ansible-lint runs offline
# (certified collections aren't installed in CI; .ansible-lint mocks them).
#
# Adapted from ericcames/aap_config. Its deploy-{dev,qa,prod} workflows are
# deliberately NOT ported, and will not be (issue #7).
#
# Nothing deploys from CI. Deploys run via ansible-playbook, either wrapped by a
# skill in .claude/skills/ or as an AAP job template — both driving the same
# playbooks/<phase>.yml. That keeps every credential in the vault-encrypted,
# untracked playbooks/group_vars/all/secrets.yml with no second copy in GitHub
# Environment secrets. Non-credential per-environment values live in the
# committed inventory/group_vars/<env>/connection.yml, so a new RHDP env stays a
# one-file edit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint .

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ansible-lint
      - run: ansible-lint

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No live credentials or RHDP identifiers in tracked files
        # This repo is public. CONTRIBUTING.md documents the same check as a
        # manual pre-push step; running it here means it cannot be skipped at
        # the end of a long demo build.
        run: bash utilities/check-no-secrets.sh

  docs-artifacts-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out the docs repo, which owns the talk tracks since #422
        uses: actions/checkout@v5
        with:
          repository: ericcames/sales.demos-docs
          path: sales.demos-docs
      - run: pip install jinja2
      - name: Committed banner blocks still match their templates
        # #85. The demo docs quote /etc/issue.net, /etc/motd and facts.json in
        # fenced blocks, every copy hand-pasted from render-demo-assets.py.
        # Edit motd.j2 and they go stale with CI green -- and these blocks are
        # what the demo falls back to when there is no cluster, so a stale
        # banner has a presenter describing a machine that does not exist.
        #
        # Cheap because it renders text only: jinja2, no Chrome, seconds.
        #
        # SINCE #422 THE DOCS ARE IN ANOTHER REPO, and this checks across the
        # gap rather than giving up the gate. The script stays here, beside the
        # renderer and the linux_configure role it reads templates from; only
        # the markdown moved. One copy, invoked from both repos' workflows.
        #
        # This direction is the one #85 was opened for: edit motd.j2 and it
        # fails HERE, at the moment the template changes. The consequence is
        # that such a change needs its paired sales.demos-docs PR merged first,
        # which is the honest cost of splitting coupled content across repos.
        run: |
          python3 utilities/check-docs-artifacts.py \
            --docs-root sales.demos-docs/docs \
          || { echo "::error::If you changed a template, merge the paired \
          ericcames/sales.demos-docs PR first — this job reads that repo's main."; exit 1; }

  renderer-matches-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - name: render-demo-assets.py still matches the linux_configure role
        # #145, the half #85 could not close. docs-artifacts-current proves the
        # docs match the SCRIPT; this proves the script matches the ROLE.
        #
        # Without it the two checks can agree with each other while both
        # disagree with the machine linux_configure actually builds -- a green
        # tick asserting something it does not mean, which is worse than no
        # check at all.
        run: python3 utilities/check-renderer-fixture.py

  secrets-example-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: secrets.yml.example declares every key the code reads
        # The real secrets.yml is vault-encrypted, so CI can never diff the two.
        # This compares the example against the variables the code reads bare and
        # nothing defines — which can only come from the vault. Nothing checked
        # this before #128, which is how rhsm_org_id and rhsm_activation_key came
        # to be asserted by playbooks/roles/linux_register while the example never
        # mentioned them: a secrets file built from the example passed every
        # preflight and failed Phase 4 in front of an audience.
        run: python3 utilities/check-secrets-example.py

  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The badge colour table matches env_colors.py
        # Nothing checked this before #87, which is why a generated file sat
        # stale in main without complaint. A committed generator output that
        # nothing verifies is a copy waiting to drift.
        run: |
          python3 utilities/make-env-badge-config.py
          git diff --exit-code utilities/aap-env-badge/colors.json \
            || { echo "::error::colors.json is stale — run python3 utilities/make-env-badge-config.py and commit"; exit 1; }
      - name: The env logo sidecars match their PNGs, and the lookups resolve
        # #422. Same reasoning as the line above, for assets/aap-branding/:
        # logo-<env>.png.b64 is a generated copy that gateway_settings.yml feeds
        # to AAP as custom_logo at run time, and nothing verified either half.
        #
        # It does NOT regenerate the PNG to compare -- that needs ImageMagick,
        # librsvg and a specific font, and font rasterisation is not
        # byte-reproducible across machines. Base64 is, so the sidecar is
        # verified exactly, with no dependencies.
        run: python3 utilities/check-env-logos.py

  skills-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skills stay portable across Claude Code and Copilot CLI
        # yamllint is blind to Markdown frontmatter, so nothing else catches a
        # SKILL.md that stops loading. Copilot CLI accepts only name/description/
        # license; an extra key is the likeliest way to silently break one tool.
        run: |
          bad=0
          shopt -s nullglob
          for f in .claude/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            if [ "$(head -n1 "$f")" != "---" ]; then
              echo "::error::$f must start with '---' frontmatter"; bad=1; continue
            fi
            # Frontmatter = lines between the first '---' and the next one.
            fm=$(awk 'NR>1{if($0=="---")exit; print}' "$f")
            name=$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p')
            desc=$(printf '%s\n' "$fm" | sed -n 's/^description:[[:space:]]*//p')
            [ -n "$name" ] || { echo "::error::$f missing 'name:'"; bad=1; }
            [ -n "$desc" ] || { echo "::error::$f missing 'description:'"; bad=1; }
            if [ -n "$name" ] && [ "$name" != "$dir" ]; then
              echo "::error::$f name '$name' does not match directory '$dir'"; bad=1
            fi
            # Only top-level keys; indented lines are continuations.
            for k in $(printf '%s\n' "$fm" | sed -n 's/^\([a-zA-Z_-]*\):.*/\1/p'); do
              case "$k" in
                name|description|license) ;;
                *) echo "::error::$f key '$k' is not portable — use only name/description/license"; bad=1 ;;
              esac
            done
            # Every skill must be listed in the README skill table.
            if ! grep -q "$dir" README.md; then
              echo "::error::README.md does not list skill: $dir"; bad=1
            fi
          done

          # ...AND THE REVERSE. This check used to run one way only, which is
          # how #4 shipped a job template and a playbook but never its
          # `sales-demos-provision` skill: the README row said Done, no skill
          # directory existed, and CI passed. A row may name a skill that does
          # not exist ONLY if it is explicitly marked "Not started".
          while IFS= read -r name; do
            [ -d ".claude/skills/$name" ] && continue
            if grep -q "\`$name\`.*Not started" README.md; then continue; fi
            echo "::error::README.md lists skill '$name' with no .claude/skills/$name/ — create it, or mark the row 'Not started'"
            bad=1
          done < <(grep -oE '^\| `[a-z0-9-]+`' README.md | tr -d '|` ' | sort -u)
          if [ "$bad" -ne 0 ]; then
            echo "See CLAUDE.md -> 'Skills and playbooks' for the contract."
            exit 1
          fi
          echo "All skills are portable and listed in README.md."

          # ── Skill content checks (#456) ──────────────────────────────
          # These catch bugs that already shipped: B (| tee), D (hardcoded
          # EE tag), and J (syntax error in a fenced block).

          for f in .claude/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")

            # bash -n every fenced bash block (replace <placeholder> tokens
            # so bash doesn't parse them as redirections)
            if ! awk '/^```bash$/{ p=1; next } /^```$/{ p=0 } p{ print }' "$f" \
              | sed 's/<[a-zA-Z_][a-zA-Z0-9._-]*>/PLACEHOLDER/g' \
              | bash -n 2>/tmp/bash-n-err; then
              echo "::error::$f contains a bash block with syntax errors:"
              cat /tmp/bash-n-err
              bad=1
            fi

            # No ansible-playbook … | tee — exit status comes from tee, not ansible
            if grep -Pn 'ansible-playbook\b.*\|\s*tee\b' "$f" >/dev/null; then
              echo "::error::$f pipes ansible-playbook through tee — exit status comes from tee, not ansible-playbook"
              bad=1
            fi

            # No hardcoded EE tags — use the dynamic lookup instead
            if grep -Pn 'sales-demos-ee:v[0-9]' "$f" >/dev/null; then
              echo "::error::$f hardcodes a sales-demos-ee:v tag — use the dynamic EE_TAG lookup from controller_execution_environments.yml"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo "Skill content checks failed."
            exit 1
          fi
          echo "Skill content checks passed."
