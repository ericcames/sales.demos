---
# ===========================================================================
# policy_demo_change_window.yml — the job the change-window policy guards.
# #841, Phase 2.
#
# Like policy_demo_hello.yml, it does nothing but report; the demo is whether
# AAP lets it start. `Policy as Code - Change Window` carries opa_query_path
# aac/aap/policy/maintenance_window (attached by install_opa.yml), set in
# opa_policy.yml to weekends only (UTC), so:
#
#   launch on a weekday               -> blocked, with the day in the reason
#   relaunch with label break-glass   -> runs, and the label is on the job
#
# If this runs WITHOUT break-glass on a weekday, the policy is not enforcing —
# check OPA_HOST and the template's opa_query_path.
# ===========================================================================

- name: Policy as Code - Change Window
  hosts: aap
  gather_facts: false

  tasks:
    - name: Report that policy allowed this job
      ansible.builtin.debug:
        msg:
          - "OPA allowed this job, so AAP started it."
          - "Either it is a weekend (UTC), or break-glass was applied."
          - "The job's Labels, on its Details page, are the record of which."
