---
# ===========================================================================
# configure_ao.yml — connect a running Automation Orchestrator to AAP.
# Issue #457, following the install_ao.yml install.
#
#   ansible-playbook playbooks/configure_ao.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# Idempotent, no prompts. Every step checks-before-creates.
# Creates no AAP token, so there is nothing to clean up in an `always:`.
#
# WHAT THIS DOES. Automation Orchestrator ships installed but unconnected —
# it cannot see AAP's job templates, and users can only log in with a local
# admin account. This playbook fixes both by:
#
#   1. Allowing AO to reach AAP (SSRF allowlist)
#   2. Setting up AAP as an OIDC identity provider (SSO)
#   3. Creating an AAP credential in AO
#   4. Creating an AAP integration so AO can see JTs, WFJTs, inventories
#
# WHY THE SSRF ALLOWLIST. AO uses langchain_core's SSRF protection to block
# private IP addresses. The AAP hostname resolves to a private IP from inside
# the cluster (same-cluster communication). The settings that open it:
#
#   workflowHttpRequestAllowedHosts (CR)  → ao-worker (workflow HTTP steps)
#   APP_INTEGRATION_URL_ALLOWED_HOSTS     → ao-backend (browsing AAP through the
#                                           integration proxy) AND ao-worker
#                                           (RUNNING an AAP step in a workflow)
#   APP_OIDC_ALLOW_PRIVATE_NETWORKS       → ao-backend (OIDC auth to AAP)
#
# THE WORKER HALF WAS MISSED UNTIL #621. This playbook used to set both APP_
# variables on ao-backend only. Everything a person can check looked healthy —
# SSO worked, the integration was Enabled, the builder browsed AAP's templates
# — and the first workflow run failed in 0.6 s with "Integration ... base_url
# is not permitted by SSRF policy", because AAP steps execute in ao-worker.
#
# WHY A CONFIGMAP, NOT AN ENV PATCH. Every AO Deployment already loads
# `envFrom: configMapRef ao-admin-settings (optional: true)` — a hook the
# operator provides and does not own. Writing the settings there reaches
# ao-backend, ao-worker and ao-background-worker at once, and a ConfigMap the
# operator does not own should survive an operator upgrade that regenerates
# its Deployments, which a patched env var may not (#608). Pods read envFrom
# only at start, so a changed ConfigMap restarts the three components.
#
# WHY OIDC SETUP IS NOT IDEMPOTENT. `POST setup_aap_oidc` returns 502 if
# an OAuth2 application named "Syntara" already exists on AAP. The playbook
# checks GET /identity_providers first and skips the call if one exists.
# ===========================================================================

- name: Configure Automation Orchestrator — connect to AAP
  hosts: aap
  gather_facts: false

  environment:
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"

  vars:
    ao_namespace: "automation-orchestrator"
    ao_name: "ao"
    ao_route_name: "ao"
    ao_admin_settings_configmap: "ao-admin-settings"
    # The AO credential this play creates and owns (#622) — matched by name.
    ao_aap_cred_name: "AAP Admin"
    # Deployment name and its pods' app.kubernetes.io/component label. All
    # three load the ConfigMap; only these run code that reaches AAP.
    ao_settings_components:
      - {deployment: "ao-backend", component: "backend"}
      - {deployment: "ao-worker", component: "worker"}
      - {deployment: "ao-background-worker", component: "background-worker"}
    ao_api_retries: 30
    ao_api_delay: 10

  tasks:
    - name: Assert the environment is unambiguous
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert the required connection variables are set
      ansible.builtin.assert:
        that:
          - openshift_api_url is defined
          - openshift_api_url | length > 0
          - openshift_api_token is defined
          - openshift_api_token | length > 0
        fail_msg: >-
          openshift_api_url and openshift_api_token are required. They live in
          playbooks/group_vars/all/secrets.yml (gitignored, vault-encrypted).
        quiet: true

    - name: Assert AAP credentials are available
      ansible.builtin.assert:
        that:
          - aap_password | default('') | length > 0
          - aap_hostname | default('') | length > 0
          - aap_username | default('') | length > 0
        fail_msg: >-
          aap_password, aap_hostname, and aap_username are required.
          On a laptop they resolve from playbooks/group_vars/all/secrets.yml
          and inventory/group_vars/<env>/connection.yml; from a job template
          they come from the "Sales Demos - Env Secrets" credential.
        quiet: true

    # -----------------------------------------------------------------
    # 1. Get the AO Route URL
    # -----------------------------------------------------------------
    - name: Read the Automation Orchestrator Route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ao_namespace }}"
        name: "{{ ao_route_name }}"
      register: ao_route_result

    - name: Assert the AO Route exists
      ansible.builtin.assert:
        that:
          - ao_route_result.resources | length > 0
        fail_msg: >-
          No Route named '{{ ao_route_name }}' in {{ ao_namespace }}.
          Is Automation Orchestrator installed? Run /sales-demos-orchestrator first.
        quiet: true

    - name: Set AO base URL
      ansible.builtin.set_fact:
        ao_url: "https://{{ ao_route_result.resources[0].spec.host }}"
        aap_url: "https://{{ aap_hostname }}"

    - name: Show what we are connecting
      ansible.builtin.debug:
        msg: "Connecting AO ({{ ao_url }}) to AAP ({{ aap_url }})"

    # -----------------------------------------------------------------
    # 2. SSRF allowlist — the ao-admin-settings ConfigMap (#621)
    # -----------------------------------------------------------------
    - name: Write the SSRF allowlist into the ao-admin-settings ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ ao_admin_settings_configmap }}"
            namespace: "{{ ao_namespace }}"
            labels:
              app.kubernetes.io/part-of: sales-demos
          data:
            APP_INTEGRATION_URL_ALLOWED_HOSTS: "{{ [aap_hostname] | to_json }}"
            APP_OIDC_ALLOW_PRIVATE_NETWORKS: "true"
      register: ao_settings_cm

    - name: Read the AO Deployments that load the ConfigMap
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ao_namespace }}"
        name: "{{ item.deployment }}"
      loop: "{{ ao_settings_components }}"
      loop_control:
        label: "{{ item.deployment }}"
      register: ao_settings_deployments

    # An environment configured before #621 has both variables patched straight
    # onto ao-backend's container. An explicit `env` entry wins over `envFrom`,
    # so a leftover copy would silently override the ConfigMap on a repoint.
    - name: Remove APP_* variables patched directly onto a Deployment, so the ConfigMap is the one source
      when:
        - item.resources | length > 0
        - >-
          item.resources[0].spec.template.spec.containers
          | map(attribute='env') | map('default', []) | flatten
          | map(attribute='name')
          | intersect(['APP_INTEGRATION_URL_ALLOWED_HOSTS', 'APP_OIDC_ALLOW_PRIVATE_NETWORKS'])
          | length > 0
      ansible.builtin.command:
        argv:
          - oc
          - set
          - env
          - "deployment/{{ item.item.deployment }}"
          - "-n"
          - "{{ ao_namespace }}"
          - "--server={{ openshift_api_url }}"
          - "--token={{ openshift_api_token }}"
          - "--insecure-skip-tls-verify={{ not (openshift_validate_certs | default(false) | bool) }}"
          - "APP_INTEGRATION_URL_ALLOWED_HOSTS-"
          - "APP_OIDC_ALLOW_PRIVATE_NETWORKS-"
      loop: "{{ ao_settings_deployments.results }}"
      loop_control:
        label: "{{ item.item.deployment }}"
      changed_when: true
      no_log: true

    # Pods read envFrom only when they start. Deleting them is enough — each
    # Deployment recreates its pods — and it changes nothing the operator owns.
    #
    # NO `wait: true` HERE. With a label selector and no name, the module waits
    # on a resource called "None" and times out after 120 s per component,
    # failing a delete that has already happened. Measured on sandbox, first
    # run of #621. Readiness is waited for on the Deployments below instead.
    - name: Restart the AO components so they read the new ConfigMap
      when: ao_settings_cm.changed
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        namespace: "{{ ao_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ ao_name }}"
          - "app.kubernetes.io/component={{ item.component }}"
        delete_all: true
      loop: "{{ ao_settings_components }}"
      loop_control:
        label: "{{ item.deployment }}"

    - name: Wait for the AO components to be ready again
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ao_namespace }}"
        name: "{{ item.deployment }}"
      loop: "{{ ao_settings_components }}"
      loop_control:
        label: "{{ item.deployment }}"
      register: ao_settings_rollout
      retries: "{{ ao_api_retries }}"
      delay: "{{ ao_api_delay }}"
      until:
        - ao_settings_rollout.resources | length > 0
        - ao_settings_rollout.resources[0].status.readyReplicas | default(0) | int
          == ao_settings_rollout.resources[0].spec.replicas | default(1) | int
        - ao_settings_rollout.resources[0].status.updatedReplicas | default(0) | int
          == ao_settings_rollout.resources[0].spec.replicas | default(1) | int

    # Ask the pod, not the ConfigMap. The ConfigMap existing proves nothing
    # about a worker that started before it was written — that is exactly the
    # state that passed every check in #621.
    # A pod being deleted still reports phase Running until it is gone, and it
    # still carries the old environment — skip anything with a deletionTimestamp.
    - name: Find a running ao-worker pod that is not terminating
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ao_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ ao_name }}"
          - "app.kubernetes.io/component=worker"
        field_selectors:
          - status.phase=Running
      register: ao_worker_pods
      retries: "{{ ao_api_retries }}"
      delay: "{{ ao_api_delay }}"
      until: >-
        ao_worker_pods.resources
        | rejectattr('metadata.deletionTimestamp', 'defined')
        | list | length > 0

    - name: Pick the ao-worker pod to ask
      ansible.builtin.set_fact:
        ao_worker_pod_name: >-
          {{
            (ao_worker_pods.resources
             | rejectattr('metadata.deletionTimestamp', 'defined')
             | first).metadata.name
          }}

    - name: Read the allowlist from inside an ao-worker pod
      kubernetes.core.k8s_exec:
        namespace: "{{ ao_namespace }}"
        pod: "{{ ao_worker_pod_name }}"
        command: printenv APP_INTEGRATION_URL_ALLOWED_HOSTS
      register: ao_worker_allowlist
      changed_when: false
      failed_when: false

    - name: Assert ao-worker can reach AAP through the SSRF check
      ansible.builtin.assert:
        that:
          - aap_hostname in (ao_worker_allowlist.stdout | default(''))
        fail_msg: >-
          ao-worker pod {{ ao_worker_pod_name }} does not
          have {{ aap_hostname }} in APP_INTEGRATION_URL_ALLOWED_HOSTS
          (got '{{ ao_worker_allowlist.stdout | default('') | trim }}'). Every AAP
          step in a workflow run will fail with "base_url is not permitted by
          SSRF policy" (#621). Check that the Deployment still loads the
          {{ ao_admin_settings_configmap }} ConfigMap via envFrom.
        quiet: true

    # -----------------------------------------------------------------
    # 3. Login to AO
    # -----------------------------------------------------------------
    - name: Login to Automation Orchestrator
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/auth/login"
        method: POST
        body_format: json
        body:
          username: admin
          password: "{{ aap_password }}"
        validate_certs: false
        status_code: 200
      register: ao_login
      retries: "{{ ao_api_retries }}"
      delay: "{{ ao_api_delay }}"
      until: ao_login.status == 200
      no_log: true

    - name: Set AO auth header
      ansible.builtin.set_fact:
        ao_auth_header:
          Authorization: "Bearer {{ ao_login.json.access_token }}"
      no_log: true

    # -----------------------------------------------------------------
    # 4. AAP OIDC identity provider (SSO)
    # -----------------------------------------------------------------
    - name: Check for existing AAP identity provider
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/identity_providers"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_idps

    - name: Set whether AAP OIDC already configured
      ansible.builtin.set_fact:
        ao_oidc_exists: >-
          {{
            ao_idps.json.resources
            | selectattr('configuration.idp_type', 'defined')
            | selectattr('configuration.idp_type', 'equalto', 'aap')
            | list | length > 0
          }}

    - name: Setup AAP as OIDC identity provider
      when: not ao_oidc_exists | bool
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/identity_providers/setup_aap_oidc"
        method: POST
        body_format: json
        body:
          aap_url: "{{ aap_url }}"
          admin_username: "{{ aap_username }}"
          admin_password: "{{ aap_password }}"
          insecure_skip_tls_verify: true
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: [200, 201]
      register: ao_oidc_result
      no_log: true

    - name: Report OIDC status
      ansible.builtin.debug:
        msg: >-
          OIDC identity provider:
          {{ 'already configured — skipped' if (ao_oidc_exists | bool) else 'created' }}

    # -----------------------------------------------------------------
    # 5. Look up AAP credential type and default project
    # -----------------------------------------------------------------
    - name: Get credential types
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/credential_types"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_cred_types

    - name: Find AAP credential type ID
      ansible.builtin.set_fact:
        ao_aap_cred_type_id: >-
          {{
            ao_cred_types.json.resources
            | selectattr('name', 'equalto', 'Ansible Automation Platform')
            | map(attribute='id') | first
          }}

    - name: Get projects
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/projects"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_projects

    - name: Find default project ID
      ansible.builtin.set_fact:
        ao_default_project_id: >-
          {{
            ao_projects.json.resources
            | selectattr('name', 'equalto', 'default')
            | map(attribute='id') | first
          }}

    # -----------------------------------------------------------------
    # 6. AAP credential
    # -----------------------------------------------------------------
    - name: Check for existing AAP credential
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/credentials"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_credentials

    # AO LETS ONLY A CREDENTIAL'S CREATOR BROWSE AAP WITH IT (#622). This play
    # logs in as the local AO `admin`, so "AAP Admin" is owned by `admin`. It
    # serves the integration, and workflow RUNS may use it whoever starts them
    # — measured on sandbox, the run path does not check ownership. But a
    # person who builds or edits AAP steps as their SSO user is refused it in
    # the builder, reported misleadingly as "AAP Authentication Failed". They
    # need a credential they created themselves. A playbook cannot make one for
    # them: an SSO login is a browser OIDC flow.
    #
    # MATCH BY NAME, NOT BY TYPE. Matching any credential of the AAP type used
    # to skip creation whenever a person had already made their own, and then
    # bind the integration to the first match — possibly one owned by an SSO
    # user, which this play's `admin` would then be refused.
    - name: Set whether this playbook's AAP credential exists
      ansible.builtin.set_fact:
        ao_aap_cred_exists: >-
          {{
            ao_credentials.json.resources
            | selectattr('credential_type_id', 'equalto', ao_aap_cred_type_id | trim)
            | selectattr('name', 'equalto', ao_aap_cred_name)
            | list | length > 0
          }}

    - name: Create AAP credential
      when: not ao_aap_cred_exists | bool
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/credentials"
        method: POST
        body_format: json
        body:
          name: "{{ ao_aap_cred_name }}"
          description: >-
            Used by the AAP integration and by workflows loaded as code; any
            user may run those. Owned by the local AO admin, so SSO users cannot
            browse AAP with it in the workflow builder — create your own AAP
            credential for that (sales.demos #622).
          credential_type_id: "{{ ao_aap_cred_type_id | trim }}"
          project_id: "{{ ao_default_project_id | trim }}"
          inputs:
            username: "{{ aap_username }}"
            password: "{{ aap_password }}"
            oauth_token: ""
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: [200, 201]
      register: ao_cred_result
      no_log: true

    - name: Set AAP credential ID
      ansible.builtin.set_fact:
        ao_aap_cred_id: >-
          {{
            ao_cred_result.json.id | default(
              ao_credentials.json.resources
              | selectattr('credential_type_id', 'equalto', ao_aap_cred_type_id | trim)
              | selectattr('name', 'equalto', ao_aap_cred_name)
              | map(attribute='id') | first
            )
          }}

    - name: Report credential status
      ansible.builtin.debug:
        msg: >-
          AAP credential:
          {{ 'already exists — skipped' if (ao_aap_cred_exists | bool) else 'created' }}
          ({{ ao_aap_cred_id | trim }})

    # -----------------------------------------------------------------
    # 7. AAP integration
    # -----------------------------------------------------------------
    - name: Check for existing AAP integration
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/integrations"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_integrations

    - name: Set whether AAP integration exists
      ansible.builtin.set_fact:
        ao_aap_integration_exists: >-
          {{
            ao_integrations.json.resources
            | selectattr('integration_type', 'equalto', 'ansible_automation_platform')
            | list | length > 0
          }}

    - name: Create AAP integration
      when: not ao_aap_integration_exists | bool
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/integrations"
        method: POST
        body_format: json
        body:
          name: "Ansible Automation Platform"
          description: "AAP integration for this environment"
          integration_type: ansible_automation_platform
          configuration:
            integration_type: ansible_automation_platform
            base_url: "{{ aap_url }}"
            insecure_skip_tls_verify: true
          management_credential_id: "{{ ao_aap_cred_id | trim }}"
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: [200, 201]
      register: ao_integration_result
      retries: 5
      delay: 20
      until: ao_integration_result.status in [200, 201]

    - name: Report integration status
      ansible.builtin.debug:
        msg: >-
          AAP integration:
          {{ 'already exists — skipped' if (ao_aap_integration_exists | bool) else 'created' }}

    # -----------------------------------------------------------------
    # 8. Validate — can AO see AAP's job templates?
    # -----------------------------------------------------------------
    - name: Verify AO can reach AAP job templates via proxy
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/proxies/aap/job_templates"
        method: GET
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      register: ao_proxy_jts
      retries: 5
      delay: 10
      until: ao_proxy_jts.status == 200

    - name: Assert AO sees job templates from AAP
      ansible.builtin.assert:
        that:
          - ao_proxy_jts.json.results | default([]) | length > 0
        fail_msg: >-
          AO connected to AAP but sees 0 job templates. Check the integration
          credential and AAP's job template permissions.
        quiet: true

    # -----------------------------------------------------------------
    # 9. Report
    # -----------------------------------------------------------------
    - name: Configuration complete
      ansible.builtin.debug:
        msg: |
          Automation Orchestrator configured successfully.
            AO URL:          {{ ao_url }}
            AAP URL:         {{ aap_url }}
            SSRF allowlist:  ConfigMap {{ ao_admin_settings_configmap }} {{ 'written, components restarted' if (ao_settings_cm.changed) else 'already current' }}; ao-worker verified
            OIDC provider:   {{ 'already configured' if (ao_oidc_exists | bool) else 'created' }}
            AAP credential:  {{ 'already exists' if (ao_aap_cred_exists | bool) else 'created' }}
            AAP integration: {{ 'already exists' if (ao_aap_integration_exists | bool) else 'created' }}
            Job templates:   {{ ao_proxy_jts.json.results | default([]) | length }} visible
