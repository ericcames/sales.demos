---
# ===========================================================================
# provision_vm.yml — Phase 3. Run Terraform for the selected hypervisor and
# register the resulting VMs as managed hosts in AAP. Issue #4, #238.
#
#   ansible-playbook playbooks/provision_vm.yml -i inventory --limit sandbox \
#     -e target_env=sandbox -e vm_size_tier=small -e os_type=linux \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# PROVIDER DISPATCH (#238). The `hypervisor` variable selects which provider
# task file runs: tasks/terraform_{{ hypervisor }}.yml. Default is `ocpvirt`
# for backward compatibility. Each provider must set these facts:
#   tf              — full parsed Terraform output JSON
#   linux_inventory — LIST of per-VM dicts (empty when this run is not Linux)
#   win_inventory   — LIST of per-VM dicts (empty when this run is not Windows)
#   vm_inventory    — whichever of those two is non-empty; the farm, in order
#   Provider-specific URL list facts (e.g. web_urls, cockpit_urls for OCP Virt)
#
# TWO ENTRY POINTS, ONE CONTRACT. This runs identically from the
# `ocpvirt-provision` skill and from an AAP job template. Every input arrives
# as an extra_var and every required one is asserted below, so both fail the
# same way. The names `vm_size_tier`, `os_type`, and `demo_ssh_public_key`
# are the contract shared with the survey and the skill prompts.
#
# WHY hosts: aap. Every playbook here targets the `aap` group and relies on
# `--limit <env>` to select one environment, which is what makes group_vars
# resolve to exactly one set of connection values (#16). The host is local, so
# terraform runs on the machine executing the playbook.
# ===========================================================================

- name: Phase 3 — provision demo VMs and register them in AAP
  hosts: aap
  gather_facts: false

  vars:
    # --- Hypervisor dispatch (#238) ----------------------------------------
    provision_hypervisor: "{{ hypervisor | default('ocpvirt') }}"

    # --- Common inputs, with the same defaults the Terraform modules declare
    provision_size_tier: "{{ vm_size_tier | default('small') }}"
    provision_os_type: "{{ os_type | default('linux') }}"
    provision_name_suffix: "{{ name_suffix | default('') }}"

    # --- Server farm (#389) -------------------------------------------------
    provision_vm_role: "{{ vm_role | default('web') }}"
    provision_vm_count: "{{ vm_count | default(1) | int }}"

    # THE NAME FORMULA, SECOND COPY. terraform/ocpvirt/locals.tf owns it; this
    # predicts the same names because the budget check below has to run BEFORE
    # terraform does, and Terraform's outputs do not exist yet.
    #
    # The duplication is guarded rather than tolerated: after the provider runs,
    # "Assert the predicted VM names match what Terraform built" compares this
    # list against the real one and fails loudly if they ever diverge. That is
    # the same shape as check 2 in utilities/check-no-secrets.sh and the import
    # identity check in link_windows_image.yml — the copy is not trusted, it is
    # tested, on every run, including runs that change nothing.
    provision_expected_vm_names: >-
      {%- set pre = provision_vm_role ~ '-' ~ ('win' if provision_os_type == 'windows' else 'lnx') -%}
      {%- set sfx = ('-' ~ provision_name_suffix) if provision_name_suffix else '' -%}
      {%- set ns = namespace(names=[]) -%}
      {%- for i in range(1, (provision_vm_count | int) + 1) -%}
      {%- set ns.names = ns.names + [pre ~ '-' ~ i ~ sfx] -%}
      {%- endfor -%}
      {{ ns.names }}

    # --- AAP inventory the new hosts land in --------------------------------
    provision_aap_inventory: "{{ provision_inventory | default('Sales Demo VMs') }}"
    provision_windows_group: windemo
    provision_linux_group: linuxweb

    # --- AAP, from connection.yml or an AAP Controller credential -----------
    provision_aap_host: >-
      {{ aap_hostname | default(lookup('ansible.builtin.env', 'CONTROLLER_HOST'), true) }}
    provision_aap_user: >-
      {{ aap_username | default(lookup('ansible.builtin.env', 'CONTROLLER_USERNAME'), true) }}
    provision_aap_pass: >-
      {{ aap_password | default(lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD'), true) }}
    provision_aap_url: >-
      {{ provision_aap_host if provision_aap_host is match('^https?://') else 'https://' ~ provision_aap_host }}

    # Ported verbatim from dc1.azure (AB#158). An AAP Controller credential
    # injects EMPTY CONTROLLER_REQUEST_TIMEOUT / AAP_REQUEST_TIMEOUT into the
    # job environment. Every ansible.controller.* `request_timeout` and
    # ansible.platform.* token `request_timeout` is a float parameter with an
    # env_fallback onto those names, so the empty string fails to coerce.
    # Pass it explicitly on EVERY controller/platform task.
    provision_request_timeout: "{{ aap_request_timeout | default(30) }}"

    # --- OCP Virt-specific (used when hypervisor=ocpvirt) -------------------
    ocpvirt_terraform_dir: "{{ playbook_dir }}/../terraform/ocpvirt"

    ocpvirt_windows_datasource: "win2k22"
    ocpvirt_datasource_namespace: "openshift-virtualization-os-images"

    ocpvirt_api_url: >-
      {{ openshift_api_url | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST'), true) }}
    ocpvirt_api_token: >-
      {{ openshift_api_token | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY'), true) }}
    ocpvirt_namespace_resolved: "{{ ocpvirt_namespace | default('sales-demos-' ~ aap_env_name, true) }}"
    ocpvirt_state_namespace: "{{ tf_state_namespace | default('sales-demos-tfstate', true) }}"

  tasks:
    - name: Assert exactly one environment is targeted
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert provisioning inputs are present and valid
      ansible.builtin.assert:
        that:
          - provision_hypervisor in ['ocpvirt']
          - provision_size_tier in ['small', 'medium', 'large', 'small-1cpu-2gb', 'medium-1cpu-4gb', 'large-2cpu-6gb']
          - provision_os_type in ['windows', 'linux']
          - provision_name_suffix is match('^[a-z0-9]*$')
          # Mirrors the variable validations in terraform/ocpvirt/variables.tf,
          # so a bad value fails here rather than several minutes later inside
          # terraform. The 8-character cap on the role is the Windows NetBIOS
          # budget: {role}-win-{2 digits} is 15, the maximum a computer name
          # can be.
          - provision_vm_role is match('^[a-z][a-z0-9]{0,7}$')
          - (provision_vm_count | int) >= 1
          - (provision_vm_count | int) <= 2
        fail_msg: >-
          Need hypervisor (ocpvirt), vm_size_tier (small|medium|large) and
          os_type (windows|linux). `both` was removed in #301 — state is keyed
          per OS, so one run builds one OS; run it twice for both.
          Got hypervisor={{ provision_hypervisor }},
          vm_size_tier={{ provision_size_tier }},
          os_type={{ provision_os_type }},
          vm_role={{ provision_vm_role }},
          vm_count={{ provision_vm_count }}. name_suffix must be lowercase
          alphanumeric; vm_role must be 1-8 lowercase alphanumeric characters
          starting with a letter; vm_count must be 1 or 2.
        quiet: true

    # -------------------------------------------------------------------
    # WHY THIS IS ITS OWN ASSERT (#305). Without it the failure is silent and
    # expensive: sysprep cannot create the local administrator account, so the
    # guest boots all the way to a desktop and WinRM simply never answers.
    # That reads as a network or credential problem and sends you looking in
    # entirely the wrong place. CIS L1 for Windows Server 2022 sets a
    # 14-character minimum, and the CIS-hardened image has been the one we
    # clone since #270.
    #
    # Linux runs are unaffected -- this only fires when Windows is requested.
    # -------------------------------------------------------------------
    - name: Assert the Windows administrator password meets CIS L1 policy
      when: provision_os_type == 'windows'
      ansible.builtin.assert:
        that:
          - windows_admin_password | default('') | length >= 14
        fail_msg: >-
          os_type=windows needs windows_admin_password to be at least 14
          characters (CIS L1 for Windows Server 2022); got
          {{ windows_admin_password | default('') | length }}. It is a
          per-environment key under env_secrets in the vault, separate from
          linux_admin_password since #305. From AAP it arrives through the
          "Sales Demos - Env Secrets" credential, so a rotated vault value
          does nothing until config.yml is re-run for this environment.
        quiet: true

    - name: Assert the AAP connection is resolved
      ansible.builtin.assert:
        that:
          - provision_aap_host | length > 0
          - provision_aap_user | length > 0
          - provision_aap_pass | length > 0
        fail_msg: >-
          No AAP connection for host registration. Locally this comes from
          group_vars/<env>/connection.yml plus the vault; from AAP, attach a Red
          Hat Ansible Automation Platform credential (it injects CONTROLLER_*).
        quiet: true

    # -------------------------------------------------------------------
    # CLUSTER-WIDE MEMORY CHECK (#301). Terraform's own budget guard in
    # locals.tf can only see the state it is applying, and state is now keyed
    # per OS — so when Linux and Windows each have their own state, NEITHER can
    # see the other's VM and both pass their private check while together
    # overcommitting the node.
    #
    # The cluster is the only thing that sees both, so ask it. This counts the
    # guest memory KubeVirt VMs in the target namespace are asking for, adds
    # what this run wants, and compares against the same available_memory_gb
    # the Terraform guard uses.
    #
    # A VM this run is about to CONVERGE rather than create is excluded by
    # name, or re-running provision against an existing VM would count it twice
    # and refuse to converge its own VM.
    #
    # Read-only, one API call. Not a substitute for probe_env.yml, which
    # measures the whole cluster including non-VM workloads and recommends the
    # available_memory_gb this compares against.
    # -------------------------------------------------------------------
    - name: Ask the cluster what the existing demo VMs already request
      # Shared with probe_env.yml (#334). This used to inline the same
      # expression and read spec.template.spec.domain.memory.guest, which these
      # instancetype-based VMs do not have -- so it totalled ZERO and the assert
      # below has been evaluating `0 + tier <= budget` ever since #301 added it.
      # It passed for that reason alone, not because the cluster had room.
      ansible.builtin.include_tasks: tasks/sum_demo_vm_memory.yml
      vars:
        demo_vm_namespace: "{{ ocpvirt_namespace_resolved }}"
        # Excluded by name: this run may be CONVERGING its own VM, and counting
        # it as well as the tier it is about to request would refuse a re-run.
        # A LIST SINCE #389 — a farm converges several VMs, and excluding only
        # the first would count the rest twice and refuse to re-run against the
        # farm that is already standing.
        demo_vm_exclude: "{{ provision_expected_vm_names }}"
      when: provision_hypervisor == 'ocpvirt'

    - name: Assert the cluster has room for this VM alongside the other OS
      when: provision_hypervisor == 'ocpvirt'
      vars:
        _tier_gb: "{{ {'small': 4, 'medium': 8, 'large': 16,
                       'small-1cpu-2gb': 4, 'medium-1cpu-4gb': 8, 'large-2cpu-6gb': 16}[provision_size_tier] }}"
        _run_gb: "{{ (_tier_gb | float) * (provision_vm_count | int) }}"
      ansible.builtin.assert:
        that:
          - (demo_vm_total_gb | float) + (_run_gb | float) <= (available_memory_gb | float)
        fail_msg: >-
          Not enough room on {{ aap_env_name }}. Demo VMs already request
          {{ demo_vm_total_gb }} GiB ({{ demo_vm_counted | join(', ') }}) and
          {{ provision_vm_count }} x os_type={{ provision_os_type }} at tier
          {{ provision_size_tier }} wants {{ _run_gb }} GiB more
          ({{ provision_vm_count }} x {{ _tier_gb }}), against
          available_memory_gb={{ available_memory_gb }}. Terraform cannot catch
          this since #301 — each OS has its own state, and since #389 each role
          does too, so none of them sees the others. Lower vm_count, tear down
          another role or the other OS, pick a smaller tier, or re-run
          /sales-demos-probe-env if this cluster genuinely has more headroom.
        quiet: true

    - name: Say what the budget check found
      # PRINTED ON SUCCESS, ON PURPOSE (#334). The previous version of this
      # check silently totalled zero and passed for that reason rather than
      # because the cluster had room. A guard that never shows its working
      # cannot be caught being wrong.
      when: provision_hypervisor == 'ocpvirt'
      ansible.builtin.debug:
        msg: >-
          Memory budget OK — {{ demo_vm_total_gb }} GiB already held by
          {{ demo_vm_counted | length }} demo VM(s)
          {{ '(' ~ (demo_vm_counted | join(', ')) ~ ')' if demo_vm_counted else '' }}
          + {{ _run_gb }} GiB for this run
          ({{ provision_vm_count }} x {{ _tier_gb }} GiB), against
          available_memory_gb={{ available_memory_gb }}.
          Not counted, because this run converges them:
          {{ provision_expected_vm_names | join(', ') }}.
      vars:
        _tier_gb: "{{ {'small': 4, 'medium': 8, 'large': 16,
                       'small-1cpu-2gb': 4, 'medium-1cpu-4gb': 8, 'large-2cpu-6gb': 16}[provision_size_tier] }}"
        _run_gb: "{{ (_tier_gb | float) * (provision_vm_count | int) }}"

    # --- Provider dispatch -------------------------------------------------
    - name: "Run provider: {{ provision_hypervisor }}"
      ansible.builtin.include_tasks: "tasks/terraform_{{ provision_hypervisor }}.yml"

    # -------------------------------------------------------------------
    # THE NAME FORMULA EXISTS TWICE AND THIS IS WHAT KEEPS THE COPIES HONEST
    # (#389). provision_expected_vm_names above predicts what Terraform will
    # build, because the memory check has to run before terraform does. If that
    # prediction ever stops matching locals.tf, the exclusion list stops
    # matching the VMs it is meant to exclude — and the failure is quiet in the
    # dangerous direction: the budget check starts counting this run's own VMs
    # as other people's, and refuses to converge a farm that is already there.
    #
    # So the prediction is not trusted, it is tested, on every run including
    # runs that create nothing. This is the same move as check 2 in
    # utilities/check-no-secrets.sh: the cheap guard is the one that would
    # otherwise pass silently.
    # -------------------------------------------------------------------
    - name: Assert the predicted VM names match what Terraform built
      ansible.builtin.assert:
        that:
          - (vm_inventory | map(attribute='vm_name') | list) == (provision_expected_vm_names | list)
        fail_msg: >-
          The VM name formula in playbooks/provision_vm.yml has drifted from the
          one in terraform/ocpvirt/locals.tf. Predicted
          {{ provision_expected_vm_names | join(', ') }}; Terraform built
          {{ vm_inventory | map(attribute='vm_name') | join(', ') }}. The VMs
          themselves are fine — what is broken is the memory budget check, which
          excludes this run's own VMs by predicted name and will have counted
          them as somebody else's. Make the two formulas agree.
        success_msg: >-
          VM names as predicted:
          {{ provision_expected_vm_names | join(', ') }}.
      when: provision_hypervisor == 'ocpvirt'

    # --- Shared host registration ------------------------------------------
    - name: Register hosts in AAP
      ansible.builtin.include_tasks: tasks/register_hosts.yml

    # --- Shared workflow artifacts -----------------------------------------
    - name: Publish workflow artifacts
      ansible.builtin.include_tasks: tasks/provision_artifacts.yml
