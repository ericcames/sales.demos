---
# ===========================================================================
# ao_workflows.yml — load Automation Orchestrator workflows as code (#474).
#
#   ansible-playbook playbooks/ao_workflows.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
#   -e ao_workflow_state=absent       remove the workflows in the file instead —
#                                     AND their run history: AO deletes a
#                                     workflow's executions and approval records
#                                     with it (measured). Updating never does.
#   -e '{"ao_workflows_only": ["Windows Day 2 - Compliance Remediation"]}'
#
# Idempotent, no prompts. Every input via extra_vars. Creates no token that
# outlives the run — the AO access token expires on its own after ~15 minutes.
#
# WHAT IT DOES. For each workflow in inventory/group_vars/aap/ao_workflows.yml:
# resolve every name to this environment's ID, render AO's definition, have AO
# validate it, create or update it (an unchanged workflow is not saved, so
# versions do not pile up), read it back and assert AO stored what the file
# says. Why the file holds names rather than an AO export is in its header.
#
# NOT A setup.yml STAGE. Building the workflow live on the AO canvas is the
# demo. This loaded copy is the fallback and the source for rehearsals.
#
# RUNS AFTER configure_ao.yml, which creates the AAP integration and the
# "AAP Admin" credential the workflow steps use, and the SSRF allowlist every
# AAP step needs at run time (#621).
# ===========================================================================

- name: Load Automation Orchestrator workflows as code
  hosts: aap
  gather_facts: false

  environment:
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"

  vars:
    ao_namespace: "automation-orchestrator"
    ao_route_name: "ao"
    ao_workflow_state: present
    # Names of workflows to load; empty loads every workflow in the file.
    ao_workflows_only: []
    ao_api_retries: 30
    ao_api_delay: 10

  tasks:
    - name: Assert the environment is unambiguous
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert the required inputs are set
      ansible.builtin.assert:
        that:
          - openshift_api_url | default('') | length > 0
          - openshift_api_token | default('') | length > 0
          - aap_password | default('') | length > 0
          - aap_username | default('') | length > 0
          - ao_workflows is defined
          - ao_workflows | length > 0
          - ao_workflow_state in ['present', 'absent']
        fail_msg: >-
          openshift_api_url, openshift_api_token, aap_password and aap_username are
          required (secrets.yml on a laptop, the "Sales Demos - Env Secrets"
          credential from AAP); ao_workflows comes from
          inventory/group_vars/aap/ao_workflows.yml; ao_workflow_state must be
          present or absent (got '{{ ao_workflow_state }}').
        quiet: true

    # ao_workflows_aac (#867) is a second list, declared in its own file, so
    # the AAC workflows load through this same path without their ~70 nodes
    # sitting in ao_workflows.yml beside the Day 2 workflows. Absent, nothing
    # changes.
    - name: Choose the workflows to act on
      ansible.builtin.set_fact:
        ao_selected_workflows: >-
          {{ ao_all_workflows if ao_workflows_only | length == 0
             else ao_all_workflows | selectattr('name', 'in', ao_workflows_only) | list }}
      vars:
        ao_all_workflows: "{{ ao_workflows + (ao_workflows_aac | default([])) }}"

    - name: Assert every requested workflow is in the file
      ansible.builtin.assert:
        that:
          - ao_selected_workflows | length == (ao_workflows_only | length if ao_workflows_only | length > 0
                                               else (ao_workflows + (ao_workflows_aac | default([]))) | length)
        fail_msg: >-
          ao_workflows_only names a workflow that is not in ao_workflows.yml or ao_workflows_aac.yml:
          {{ ao_workflows_only | reject('in', (ao_workflows + (ao_workflows_aac | default([]))) | map(attribute='name') | list) | list }}
        quiet: true

    - name: Connect to Automation Orchestrator
      ansible.builtin.include_tasks: tasks/ao_connect.yml

    # Everything a workflow can name, read once. limit=100 comfortably covers
    # this repo; AO paginates with a cursor beyond that.
    - name: Read what this environment's AO and AAP have
      ansible.builtin.uri:
        url: "{{ ao_url }}/api/v1/{{ item }}"
        headers: "{{ ao_auth_header }}"
        validate_certs: false
        status_code: 200
      loop:
        - projects
        - integrations
        - credentials
        - proxies/aap/job_templates
        - users?auth_type=federated&limit=100
        - workflows?limit=100
        # AAP WORKFLOW templates, for aap_workflow_job_template nodes (#867).
        - proxies/aap/workflow_job_templates
      register: ao_lookups

    - name: Build the name-to-ID maps
      ansible.builtin.set_fact:
        ao_project_ids: "{{ ao_lookups.results[0].json.resources | items2dict(key_name='name', value_name='id') }}"
        ao_integration_ids: "{{ ao_lookups.results[1].json.resources | items2dict(key_name='name', value_name='id') }}"
        ao_credential_ids: "{{ ao_lookups.results[2].json.resources | items2dict(key_name='name', value_name='id') }}"
        ao_jt_ids: "{{ ao_lookups.results[3].json.results | items2dict(key_name='name', value_name='id') }}"
        ao_sso_users: "{{ ao_lookups.results[4].json.resources | default([]) }}"
        ao_existing_workflow_ids: >-
          {{ ao_lookups.results[5].json.resources | rejectattr('is_builtin') | list
             | items2dict(key_name='name', value_name='id') }}
        ao_wfjt_ids: "{{ ao_lookups.results[6].json.results | default([]) | items2dict(key_name='name', value_name='id') }}"

    # Agentic nodes need model IDs from LLM Provider integrations. Only
    # query if at least one selected workflow has an agentic node.
    - name: Discover LLM models for agentic nodes
      when: ao_selected_workflows | map(attribute='nodes') | flatten
            | selectattr('type', 'equalto', 'agentic') | list | length > 0
      block:
        - name: Collect the LLM integrations referenced by agentic nodes
          ansible.builtin.set_fact:
            ao_llm_integration_names: >-
              {{ ao_selected_workflows | map(attribute='nodes') | flatten
                 | selectattr('type', 'equalto', 'agentic')
                 | map(attribute='llm_integration') | unique | list }}

        - name: Query models from each LLM integration
          ansible.builtin.uri:
            url: "{{ ao_url }}/api/v1/integrations/{{ ao_integration_ids[item] }}/models"
            headers: "{{ ao_auth_header }}"
            validate_certs: false
            status_code: 200
          loop: "{{ ao_llm_integration_names }}"
          register: ao_llm_model_lookups

        - name: Build integration-name-to-first-enabled-model-ID map
          ansible.builtin.set_fact:
            ao_model_ids: >-
              {% set result = {} -%}
              {% for idx in range(ao_llm_integration_names | length) -%}
                {% set all_models = ao_llm_model_lookups.results[idx].json.resources | default([]) -%}
                {% set enabled = all_models | selectattr('enabled', 'equalto', true) | list -%}
                {% set pick = enabled if enabled | length > 0 else all_models -%}
                {% if pick | length > 0 -%}
                  {% set _ = result.update({ao_llm_integration_names[idx]: pick[0].id}) -%}
                {% endif -%}
              {% endfor -%}
              {{ result }}

        # Per-node model choice (#867, decision I on #841). A node may name an
        # `llm_model`; it resolves here by name within its integration. Nodes
        # that do not name one keep the first-enabled behaviour above.
        - name: Build integration-name-to-model-name-to-ID map
          ansible.builtin.set_fact:
            ao_model_ids_by_name: >-
              {% set result = {} -%}
              {% for idx in range(ao_llm_integration_names | length) -%}
                {% set all_models = ao_llm_model_lookups.results[idx].json.resources | default([]) -%}
                {% set _ = result.update({ao_llm_integration_names[idx]:
                     dict(all_models | map(attribute='name') | zip(all_models | map(attribute='id')))}) -%}
              {% endfor -%}
              {{ result }}

        - name: Assert every named llm_model exists in its integration
          ansible.builtin.assert:
            that:
              - ao_named_models_missing | length == 0
            fail_msg: >-
              These agentic nodes name a model their LLM integration does not list
              (is it enabled by publish_inference.yml?): {{ ao_named_models_missing }}
            quiet: true
          vars:
            ao_named_models_missing: >-
              {% set out = [] -%}
              {% for n in ao_selected_workflows | map(attribute='nodes') | flatten
                         | selectattr('type', 'equalto', 'agentic') | selectattr('llm_model', 'defined') -%}
                {% if n.llm_model not in (ao_model_ids_by_name[n.llm_integration] | default({})) -%}
                  {% set _ = out.append(n.name ~ ' wants ' ~ n.llm_model ~ ' from ' ~ n.llm_integration) -%}
                {% endif -%}
              {% endfor -%}
              {{ out }}

        - name: Assert every referenced LLM integration has at least one model
          ansible.builtin.assert:
            that:
              - ao_llm_integration_names | reject('in', ao_model_ids) | list | length == 0
            fail_msg: >-
              These LLM integrations have no models:
              {{ ao_llm_integration_names | reject('in', ao_model_ids) | list }}.
              Has publish_inference.yml been run? It validates the integration,
              triggers the Integration Resource Discovery workflow, and
              enables the discovered models.
            quiet: true

    - name: Apply each workflow
      ansible.builtin.include_tasks: tasks/ao_workflow_apply.yml
      loop: "{{ ao_selected_workflows }}"
      loop_control:
        loop_var: ao_wf
        label: "{{ ao_wf.name }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ ['Automation Orchestrator workflows (' ~ ao_workflow_state ~ ') at ' ~ ao_url ~ ':'] + ao_workflow_results | default([]) }}"
