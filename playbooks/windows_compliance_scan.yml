---
# ===========================================================================
# windows_compliance_scan.yml — verify the CIS L1 hardening on the Windows demo
# VMs and publish the report. Node 4 of `Windows Day 1 - 0 Workflow`. #340.
#
# FROM AAP (the normal path):
#   The "Windows Day 1 - 4 Compliance Scan" job template runs this against the
#   windemo group.
#
# FROM A LAPTOP (against a VM already registered in AAP's inventory):
#   Not directly — the VMs are reachable only via in-cluster DNS from AAP.
#   Use the job template, or port-forward 5986 with virtctl.
#
# THE TEMPLATE IS CALLED A SCAN; THE ROLE VERIFIES. The name matches its Linux
# sibling so the two families read alike, but there is no scanner here:
# OpenSCAP ships no Windows agent. roles/windows_compliance reads a curated
# subset of the controls image.builder.pipeline's cis_profile.yml applies, back
# off the running guest. The report it publishes says "verification" in its own
# title so the artifact cannot mislead anyone who opens it.
#
# EXPECTED TO SHOW EXCEPTIONS, NOT FAILURES, and that is the opposite of the
# Linux story on purpose. The Linux scan's demo point is the delta a workload
# introduces — install httpd and open ports, and some controls deviate. This
# one's is the sixteen documented exceptions: fifteen the image factory made
# and one this repo made at provisioning time, each with a name against it.
#
# ALL READS. Safe to re-run mid-demo.
# ===========================================================================

- name: Verify the CIS Level 1 hardening
  hosts: "{{ demo_group | default('windemo') }}"
  gather_facts: true

  roles:
    - windows_compliance

  post_tasks:
    # -----------------------------------------------------------------------
    # Keep the result as evidence (#857), the same way the Linux scan does.
    # Opt-in by presence; see tasks/record_compliance_evidence.yml.
    #
    # NOT REACHED when windows_compliance_fail_on_noncompliant fires, because
    # that gate fails the host first. It is off by default.
    # -----------------------------------------------------------------------
    - name: Record the verification in policy-db
      ansible.builtin.include_tasks: tasks/record_compliance_evidence.yml
      vars:
        evidence_framework: cis-l1-windows2022-verify
        # Same definition as the job artifact the role publishes (#613).
        evidence_compliant: >-
          {{ (windows_compliance_fail | int) == 0
             and (windows_compliance_notconfigured | int) == 0 }}
        evidence_score: "{{ windows_compliance_score | int }}"
        evidence_violations: >-
          {{ windows_compliance_results
             | selectattr('status', 'in', ['noncompliant', 'notconfigured', 'error']) | list }}
        evidence_facts: >-
          {{ {
               'scanner': 'configuration verification (no OpenSCAP agent exists for Windows)',
               'profile': windows_compliance_profile,
               'profile_source': windows_compliance_profile_source,
               'scanned': ansible_facts.date_time.iso8601,
               'results': {
                 'pass': windows_compliance_pass | int,
                 'fail': windows_compliance_fail | int,
                 'not_configured': windows_compliance_notconfigured | int,
                 'notchecked': windows_compliance_errors | int,
                 'score_percent': windows_compliance_score | int,
               },
               'controls': windows_compliance_results,
               'exceptions': windows_compliance_exceptions,
               'host': {
                 'os': ansible_facts.os_name | default(none),
                 'version': ansible_facts.distribution_version | default(none),
                 'golden_image': golden_image_source | default(none, true),
               },
             } }}
