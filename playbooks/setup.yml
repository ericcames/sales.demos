---
# ===========================================================================
# setup.yml — Phase 0. Takes a bare RHDP "Ansible Product Demo" environment to
# demo-ready in ONE command. Issue #1.
#
#   ansible-playbook playbooks/setup.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# Ten stages, in this order:
#
#   1. install_cnv.yml             Install OpenShift Virtualization on the
#                                  cluster and wait until the rhel9 boot source
#                                  is genuinely ready.
#   2. link_rhel9_image.yml        Link the CIS-hardened RHEL 9 golden image
#                                  from image.builder.pipeline (#202). Creates a
#                                  DataImportCron for rhel9-cis-l1 alongside the
#                                  stock rhel9. Skippable:
#                                  `-e link_rhel9_image=false`.
#   3. ensure_shared_objects.yml   Create the VM namespace, the Terraform state
#                                  namespace, and the sd1.* instance type catalog
#                                  (#351, #530). Without this, the nightly
#                                  teardown schedules fail on a new cluster.
#   4. config.yml                  Apply the AAP objects — organization, project,
#                                  credentials, inventories, job templates,
#                                  schedules, the execution environment mirrored
#                                  into this environment's Private Automation
#                                  Hub, and (#68) PAH's own collection remotes
#                                  and repositories.
#   5. mcp_server.yml              Deploy the AAP MCP server, so a new
#                                  environment arrives with it already on rather
#                                  than needing a second visit. Its write posture
#                                  comes from the environment's own group_vars
#                                  and is deliberately not defaulted (#102).
#   6. install_ao.yml              Install Automation Orchestrator and the
#                                  PostgreSQL it cannot run without, via
#                                  CloudNativePG. Default on, skipped with
#                                  `-e install_ao=false` (#141).
#   7. configure_ao.yml            Connect AO to AAP — OIDC SSO and the AAP
#                                  integration so AO can see job templates.
#                                  Gated on install_ao (#457).
#   8. portal.yml                  Deploy the self-service portal — Helm chart,
#                                  OAuth app, org sync. Default on, skipped with
#                                  `-e install_portal=false` (#547).
#   9. generate_env_urls.yml       Regenerate the environment URL reference file
#                                  with credentials (laptop-only). Runs
#                                  automatically since the vault is always
#                                  available during setup.
#  10. prepare_env.yml             Prove it. Checks the boot source, the storage
#                                  clone strategy and ingress, then builds one
#                                  real VM, times it, and destroys it.
#
# WHY THE AAP HALF IS CONFIG-AS-CODE RATHER THAN A BOOTSTRAP STEP. #1 originally
# described porting a bootstrap path from aap.as.code, and flagged the cost
# itself: "the bootstrap step duplicates logic aap-skills/aap.as.code already
# owns and can drift." Applying inventory/group_vars/aap/*.yml through the
# dispatch role avoids that second copy entirely, and is idempotent — re-running
# this on a configured environment converges rather than re-bootstraps.
#
# #1 ALSO ASKED FOR HUB CERTIFIED/VALIDATED CREDENTIALS. Deliberately not done:
# they are unnecessary. AAP would use them to install collections/requirements.yml
# at project sync, and the execution environment already carries every pinned
# collection (#31). Verified on the live sandbox — no organization has a Galaxy
# credential, the sync's collection play reports `ok=3, changed=0`, and job
# templates run green because the EE supplies the collections. Adding one would
# only make every sync re-install what is already baked in.
#
# ^ STILL TRUE, AND STILL THE POSITION. #68 populates Private Automation Hub with
# certified, validated and community content, and deliberately does NOT attach a
# Galaxy credential to the organization — so the paragraph above is unchanged in
# substance. What changed is only its scope: it used to read as "PAH content is
# not worth configuring", and PAH content is now the subject of the repo's
# second use case rather than a means to an end.
#
# THE STEP THAT WOULD INVALIDATE IT NOW EXISTS, AND IS STILL NOT PART OF THIS
# PLAYBOOK. playbooks/link_hub.yml (#69) attaches a Galaxy credential aimed at
# the curated `approved` repository, and from then on every project sync in the
# organization depends on that repository being complete. It is deliberately a
# separate, opt-in run rather than a stage here: setup.yml must leave an
# environment whose job templates work, and this is the one change that can stop
# them working. Run it — and its reversal — through /pah-link-aap.
#
# The hub being "already known to be incomplete" is fixed rather than still
# true. Two pins sat below their version window when this was written; #70's
# generator lowers a floor to any version this repo pins, and `approved` copies
# exact versions so the window stops applying to it at all. What #69 then found
# is a different incompleteness the audit could not see: `approved` held the
# nine DIRECT dependencies and a project sync resolves the TRANSITIVE ones, so
# it failed on ansible.eda. Check both with
# `python3 utilities/refresh-hub-requirements.py --audit-pins` and
# `--write-approved`, which now refuses to write a set missing a dependency.
#
# WHAT PAH CONFIGURATION COSTS THIS PLAYBOOK: seconds. Stage 4 creates the three
# remotes and repositories and STARTS the sync without waiting for it, so the
# time estimate below still holds and the content lands in the background
# (measured at 4.4 minutes to populate all three repositories).
# To watch a sync finish instead, run playbooks/sync_hub.yml — it blocks and
# then verifies against the hub. It is laptop-only and has no job template,
# because the Red Hat offline token lives in ~/.ansible.cfg and an execution
# environment has no such file.
#
# EACH STAGE STAYS RUNNABLE ON ITS OWN, and that is deliberate — this file is a
# convenience, not a bottleneck. Run install_cnv.yml when only a cluster needs
# CNV, config.yml when only AAP objects changed, portal.yml when only the portal
# needs redeploying, generate_env_urls.yml when URLs need refreshing,
# prepare_env.yml to re-check an environment that has been sitting idle.
#
# EXPECT ROUGHLY 25-30 MINUTES: about 4 for CNV, 1-2 for the RHEL 9 golden
# image import, a few for shared objects, several for the AAP objects and the
# first Hub image mirror, about 1 for the MCP server, about 5 for Automation
# Orchestrator and its database, about 2 to configure AO, about 5-10 for the
# self-service portal (Helm + operator), about 1 for env URLs, and about 1 to
# verify. That is on top of RHDP provisioning the environment itself.
# Pass `-e install_ao=false` to skip both AO stages.
# Pass `-e install_portal=false` to skip the portal.
# Pass `-e link_rhel9_image=false` to skip the golden image import.
# A timing summary is printed at the end showing per-stage elapsed times.
# ===========================================================================

- name: "Timer: setup start"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record setup start time
      ansible.builtin.set_fact:
        setup_t_start: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (1/10) — install OpenShift Virtualization
  ansible.builtin.import_playbook: install_cnv.yml

- name: "Timer: after CNV"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after CNV install
      ansible.builtin.set_fact:
        setup_t_cnv: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (2/10) — link the RHEL 9 CIS L1 golden image
  # DEFAULT ON, AND SKIPPABLE. Needs the HyperConverged CR from stage 1 and the
  # quay credentials in the vault. `-e link_rhel9_image=false` skips it for
  # environments where the quay creds are not configured yet; the stock rhel9
  # DataSource still works, it just is not CIS-hardened.
  ansible.builtin.import_playbook: link_rhel9_image.yml
  when: link_rhel9_image | default(true) | bool

- name: "Timer: after RHEL 9 image"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after RHEL 9 image link
      ansible.builtin.set_fact:
        setup_t_rhel9: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (3/10) — ensure shared cluster objects
  # VM namespace, Terraform state namespace, sd1.* instance type catalog.
  # Without this, the nightly teardown schedules fail on a new cluster (#530).
  ansible.builtin.import_playbook: ensure_shared_objects.yml

- name: "Timer: after shared objects"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after shared objects
      ansible.builtin.set_fact:
        setup_t_shared: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (4/10) — apply the AAP configuration
  ansible.builtin.import_playbook: config.yml

- name: "Timer: after AAP config"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after AAP configuration
      ansible.builtin.set_fact:
        setup_t_config: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (5/10) — deploy the AAP MCP server
  ansible.builtin.import_playbook: mcp_server.yml

- name: "Timer: after MCP server"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after MCP server deploy
      ansible.builtin.set_fact:
        setup_t_mcp: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (6/10) — install Automation Orchestrator and its database
  # DEFAULT ON, AND SKIPPABLE. #141 wants AO in every build, so the default is
  # true rather than an opt-in nobody remembers. The flag exists because this
  # stage installs two operators and a database and is the longest-running
  # thing here — a hung AO install must not fail a build that is otherwise
  # fine when someone needs to demo in twenty minutes. `-e install_ao=false`
  # skips it, and install_ao.yml stays runnable on its own afterwards.
  ansible.builtin.import_playbook: install_ao.yml
  when: install_ao | default(true) | bool

- name: "Timer: after AO install"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after AO install
      ansible.builtin.set_fact:
        setup_t_ao_install: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (7/10) — configure Automation Orchestrator
  # Gated on the same flag as install. If AO was not installed, there is nothing
  # to configure — and configure_ao.yml asserts the Route exists, so it would
  # fail cleanly anyway. A separate `configure_ao` flag is not needed unless
  # someone wants AO installed but unconfigured, and that is not a use case yet.
  ansible.builtin.import_playbook: configure_ao.yml
  when: install_ao | default(true) | bool

- name: "Timer: after AO configure"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after AO configuration
      ansible.builtin.set_fact:
        setup_t_ao_config: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (8/10) — deploy the self-service portal
  # DEFAULT ON, AND SKIPPABLE. Same pattern as install_ao: the user always wants
  # it, but `-e install_portal=false` skips it when a hung Helm deploy must not
  # block a build that is otherwise fine. portal.yml stays runnable on its own
  # afterwards. Needs AAP configured first (creates a gateway OAuth app), so it
  # goes after config.yml. Does NOT depend on AO (#547).
  ansible.builtin.import_playbook: portal.yml
  when: install_portal | default(true) | bool

- name: "Timer: after portal"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after portal deploy
      ansible.builtin.set_fact:
        setup_t_portal: "{{ now(utc=true).strftime('%s') | int }}"
        generate_env_urls_with_creds: true

- name: Phase 0 (9/10) — generate the environment URL reference
  # WITH CREDS. setup.yml is always a laptop command and the vault is always
  # available, so generate_env_urls_with_creds is set to true in the preceding
  # timer play.
  ansible.builtin.import_playbook: generate_env_urls.yml

- name: "Timer: after env URLs"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after env URL generation
      ansible.builtin.set_fact:
        setup_t_env_urls: "{{ now(utc=true).strftime('%s') | int }}"

- name: Phase 0 (10/10) — prove the environment is demo-ready
  ansible.builtin.import_playbook: prepare_env.yml

- name: "Timer: after verify"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Record time after environment verification
      ansible.builtin.set_fact:
        setup_t_verify: "{{ now(utc=true).strftime('%s') | int }}"

- name: "Phase 0 — timing summary"
  hosts: aap
  gather_facts: false
  tasks:
    - name: Compute per-stage elapsed times
      ansible.builtin.set_fact:
        setup_elapsed:
          cnv: "{{ (setup_t_cnv | int) - (setup_t_start | int) }}"
          rhel9_image: "{{ (setup_t_rhel9 | int) - (setup_t_cnv | int) }}"
          shared_objects: "{{ (setup_t_shared | int) - (setup_t_rhel9 | int) }}"
          config: "{{ (setup_t_config | int) - (setup_t_shared | int) }}"
          mcp_server: "{{ (setup_t_mcp | int) - (setup_t_config | int) }}"
          ao_install: "{{ (setup_t_ao_install | int) - (setup_t_mcp | int) }}"
          ao_configure: "{{ (setup_t_ao_config | int) - (setup_t_ao_install | int) }}"
          portal: "{{ (setup_t_portal | int) - (setup_t_ao_config | int) }}"
          env_urls: "{{ (setup_t_env_urls | int) - (setup_t_portal | int) }}"
          verify: "{{ (setup_t_verify | int) - (setup_t_env_urls | int) }}"
          total: "{{ (setup_t_verify | int) - (setup_t_start | int) }}"

    - name: Print the timing summary
      ansible.builtin.debug:
        msg:
          - ""
          - "===== Phase 0 timing summary ====="
          - "  Install CNV:              {{ setup_elapsed.cnv }}s"
          - "  Link RHEL 9 image:        {{ setup_elapsed.rhel9_image }}s{{ ' (skipped)' if not (link_rhel9_image | default(true) | bool) else '' }}"
          - "  Shared cluster objects:    {{ setup_elapsed.shared_objects }}s"
          - "  AAP configuration:        {{ setup_elapsed.config }}s"
          - "  MCP server:               {{ setup_elapsed.mcp_server }}s"
          - "  Install AO:               {{ setup_elapsed.ao_install }}s{{ ' (skipped)' if not (install_ao | default(true) | bool) else '' }}"
          - "  Configure AO:             {{ setup_elapsed.ao_configure }}s{{ ' (skipped)' if not (install_ao | default(true) | bool) else '' }}"
          - "  Self-service portal:      {{ setup_elapsed.portal }}s{{ ' (skipped)' if not (install_portal | default(true) | bool) else '' }}"
          - "  Generate env URLs:        {{ setup_elapsed.env_urls }}s"
          - "  Verify environment:       {{ setup_elapsed.verify }}s"
          - "  -----------------------------------"
          - "  TOTAL:                    {{ setup_elapsed.total }}s ({{ ((setup_elapsed.total | int) / 60) | round(1) }} min)"
          - "====================================="
          - ""
