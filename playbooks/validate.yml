---
# ===========================================================================
# validate.yml — dry-run the config-as-code apply (check mode). Issue #24.
#
# Same inputs and auth as config.yml, but runs dispatch in check mode so it
# reports what WOULD change without changing anything. Run this before
# config.yml, always — it is the cheapest way to find out that a variable name
# is wrong or an object is malformed.
#
#   ansible-playbook playbooks/validate.yml --check -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# --check IS REQUIRED, AND THE PLAY REFUSES TO RUN WITHOUT IT (#173). The play
# still carries `check_mode: true` so nothing can be applied by accident, but
# that alone was never enough, and from this playbook's first commit until #173
# it quietly was not:
#
#   `check_mode: true` on the play sets the TASK's check mode. It does NOT set
#   the `ansible_check_mode` magic variable, which is True only for a CLI
#   --check. Measured both ways, on core 2.16.19 and 2.18.18rc1.
#
# infra.aap_configuration's check-mode handling is written entirely against
# `ansible_check_mode`. With it False, every one of those branches took its
# non-check path while the tasks themselves ran in check mode. Eleven of the
# roles dispatch runs for this repo set `async: "{{ ansible_check_mode |
# ternary(0, 1000) }}"` — so they were asking for async in check mode, which is
# a combination ansible-core 2.16 rejects outright:
#
#   fatal: [sandbox-local]: FAILED! =>
#     {"msg": "check mode and async cannot be used on same task."}
#
# The laptop never saw it because core dropped that guard in 2.17.0 — present
# through 2.16.19, absent from 2.17.0 onward, measured by unpacking the 2.16.19,
# 2.17.0, 2.17.14, 2.18.0 and 2.18.18 wheels and reading
# ansible/plugins/action/__init__.py, not read off a release note.
#
# So validate passed on the laptop's 2.18 and failed in the EE's 2.16 — same
# commit, same cluster, minutes apart. See #120: the EE is what AAP runs, so
# the EE is the one that counts.
#
# Passing --check makes all eleven take their intended check-mode path. It also
# turns on dispatch's own check-mode error reporting, which was dead code here.
#
# HOW VARS ARRIVE: implicitly, from inventory/group_vars/. There is deliberately
# no vars_files or include_vars. `--limit sandbox` loads group_vars/aap/*
# (shared) merged with group_vars/sandbox/* (per-environment deltas), combined
# by dispatch_include_wildcard_vars, which is set in group_vars/aap/aap_settings.yml.
#
# CHECK MODE IS NOT A PERFECT PREDICTION. Some infra.aap_configuration roles
# cannot fully evaluate without writing, so treat the output as a strong signal
# rather than a contract. It will still catch the common failures: bad
# credentials, unreachable host, undefined variables, malformed objects.
#
# ONE OF THOSE ROLES DID NOT DEGRADE, IT CRASHED, AND ON THE ONE RUN THAT
# MATTERS MOST (#106). Dispatch runs hub_ee_registry then hub_ee_repository, and
# the second READS BACK the registry the first would have written. In check mode
# the write never happens, so ansible.hub 1.1.0 indexes an empty lookup:
#
#   KeyError: 'id'   at ansible/hub/plugins/modules/ah_ee_repository.py:238
#
# That is a read-after-write across two roles, not version drift — proven by
# running config.yml once and then the identical validate command clean
# (ok=197 failed=0), same cluster, same collections. And it fired precisely on a
# never-configured environment: the first apply against a brand-new cluster,
# which is exactly when a dry run is worth the most. The header said "run this
# before config.yml, always" and that instruction could not be followed.
#
# Worse, aap_configuration_secure_logging hid the traceback behind
# `censored: 'the output has been hidden...'`, so the failure was opaque as well
# as fatal.
#
# The pre-flight below detects the missing registry and skips ONLY the role that
# cannot evaluate without it, saying so out loud. See the task for the coverage
# gap that leaves.
#
# ONE ROLE WOULD OTHERWISE IGNORE CHECK MODE ENTIRELY, WHICH IS WHY hub_sync_enabled
# IS FORCED FALSE BELOW (#68). ansible.hub 1.1.0's collection_repository_sync
# module reads `module.params.get("check_mode")`, but `check_mode` is not in its
# argument_spec — so it is always None, the guarded early-exit never fires, and
# the sync runs FOR REAL. (It should be `module.check_mode`.)
#
# The group_vars expression that normally covers this uses `not
# ansible_check_mode`, and that magic variable is only True for a CLI `--check`.
# A play-level `check_mode: true` like the one below leaves it False — verified
# both ways. So this play has to say so explicitly, or "Nothing will be changed"
# becomes a lie and a validate run kicks three live PAH syncs.
#
# #173 FOUND THAT THIS WAS THE SAME BUG TWICE, not a quirk of one collection.
# The `ansible_check_mode` gap diagnosed above is general: it silenced
# infra.aap_configuration's check-mode handling wholesale, and #68 had already
# hit one instance of it without either of us seeing the shape. Requiring
# --check closes it at the source, so this override is now belt-and-braces
# rather than the only thing standing between a dry run and three live syncs.
# It stays exactly as it is: it costs nothing, and it is the safe direction to
# be wrong in.
# ===========================================================================

- name: Validate AAP configuration in check mode
  hosts: aap
  gather_facts: false
  check_mode: true

  vars:
    # See the header. Kept as belt-and-braces: now that the play requires
    # --check, the group_vars guard covers this too, but a second guard against
    # kicking three live PAH syncs costs nothing.
    hub_sync_enabled: false

    # ONE VARIABLE COVERS EVERY hub_* ROLE (#173).
    #
    # The sixteen hub roles all take their async timeout from a per-role
    # variable that defaults to `aap_configuration_async_timeout | default(1000)`
    # — so setting the parent to 0 makes every one of them synchronous, now and
    # for any hub role added later. Eight of them run for this repo.
    #
    # That matters because async in check mode is a hard error on the
    # ansible-core the EE ships (2.16), and unlike the controller and gateway
    # roles the hub ones have no `ansible_check_mode` guard of their own, so
    # --check alone does not save them.
    #
    # UNCONDITIONAL, not conditional on the core version, and deliberately so.
    # Async buys nothing in check mode — nothing is being written to overlap
    # with — and the entire point of #120 is that the laptop run and the EE run
    # should take the SAME path. A version-conditional here would reintroduce
    # exactly the divergence this playbook was failing to detect.
    aap_configuration_async_timeout: 0

  tasks:
    - name: Refuse to run without --check
      # HOW YOU INVOKED IT, CHECKED BEFORE WHAT YOU INVOKED IT AGAINST.
      #
      # Without --check this play still changes nothing -- `check_mode: true`
      # above sees to that -- but it validates almost nothing either, because
      # every check-mode branch in infra.aap_configuration keys off
      # `ansible_check_mode` and that is False. On the EE's ansible-core it does
      # not even get that far; it dies on async. See the header.
      #
      # Asserting rather than warning: a validate run that reports success
      # having exercised the wrong code path is precisely the wrong answer that
      # looks right.
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: >-
          Run this with --check. A play-level `check_mode: true` sets the task's
          check mode but leaves the `ansible_check_mode` variable False, and
          infra.aap_configuration's check-mode handling is written entirely
          against that variable -- so without --check the roles take their
          non-check path, and on ansible-core 2.16 (which is what the execution
          environment ships, and therefore what AAP runs) they fail with
          "check mode and async cannot be used on same task" (#173). Re-run as:
          ansible-playbook playbooks/validate.yml --check -i inventory
          --limit {{ aap_env_name | default('<env>') }} -e target_env={{ aap_env_name | default('<env>') }}
          --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
        quiet: true

    - name: Assert the environment is unambiguous
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert AAP connection variables are set
      # aap_hostname and aap_username come from the committed
      # group_vars/<env>/connection.yml; aap_password is resolved from the
      # vault-encrypted playbooks/group_vars/all/secrets.yml via env_secrets.
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_username | default('') | length > 0
          - aap_password | default('') | length > 0
        fail_msg: >-
          aap_hostname / aap_username / aap_password are not set for
          '{{ aap_env_name | default("?") }}'. Check that environment's
          connection.yml, that playbooks/group_vars/all/secrets.yml exists --
          it is gitignored, so a fresh clone has only the .example (#130) --
          and that --vault-id was passed so env_secrets resolves. Run
          /sales-demos-first-time to build it.
        quiet: true

    - name: Report what would be applied
      ansible.builtin.debug:
        msg: >-
          Check mode against {{ aap_env_name }} ({{ aap_hostname }}).
          Nothing will be changed.

    # -----------------------------------------------------------------------
    # Pre-flight for the read-after-write pair (#106).
    #
    # Read-only, and it uses ansible.builtin.uri with the password resolved from
    # env_secrets rather than shelling out — the same way sync_hub.yml talks to
    # this hub. The credential never reaches a shell variable or a process
    # argument.
    # -----------------------------------------------------------------------
    - name: Ask the hub which EE registries already exist
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/galaxy/_ui/v1/execution-environments/registries/?limit=100"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs | default(false) | bool }}"
      register: validate_ee_registries
      check_mode: false
      failed_when: false

    - name: Work out which declared EE registries are missing
      # Since #186, hub_ee_registries_all is no longer defined — we use the
      # stock "Red Hat Quay.io" registry instead of creating our own. The
      # default([]) makes the difference empty, so the skip block below is a
      # no-op. It is kept as a safety net: if a future change re-introduces a
      # custom registry, the protection returns without anyone remembering to
      # re-add it.
      ansible.builtin.set_fact:
        validate_missing_registries: >-
          {{ hub_ee_registries_all | default([]) | map(attribute='name') | list
             | difference(validate_ee_registries.json.data | default([]) | map(attribute='name') | list) }}

    - name: Skip the EE repository role when its registry does not exist yet
      # hub_ee_repository is the role that crashes, and it crashes only because
      # the registry it reads is absent. Emptying its input makes dispatch
      # include the role with nothing to iterate, so the run completes instead
      # of dying with a KeyError.
      ansible.builtin.set_fact:
        hub_ee_repositories_all: []
      when: validate_missing_registries | length > 0

    - name: Say so, loudly
      ansible.builtin.debug:
        msg:
          - "EE registries missing from this hub: {{ validate_missing_registries | join(', ') }}"
          - "SKIPPING the hub_ee_repository role for this run. It reads back a"
          - "registry that dispatch would create earlier in the same run, and in"
          - "check mode that write never happens (#106)."
          - ""
          - "NOT VALIDATED THIS RUN: the items in hub_ee_repositories.yml."
          - "Run playbooks/config.yml to create the registry, then re-run this"
          - "playbook — the skip disappears and coverage is complete."
      when: validate_missing_registries | length > 0

    # -----------------------------------------------------------------------
    # THE ONE ROLE NEITHER FIX REACHES (#173).
    #
    # The roles dispatch runs for this repo set async three different ways, and
    # only the third needs anything from this file:
    #
    #   11 controller/gateway roles  `ansible_check_mode | ternary(0, 1000)`
    #                                --check fixes all eleven. No coverage lost.
    #    8 hub_* roles               a per-role variable descending from
    #                                aap_configuration_async_timeout, set to 0
    #                                in this play's vars. No coverage lost.
    #    1 gateway_organizations     a flat `async: 1000`. No knob, no guard.
    #
    # So the rule is: use the override wherever the collection provides one,
    # because it is free, and skip a role only where it does not — which is
    # here, and only here.
    #
    # It is an upstream miss rather than a design choice, and the proof is 55
    # lines below it in the same file: the *controller* task in that same role
    # does carry the ternary. infra.aap_configuration 4.7.0,
    # roles/gateway_organizations/tasks/main.yml, lines 26 and 81.
    # -----------------------------------------------------------------------
    - name: Skip the organizations role on an ansible-core that rejects async in check mode
      # SAME SHAPE AS THE SKIP ABOVE: empty the wildcard SOURCE var, not the
      # base one. dispatch re-derives `aap_organizations` from every
      # `aap_organizations_*` var when it runs, so setting the base here would
      # simply be overwritten -- the role would still get its list, and still
      # crash.
      #
      # The role is still included, with nothing to iterate, so the run
      # completes instead of dying.
      #
      # WHAT IS NOT VALIDATED AS A RESULT: the items in aap_organizations.yml.
      # A malformed organization would not be caught on a run where this fires.
      #
      # IT IS CONDITIONAL FOR THAT REASON. The guard core raises from lives in
      # plugins/action/__init__.py and is present through 2.16.19 and gone from
      # 2.17.0 onward -- measured by unpacking 2.16.19, 2.17.0, 2.17.14, 2.18.0
      # and 2.18.18 rather than read off a release note. So a laptop on 2.17+
      # keeps full coverage and only the EE run gives it up, which is the right
      # way round: the EE run is the one verifying that everything ELSE works
      # where AAP runs it.
      ansible.builtin.set_fact:
        aap_organizations_all: []
      when: ansible_version.full is version('2.17', '<')

    - name: Say so, loudly, about the organizations skip too
      ansible.builtin.debug:
        msg:
          - "ansible-core {{ ansible_version.full }} rejects async in check mode."
          - "SKIPPING the gateway_organizations role for this run: its gateway"
          - "task sets async unconditionally, so it cannot run in check mode"
          - "here at all (#173)."
          - ""
          - "NOT VALIDATED THIS RUN: the items in aap_organizations.yml."
          - "Everything else IS validated, and on the core AAP actually runs."
          - "A laptop run on core 2.17 or newer covers the organizations too."
      when: ansible_version.full is version('2.17', '<')

    - name: Dispatch in check mode (reports intended changes, applies nothing)
      # Basic auth on purpose. dispatch supports it directly, so no OAuth token
      # is minted — which means there is nothing to leak and nothing to clean
      # up in an `always:` block.
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
