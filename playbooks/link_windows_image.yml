---
# ===========================================================================
# link_windows_image.yml — point this environment's CNV at the published
# Windows golden containerdisk, so os_type=windows can boot. Issue #3.
#
#   ansible-playbook playbooks/link_windows_image.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# AND THE REVERSAL, which ships in the same change for the same reason it did
# in link_hub.yml — the thing this touches is a cluster-wide boot source:
#
#   ansible-playbook playbooks/link_windows_image.yml -i inventory --limit sandbox \
#     -e target_env=sandbox -e windows_image_link_state=absent \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# WHAT THIS DOES. Creates a pull secret for the private quay repository holding
# the Windows containerdisk, adds a DataImportCron template to the
# HyperConverged CR, and creates a DataVolume to import the image. The
# DataImportCron is there for future refresh; the DataVolume is the actual
# import trigger because CDI 4.20's DataImportCron controller cannot
# authenticate to a private registry for its initial digest check (#224).
# Once imported, the DataSource `win2k22` is updated to point at the PVC.
# Terraform already clones that DataSource (terraform/ocpvirt/main.tf) and
# has been blocked on it since Phase 1.
#
# ---------------------------------------------------------------------------
# WHY A DataImportCron AND NOT A HAND-CREATED PVC
# ---------------------------------------------------------------------------
# #3 originally said "snapshot the disk to a DataSource named
# windows2k22-golden". That is not how boot sources are kept on a cluster, and
# this cluster is the proof. Measured on sandbox, CNV 4.20.24:
# HyperConverged.status.dataImportCronTemplates carries six entries — fedora,
# centos-stream 9/10, rhel 8/9/10 — each with managedDataSource,
# garbageCollect: Outdated and a registry source. Windows is absent only
# because Red Hat cannot redistribute the media, not because the mechanism
# differs.
#
# A hand-created PVC is a one-shot artifact with no refresh path. A cron makes
# a fresh RHDP environment a CONFIG step rather than a data-movement one.
#
# TAKING OVER THE SSP PLACEHOLDER IS THE DESIGNED HANDOFF, NOT A FIGHT.
# Compare the two DataSources on an untouched cluster:
#
#                     win2k22 (placeholder)      rhel9 (managed)
#   managed-by        ssp-operator               cdi-controller
#   dataImportCron    (absent)                   rhel9-image-cron
#   spec.source       pvc {name: win2k22}        snapshot {name: rhel9-...}
#   Ready             False — "PVC not found"    True
#
# SSP creates the placeholder; the cron takes ownership, relabels it, and
# rewrites spec.source from pvc to snapshot. If that ever misbehaves, set
# win_managed_datasource to a name SSP does not own and repoint
# windows_datasource_name in terraform/ocpvirt/variables.tf to match.
#
# THE BUILT-IN TEMPLATES ARE NOT AT RISK. spec.dataImportCronTemplates is
# EMPTY on a stock cluster — the six common ones live in HCO itself and appear
# only in status, flagged commonTemplate: true. Custom entries coexist.
# ===========================================================================

- name: Point CNV at the published Windows golden image
  hosts: aap
  gather_facts: false

  environment:
    # kubernetes.core reads these; keeps the token out of every task's args
    # and out of any -vvv output.
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"

  vars:
    # `-e windows_image_link_state=absent` reverses everything below.
    windows_image_link_state: "present"

    win_cnv_namespace: "openshift-cnv"
    win_datasource_namespace: "openshift-virtualization-os-images"

    # The SSP-shipped placeholder. terraform/ocpvirt/variables.tf defaults
    # windows_datasource_name to this same string — change both together.
    win_managed_datasource: "win2k22"
    win_cron_name: "win2k22-image-cron"
    win_pull_secret_name: "windows-golden-pull"

    # 60Gi matches windows_min_disk_gb in terraform/ocpvirt/locals.tf. The
    # shipped Linux boot sources are 30Gi; Windows does not fit in that.
    win_image_storage_size: "60Gi"

    # The cadence the shipped crons use. NOTE: with an immutable date tag in
    # quay_windows_image the poll is a no-op by design — pointing that variable
    # at a moving tag is what makes the cron actually refresh anything.
    win_image_schedule: "9 10/12 * * *"

    # The manual DataVolume name. Deterministic so re-runs are idempotent.
    win_import_name: "win2k22-initial-import"

    # What the cluster is being asked to serve. A play var, not a set_fact,
    # because Summarize runs in both states and Jinja's ternary evaluates
    # both of its branches.
    win_wanted_image_url: "docker://{{ quay_windows_image }}"

    # The image is ~4.5 GiB compressed; cluster-side pull takes ~80 min.
    win_import_retries: 100
    win_import_delay: 60

    # Short wait for the DataSource after the PVC is already Bound.
    win_wait_retries: 30
    win_wait_delay: 10

    # Deleting a 60Gi DataVolume takes its PVC with it, and on Ceph RBD the
    # PV release is not instant. Generous, because the replacement import
    # cannot start until the name is free.
    win_delete_timeout: 600

  tasks:
    - name: Assert exactly one environment is targeted
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert the requested state is valid
      ansible.builtin.assert:
        that:
          - windows_image_link_state in ['present', 'absent']
        fail_msg: >-
          windows_image_link_state must be 'present' or 'absent', not
          '{{ windows_image_link_state }}'.
        quiet: true

    - name: Assert the OpenShift connection is set
      ansible.builtin.assert:
        that:
          - openshift_api_url | default('') | length > 0
          - openshift_api_token | default('') | length > 0
        fail_msg: >-
          openshift_api_url and openshift_api_token are required. They come
          from inventory/group_vars/<env>/connection.yml plus the vaulted
          playbooks/group_vars/all/secrets.yml; pass --vault-id so the token
          resolves.
        quiet: true

    - name: Assert the image reference and quay credentials are set
      # Referenced bare on purpose. utilities/check-secrets-example.py only
      # counts a key as consumed when it appears in an expression with no
      # `default`, and quay_username / quay_password have to leave its STAGED
      # allowlist in the same change that starts reading them.
      ansible.builtin.assert:
        that:
          - quay_windows_image is defined
          - quay_windows_image | length > 0
          - "'<user>' not in quay_windows_image"
          - quay_username is defined
          - quay_username | length > 0
          - quay_username != 'CHANGEME'
          - quay_password is defined
          - quay_password | length > 0
          - quay_password != 'CHANGEME'
        fail_msg: >-
          quay_windows_image must name a real published containerdisk
          (set in inventory/group_vars/<env>/connection.yml),
          and quay_username / quay_password must be set in the vaulted
          secrets.yml. See docs/plan/ocpvirt-demo-plan.md.
        quiet: true
      when: windows_image_link_state == 'present'

    - name: Say what is about to happen
      ansible.builtin.debug:
        msg: >-
          {{ (windows_image_link_state == 'present') | ternary('LINKING', 'UNLINKING') }}
          the Windows golden image on {{ aap_env_name }}
          (DataSource {{ win_managed_datasource }} in {{ win_datasource_namespace }}).

    # --- The pull secret ----------------------------------------------------
    - name: Create the pull secret for the private quay repository
      # CDI's importer pod reads the secret as accessKeyId / secretKey env
      # vars, NOT as a dockerconfigjson. The earlier dockerconfigjson format
      # produced CreateContainerConfigError: "couldn't find key accessKeyId"
      # (#222 → #224).
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ win_pull_secret_name }}"
            namespace: "{{ win_datasource_namespace }}"
          type: Opaque
          data:
            accessKeyId: "{{ quay_username | b64encode }}"
            secretKey: "{{ quay_password | b64encode }}"
      no_log: true
      when: windows_image_link_state == 'present'

    # --- The DataImportCron template ---------------------------------------
    - name: Read the current HyperConverged CR
      kubernetes.core.k8s_info:
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        name: kubevirt-hyperconverged
        namespace: "{{ win_cnv_namespace }}"
      register: win_hco

    - name: Assert OpenShift Virtualization is installed
      ansible.builtin.assert:
        that:
          - win_hco.resources | default([]) | length > 0
        fail_msg: >-
          No HyperConverged CR in {{ win_cnv_namespace }}. OpenShift
          Virtualization is not installed — run playbooks/install_cnv.yml
          (or the ocpvirt-setup skill) first.
        quiet: true

    - name: Build the desired dataImportCronTemplates list
      # Everything already in spec, minus any earlier copy of ours, plus ours
      # when present. Computing the whole list keeps this idempotent under a
      # merge patch, which replaces lists wholesale.
      ansible.builtin.set_fact:
        win_desired_crons: >-
          {{
            (win_hco.resources[0].spec.dataImportCronTemplates | default([]))
            | rejectattr('metadata.name', 'equalto', win_cron_name) | list
            + ((windows_image_link_state == 'present') | ternary([win_cron_entry], []))
          }}
      vars:
        win_cron_entry:
          metadata:
            name: "{{ win_cron_name }}"
            annotations:
              cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          spec:
            managedDataSource: "{{ win_managed_datasource }}"
            garbageCollect: Outdated
            schedule: "{{ win_image_schedule }}"
            template:
              spec:
                source:
                  registry:
                    url: "docker://{{ quay_windows_image }}"
                    # No pullMethod: the default (pod) is the one that honours
                    # secretRef. pullMethod: node ignores it and would need
                    # cluster-wide pull credentials instead.
                    secretRef: "{{ win_pull_secret_name }}"
                storage:
                  resources:
                    requests:
                      storage: "{{ win_image_storage_size }}"

    - name: Patch the HyperConverged CR
      kubernetes.core.k8s:
        state: patched
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        name: kubevirt-hyperconverged
        namespace: "{{ win_cnv_namespace }}"
        definition:
          spec:
            dataImportCronTemplates: "{{ win_desired_crons }}"

    # --- Import the image via a manual DataVolume ----------------------------
    # CDI's DataImportCron controller cannot get the image digest from a
    # private registry — it fails silently with "No source digest" and never
    # creates a DataVolume (#224). The cron template stays in HCO for future
    # CDI versions; this DataVolume is the explicit import trigger.
    - name: Check if the DataSource is already Ready
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataSource
        name: "{{ win_managed_datasource }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_ds_check
      when: windows_image_link_state == 'present'

    - name: Read the DataVolume that currently backs the DataSource
      # WHAT IS SERVED, not merely whether something is served. The import
      # decision below turns on this URL. The DataVolume already records the
      # reference it imported, so the cluster is asked what it actually holds
      # rather than being taken at its word — nothing extra has to be stored
      # to compare against.
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_dv_current
      when: windows_image_link_state == 'present'

    - name: Determine which image the cluster is actually serving
      # `+ [{}] | first` makes the lookup total: an absent DataVolume, or one
      # without the nested keys, yields '' instead of an index error.
      ansible.builtin.set_fact:
        win_current_image_url: >-
          {{ ((win_dv_current.resources | default([]) + [{}]) | first)
             .spec.source.registry.url | default('') }}
      when: windows_image_link_state == 'present'

    - name: Decide whether an import is needed
      # THREE reasons to import, and the third is the one #358 was missing:
      #
      #   1. there is no DataSource at all
      #   2. the DataSource exists but is not Ready
      #   3. the DataSource is Ready and serving THE WRONG IMAGE
      #
      # Before #358 this was (1) or (2) only — readiness, never identity. So
      # once the first import succeeded, changing quay_windows_image imported
      # nothing, repointed nothing, and still reported success, because the
      # only things verified were "Ready" and "Bound" and both were true of
      # the old image. Sandbox spent two days advertising the CIS L1 tag in
      # HyperConverged while every clone booted the unhardened
      # win2k22-golden image imported the day before the L1 one existed, and
      # the compliance node scored the demo guest at 9 of 27 controls.
      #
      # THE HCO PATCH ABOVE IS NOT A SECOND CHANCE AT THIS. It carries the
      # new URL, but CDI cannot authenticate a DataImportCron to a private
      # registry (#224), so that template imports nothing. This DataVolume
      # is the only thing that moves bits.
      ansible.builtin.set_fact:
        win_needs_import: >-
          {{ (win_ds_check.resources | default([]) | length == 0)
             or (win_ds_check.resources[0].status.conditions | default([])
                 | selectattr('type', 'equalto', 'Ready')
                 | selectattr('status', 'equalto', 'True') | list | length == 0)
             or (win_current_image_url != win_wanted_image_url) }}
      when: windows_image_link_state == 'present'

    - name: Report the import decision
      ansible.builtin.debug:
        msg: >-
          {{
            (not win_needs_import | bool) | ternary(
              'DataSource ' ~ win_managed_datasource ~ ' already serves '
              ~ win_wanted_image_url ~ ' — nothing to import.',
              'Import needed. Serving: ' ~ (win_current_image_url | default('<none>', true))
              ~ ' / wanted: ' ~ win_wanted_image_url
            )
          }}
      when: windows_image_link_state == 'present'

    # A DataVolume's source is immutable, so a changed tag cannot be applied
    # in place — the old one has to go first. `wait: true` because the
    # replacement below would otherwise race the deletion and fail on a name
    # that still exists. Deleting the DataVolume takes its PVC with it.
    - name: Remove the DataVolume holding the wrong image
      kubernetes.core.k8s:
        state: absent
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
        wait: true
        wait_timeout: "{{ win_delete_timeout }}"
      when:
        - windows_image_link_state == 'present'
        - win_needs_import | bool
        - win_current_image_url | length > 0
        - win_current_image_url != win_wanted_image_url

    - name: Create the DataVolume to import the Windows image
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: "{{ win_import_name }}"
            namespace: "{{ win_datasource_namespace }}"
            annotations:
              cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          spec:
            source:
              registry:
                url: "docker://{{ quay_windows_image }}"
                secretRef: "{{ win_pull_secret_name }}"
            storage:
              resources:
                requests:
                  storage: "{{ win_image_storage_size }}"
      when:
        - windows_image_link_state == 'present'
        - win_needs_import | bool

    - name: Wait for the DataVolume import to complete
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_dv
      retries: "{{ win_import_retries }}"
      delay: "{{ win_import_delay }}"
      until:
        - win_dv.resources | default([]) | length > 0
        - win_dv.resources[0].status.phase | default('') == 'Succeeded'
      when:
        - windows_image_link_state == 'present'
        - win_needs_import | bool

    - name: Point the DataSource at the imported PVC
      kubernetes.core.k8s:
        state: patched
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataSource
        name: "{{ win_managed_datasource }}"
        namespace: "{{ win_datasource_namespace }}"
        definition:
          spec:
            source:
              pvc:
                name: "{{ win_import_name }}"
                namespace: "{{ win_datasource_namespace }}"
      when:
        - windows_image_link_state == 'present'
        - win_needs_import | bool

    # --- Verify, by asking the cluster --------------------------------------
    - name: Wait for the Windows DataSource to report Ready
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataSource
        name: "{{ win_managed_datasource }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_datasource
      retries: "{{ win_wait_retries }}"
      delay: "{{ win_wait_delay }}"
      until:
        - win_datasource.resources | default([]) | length > 0
        - win_datasource.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True') | list | length > 0
      when: windows_image_link_state == 'present'

    - name: Assert the backing PVC is Bound
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_backing_pvc
      failed_when:
        - win_backing_pvc.resources | default([]) | length == 0
          or win_backing_pvc.resources[0].status.phase | default('') != 'Bound'
      when: windows_image_link_state == 'present'

    # --- The check that makes a silent no-op impossible ---------------------
    # READY AND BOUND ARE BOTH TRUE OF THE WRONG IMAGE. That is not a
    # hypothetical: it is precisely what the two checks above certified for two
    # days in #358, while the demo guest booted an image published as
    # CIS-unhardened and the talk track invited a customer to read its
    # compliance report.
    #
    # So the identity is re-read from the cluster AFTER any import, and
    # asserted on EVERY run — including the run that decided no import was
    # needed, which is the run that has to be able to fail. The same reasoning
    # as check 2 in utilities/check-no-secrets.sh: the desired state is not
    # trusted because it was requested, it is tested because it was requested.
    - name: Re-read the DataVolume now backing the DataSource
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
      register: win_dv_final
      when: windows_image_link_state == 'present'

    - name: Assert the cluster serves the image quay_windows_image names
      ansible.builtin.assert:
        that:
          - win_dv_final_url == win_wanted_image_url
        fail_msg: >-
          DataSource {{ win_managed_datasource }} is Ready and its PVC is
          Bound, but it is serving {{ win_dv_final_url | default('<nothing>', true) }}
          and quay_windows_image asks for {{ win_wanted_image_url }}. A clone
          taken now would boot the wrong image. This is #358.
        success_msg: >-
          DataSource {{ win_managed_datasource }} serves {{ win_wanted_image_url }}.
        quiet: true
      vars:
        win_dv_final_url: >-
          {{ ((win_dv_final.resources | default([]) + [{}]) | first)
             .spec.source.registry.url | default('') }}
      when: windows_image_link_state == 'present'

    # --- Reversal -----------------------------------------------------------
    - name: Remove the import DataVolume and its PVC
      kubernetes.core.k8s:
        state: absent
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ win_import_name }}"
        namespace: "{{ win_datasource_namespace }}"
      when: windows_image_link_state == 'absent'

    - name: Remove the pull secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ win_pull_secret_name }}"
        namespace: "{{ win_datasource_namespace }}"
      when: windows_image_link_state == 'absent'

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          {{
            (windows_image_link_state == 'present') | ternary(
              'DataSource ' ~ win_managed_datasource ~ ' is Ready, backed by PVC '
              ~ win_import_name ~ ', serving ' ~ win_wanted_image_url
              ~ '. terraform -var os_type=windows can now boot. Reverse with: '
              ~ '-e windows_image_link_state=absent',
              'Unlinked. The ' ~ win_cron_name ~ ' template, the DataVolume, and the '
              ~ 'pull secret are gone; ' ~ win_managed_datasource
              ~ ' returns to its empty SSP placeholder state.'
            )
          }}
