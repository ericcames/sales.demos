---
# ===========================================================================
# config.yml — apply config-as-code to an AAP environment. Issue #24.
#
# Applies the objects defined in inventory/group_vars/ to the environment
# chosen with --limit. Idempotent, with one documented exception noted below.
#
#   ansible-playbook playbooks/config.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# Run playbooks/validate.yml --check first. It is the same play in check mode,
# and it requires --check: without it the collection's check-mode branches all
# take their non-check path, which is what #173 turned out to be.
#
# HOW VARS ARRIVE: implicitly, from inventory/group_vars/. There is deliberately
# no vars_files or include_vars. `--limit sandbox` loads group_vars/aap/*
# (shared) merged with group_vars/sandbox/* (per-environment deltas), combined
# by dispatch_include_wildcard_vars, which is set in group_vars/aap/aap_settings.yml.
# That merge is how gateway_settings_all (shared pre-login banner) and
# gateway_settings_sandbox (environment-badged sign-in logo) end up applied
# together rather than one replacing the other.
#
# EXPECT changed ON EVERY RUN. AAP returns SUBSCRIPTIONS_CLIENT_SECRET as
# "$encrypted$" and never in the clear, so the controller_settings role cannot
# compare desired against actual and rewrites it each time. That is the platform
# refusing to hand back a secret, not drift and not a bug — see the header of
# group_vars/aap/controller_settings.yml, which also says which two lines to
# drop if a clean changed=0 story matters more than analytics.
# ===========================================================================

- name: Apply AAP configuration
  hosts: aap
  gather_facts: false

  vars:
    # Named once rather than repeated, because #148's project sync and
    # controller_projects.yml must agree on which project they mean.
    sales_demos_project: "Sales Demos"
    sales_demos_organization: "IT Service Automation"

  tasks:
    - name: Assert the environment is unambiguous
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert AAP connection variables are set
      # aap_hostname and aap_username come from the committed
      # group_vars/<env>/connection.yml; aap_password is resolved from the
      # vault-encrypted playbooks/group_vars/all/secrets.yml via env_secrets.
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_username | default('') | length > 0
          - aap_password | default('') | length > 0
        fail_msg: >-
          aap_hostname / aap_username / aap_password are not set for
          '{{ aap_env_name | default("?") }}'. Check that environment's
          connection.yml, that playbooks/group_vars/all/secrets.yml exists --
          it is gitignored, so a fresh clone has only the .example (#130) --
          and that --vault-id was passed so env_secrets resolves. Run
          /sales-demos-first-time to build it.
        quiet: true

    - name: Report the target
      ansible.builtin.debug:
        msg: "Applying configuration to {{ aap_env_name }} ({{ aap_hostname }})."

    # -------------------------------------------------------------------
    # Sync the project BEFORE the job templates are applied (#148).
    #
    # AAP validates a job template's `playbook:` against the project's SCM
    # CHECKOUT, not against the repository. A project whose last sync predates
    # a newly added playbook therefore fails template creation with
    #
    #   {'playbook': ['Playbook not found for project.']}
    #
    # and infra.aap_configuration censors that message with no_log, so the run
    # dies showing only a bare `fatal:` and `censored:`. That aborted a routine
    # demo build at stage 2 of 5 on an environment where nobody had changed
    # anything -- the project was simply stale.
    #
    # ONLY WHEN THE PROJECT ALREADY EXISTS. On a fresh environment it does not,
    # and dispatch creates it below -- which syncs it at current HEAD as part of
    # creation, so there is nothing stale to fix. Updating a project that does
    # not exist yet would just fail.
    #
    # THIS DOES NOT TOUCH scm_update_on_launch, which stays false on purpose
    # (see controller_projects.yml): a demo should run the revision that was
    # tested, not whatever landed on main five minutes ago. Syncing at
    # CONFIGURATION time is a different moment from syncing at LAUNCH time, and
    # only the second one would make a demo unpredictable.
    #
    # ansible.controller rather than ansible.platform, and that is not drift:
    # projects are a controller concept and ansible.platform ships no
    # equivalent module.
    - name: Look up the project, if this environment already has one
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/projects/?name={{ sales_demos_project | urlencode }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs | default(false) | bool }}"
        return_content: true
      register: config_project_lookup
      no_log: true
      when: sync_project | default(true) | bool

    - name: Sync the project so job templates validate against current content
      # Blocking on purpose. An async update leaves exactly the race this
      # exists to close, only narrower.
      #
      # IT REPORTS `ok`, NOT `changed`, AND STILL DID THE WORK. A project
      # update is an action rather than a configuration change, so the module
      # returns changed=false even though it launched one -- measured on demo,
      # it returned the update's own id and blocked 2.4s waiting for it.
      # Do not read the `ok` as a no-op and "fix" it.
      ansible.controller.project_update:
        name: "{{ sales_demos_project }}"
        organization: "{{ sales_demos_organization }}"
        wait: true
        timeout: "{{ sync_project_timeout | default(600) | int }}"
        controller_host: "https://{{ aap_hostname }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        validate_certs: "{{ aap_validate_certs | default(false) | bool }}"
      when:
        - sync_project | default(true) | bool
        - config_project_lookup.json.count | default(0) | int > 0

    - name: Apply all objects via the dispatch role
      # Basic auth on purpose. dispatch supports it directly, so no OAuth token
      # is minted — which means there is nothing to leak and nothing to clean
      # up in an `always:` block.
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch

    - name: Summarize what was applied
      ansible.builtin.debug:
        msg:
          - "Applied to {{ aap_env_name }}."
          - "Organization:  {{ aap_organizations_all | map(attribute='name') | join(', ') }}"
          - "Sign-in banner and environment-badged logo set on the gateway."
          - "Automation Analytics settings applied."
          - "The sign-in logo shows on the LOGIN page only — log out to see it."
