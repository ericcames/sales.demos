---
# ===========================================================================
# windows_configure — turn a bare Windows guest into the demo web server.
#
# THIS IS WHAT MAKES web_url STOP RETURNING 503. terraform/ocpvirt now wires a
# Service and a Route to port 80 for the Windows VM too (#340 part 1), and
# until something serves there the Route correctly reports 503. IIS plus the
# firewall rule below is the other half of that story.
#
# PORTED FROM dc1.azure/playbooks/roles/website_setup_azure, NOT from
# aap.dailydemo.windows/roles/website_setup. The Azure fork defaults every
# variable its page uses, so it runs standalone; the original needs ten
# undefined AWS-shaped facts (my_ami_id, my_availability_zone, ...) supplied by
# an upstream EC2 workflow node that does not exist here.
#
# WHAT THE PORT CHANGED, beyond restyling the page to match linux_configure:
#
#   * The firewall rule is new. The Azure source had no equivalent because a
#     cloud NSG did that job outside the guest; here the guest's own CIS-
#     hardened firewall is what blocks port 80. See defaults/main.yml.
#   * `win_wait_for` on 5986 is gone. It waited on the port it was already
#     connected over, from the guest, which cannot fail in a way that matters.
#     patch_windows_vm.yml's wait_for_connection is the real gate.
#   * The bundled images are gone — a personal QR code and a PNG logo. The
#     logos here are the official SVG marks, and there are two of them, not
#     three: see files/logos/SOURCE.md.
#   * `ansible_python_interpreter` is gone from vars/. Setting a POSIX
#     interpreter path on a WinRM host is meaningless at best.
#
# REQUIRES A REACHABLE GUEST AND NOTHING ELSE. Unlike the Linux chain there is
# no registration step to depend on — the golden image ships complete, with
# every feature source it needs on disk. Node 2 is Patch rather than Register,
# and this role does not require it to have run.
# ===========================================================================

- name: Install the IIS web server
  # Web-Server alone, not the management tools: the demo page is templated in
  # by Ansible, so nothing needs the IIS console. include_management_tools
  # defaults to false, which is the behavior wanted here — stated rather than
  # relied on would be noise, but it is worth knowing it is deliberate.
  ansible.windows.win_feature:
    name: Web-Server
    state: present
  register: windows_configure_iis

- name: Reboot if installing IIS asked for one
  # win_feature reports reboot_required rather than acting on it. Unlike
  # windows_patching_reboot this is NOT optional: an IIS install that wants a
  # reboot has not finished, and templating a page into a docroot that is not
  # being served yet is a silent failure.
  ansible.windows.win_reboot:
    post_reboot_delay: 30
  when: windows_configure_iis.reboot_required | default(false)

- name: Open the Windows firewall for HTTP
  # THE COUNTERPART OF linux_configure'S firewalld TASK. Without it IIS serves
  # perfectly and the Route still returns 503, because the golden image is CIS
  # hardened and the guest's NIC sits on the Public profile. defaults/main.yml
  # carries the full reasoning, including why a local rule is effective here at
  # all.
  #
  # win_powershell rather than community.windows.win_firewall_rule:
  # community.windows is in neither the EE base nor the published image, and
  # adding it would force an EE rebuild for one rule (collections/requirements.yml).
  #
  # IDEMPOTENT BY CONSTRUCTION, not by hope: it looks the rule up first, sets
  # $Ansible.Changed itself, and re-enables a rule someone disabled rather than
  # reporting ok because a rule by that name exists.
  ansible.windows.win_powershell:
    parameters:
      RuleName: "{{ windows_configure_firewall_rule_name }}"
    script: |
      param([String]$RuleName)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false

      $rule = Get-NetFirewallRule -DisplayName $RuleName -ErrorAction SilentlyContinue
      if ($null -eq $rule) {
          New-NetFirewallRule -DisplayName $RuleName -Direction Inbound `
              -Action Allow -Protocol TCP -LocalPort 80 `
              -Profile Any -Enabled True | Out-Null
          $Ansible.Changed = $true
          $Ansible.Result = 'created'
      }
      elseif ($rule.Enabled -ne 'True') {
          Enable-NetFirewallRule -DisplayName $RuleName
          $Ansible.Changed = $true
          $Ansible.Result = 're-enabled'
      }
      else {
          $Ansible.Result = 'already present and enabled'
      }
  when: windows_configure_firewall | bool

# ===========================================================================
# PUBLISH EVERYTHING IN ONE ROUND TRIP (#361).
#
# WHY THIS IS NOT FOUR TASKS. It was, mirroring linux_configure task for task,
# and that turned out to be the wrong instinct: over WinRM the round trip IS the
# cost. Measured on sandbox, job 436, per task --
#
#   Publish the demo page      57s   writes one ~5 KB HTML file
#   Publish the product logos  48s   copies two SVGs
#   Publish facts.json         58s   writes one ~1 KB JSON file
#
# 2m 43s to write about 6 KB. None of that is work; it is a connection, a
# PowerShell process, a module payload and a result, three times over. Over SSH
# with pipelining the same three tasks are milliseconds, which is why the Linux
# role is shaped the way it is and why copying that shape here was a mistake.
#
# So the rendering happens on the CONTROLLER, into a staging directory, and one
# win_copy ships the lot. Readability cost: you have to look in two places to
# see what lands on the guest. Time saved: about two and a half minutes of a
# demo someone is watching.
# ===========================================================================
- name: Publish the demo page, logos and facts in one operation
  block:
    - name: Make a staging directory on the controller
      ansible.builtin.tempfile:
        state: directory
        suffix: windows-configure
      register: windows_configure_stage
      delegate_to: localhost
      changed_when: false

    - name: Render the templated files into it
      # `template`, not `win_template` -- these are written on the controller.
      # They stay templates rather than hand-built strings so index.html.j2 and
      # facts.json.j2 keep reading gathered facts and the role's vars exactly as
      # before; only where they are rendered has changed, not how.
      #
      # THIS CHANGES THE LINE ENDINGS, AND THAT IS DELIBERATE. win_template
      # defaults to `newline_sequence: "\r\n"`; ansible.builtin.template
      # defaults to "\n". So these two files land LF-terminated now where they
      # used to be CRLF.
      #
      # Kept rather than forced back, for three reasons: a browser and `jq` do
      # not care, modern Notepad has handled LF since 2018, and facts.json is
      # supposed to be comparable with the Linux guest's copy -- which is LF.
      # Set newline_sequence: "\r\n" here if a consumer ever turns up that
      # does care.
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ windows_configure_stage.path }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: index.html.j2, dest: index.html}
        - {src: facts.json.j2, dest: facts.json}
      loop_control:
        label: "{{ item.dest }}"
      delegate_to: localhost
      changed_when: false

    - name: Stage the product logos alongside them
      # SERVED FROM THIS HOST, not fetched from redhat.com at render time. The
      # page is displayed from a cluster whose egress you do not control, in
      # front of a customer; a hotlinked logo is a blank box waiting to happen.
      #
      # SOURCE.md travels with them deliberately. It is the trademark
      # attribution for files being served over HTTP, and leaving the
      # attribution behind on the controller would be the wrong half to keep.
      ansible.builtin.copy:
        src: logos/
        dest: "{{ windows_configure_stage.path }}/logos/"
        mode: "0644"
      delegate_to: localhost
      changed_when: false

    - name: Copy the whole docroot to the guest
      # THE ONE ROUND TRIP. Trailing slash on src copies the directory's
      # CONTENTS into dest, which is what puts index.html at the docroot rather
      # than in a subdirectory.
      ansible.windows.win_copy:
        src: "{{ windows_configure_stage.path }}/"
        dest: "{{ windows_configure_docroot }}\\"

  always:
    - name: Remove the staging directory
      # In `always` so a failure mid-render does not leave a temp directory
      # behind on the controller -- which, on an AAP execution node, is a
      # container that goes away anyway, and on a laptop is not.
      ansible.builtin.file:
        path: "{{ windows_configure_stage.path }}"
        state: absent
      when: windows_configure_stage.path is defined
      delegate_to: localhost
      changed_when: false

- name: Show the legal notice before authentication
  # THE WINDOWS ANALOGUE OF /etc/issue, and the wording is the same wording —
  # templates/legal_notice.j2 here and linux_configure's templates/issue.j2 are
  # the same notice with the same owner, differing only in that this one has no
  # ASCII box, because Windows renders it in a dialog rather than a terminal.
  #
  # Neither source repo had a Windows equivalent; this is new.
  #
  # TWO VALUES, AND BOTH ARE REQUIRED. Windows shows the dialog only when
  # legalnoticecaption is non-empty — setting the text alone produces nothing
  # at all, silently.
  #
  # SAFE, UNLIKE THE LINUX HALF. The Linux banner touches sshd, which is how
  # AAP reaches the guest, so that task validates and reloads carefully. This
  # one is read by the interactive logon UI only: WinRM never renders it, so
  # this cannot lock AAP out of the guest.
  when: windows_configure_legal_notice | bool
  block:
    - name: Render the legal notice text
      ansible.builtin.set_fact:
        windows_configure_legal_text: "{{ lookup('ansible.builtin.template', 'legal_notice.j2') | trim }}"

    - name: Write the legal notice
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: string
      loop:
        - name: legalnoticecaption
          data: "{{ windows_configure_legal_caption }}"
        - name: legalnoticetext
          data: "{{ windows_configure_legal_text }}"
      loop_control:
        label: "{{ item.name }}"

- name: Create the demo local account
  # OFF BY DEFAULT. See defaults/main.yml for why this neither joins
  # Administrators nor relaxes password complexity, both of which the source
  # role in aap.dailydemo.windows did.
  when: windows_configure_create_demo_user | bool
  block:
    - name: Require a compliant password before creating an account
      # BEFORE win_user, not after: a password that fails the guest's policy
      # makes win_user fail with a Windows API error that reads like a
      # permissions problem. 14 is CIS rule 1.1.4's minimum, which the golden
      # image enforces.
      ansible.builtin.assert:
        that:
          - windows_configure_demo_user_password | default('', true) | length >= 14
        fail_msg: >-
          windows_configure_create_demo_user is true but
          windows_configure_demo_user_password is unset or shorter than 14
          characters. The golden image is CIS L1 hardened and rule 1.1.4 sets
          the minimum password length to 14, so a shorter password is rejected
          by the guest. Set it from the vault or the job template survey.
        quiet: true

    - name: Create the account
      # no_log ON THE TASK THAT CARRIES THE PASSWORD. The source role had this
      # exactly inverted -- `no_log: true` on the harmless directory loop above
      # and `no_log: false` on the password-bearing one below it, which printed
      # every account password into the job output.
      ansible.windows.win_user:
        name: "{{ windows_configure_demo_user }}"
        password: "{{ windows_configure_demo_user_password }}"
        description: "{{ windows_configure_demo_user_description }}"
        groups: "{{ windows_configure_demo_user_groups }}"
        groups_action: replace
        state: present
        update_password: on_create
        password_never_expires: true
      no_log: true

- name: Report where the demo page is
  # THE URL IS THE POINT OF THIS ROLE, so it is printed rather than described —
  # the same call linux_configure makes (#49). web_url arrives as a host
  # variable from playbooks/tasks/register_hosts.yml.
  ansible.builtin.debug:
    msg:
      - "{{ inventory_hostname }} is serving on port 80 via IIS."
      - >-
        {{ 'Firewall:  inbound TCP 80 allowed (' ~ windows_configure_firewall_rule_name ~ ').'
           if (windows_configure_firewall | bool)
           else 'Firewall:  NOT touched -- windows_configure_firewall is false. The Route stays 503 if the Public profile blocks 80.' }}
      - >-
        {{ 'Open it:   ' ~ windows_configure_web_url
           if (windows_configure_web_url | length > 0)
           else 'Open it:   run `terraform output -raw web_url`; re-provision to have it printed here.' }}
      - >-
        {{ 'Compliance: ' ~ windows_configure_compliance_url ~ ' (published by the next node, Windows Day 1 - 4 Compliance Scan).'
           if (windows_configure_compliance_url | length > 0)
           else 'Compliance: <web_url>/compliance/report.html once the compliance node has run.' }}
