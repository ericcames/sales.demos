---
# ===========================================================================
# windows_compliance — defaults.
#
# IT VERIFIES; IT DOES NOT SCAN, and the difference is the whole design.
# OpenSCAP has no Windows agent, so there is no Windows equivalent of
# roles/linux_compliance's `oscap xccdf eval`. What exists instead is a
# contract with the producer, cited by path the way quay_windows_image is cited
# by value:
#
#     image.builder.pipeline/playbooks/vars/cis_profile.yml
#
# That file applies the vendored ansible-lockdown/Windows-2022-CIS role — 444
# rule toggles — and records exactly which controls it leaves unapplied and
# why. This role reads a curated subset of the controls that file ENABLES back
# off the running guest, and reports the ones it does not enable as documented
# exceptions rather than as failures.
#
# THE JOB TEMPLATE IS NAMED "Compliance Scan" TO MATCH ITS LINUX SIBLING. The
# report this publishes says "verification" in its own title, so nobody reading
# the artifact is misled about what produced it.
# ===========================================================================

# Where the report and summary are published. Under the IIS docroot so the
# presenter can click through from the demo page — the same relationship
# linux_compliance has with /var/www/html.
windows_compliance_report_dir: 'C:\inetpub\wwwroot\compliance'

# Named in the report and in summary.json, so the artifact says which profile
# it is claiming to verify against rather than leaving it to be inferred.
# MEMBER SERVER, not Server: the producer sets win22cis_l1_ms_gpo: true.
windows_compliance_profile: "CIS Microsoft Windows Server 2022 Benchmark, Level 1 - Member Server"

# The producer's profile file, cited so the report can point at the contract.
windows_compliance_profile_source: "image.builder.pipeline/playbooks/vars/cis_profile.yml"
windows_compliance_pipeline_url: "https://github.com/ericcames/image.builder.pipeline"

# Fail the job when a control the producer DOES enable is found non-compliant.
# Off by default, matching linux_compliance, which treats `oscap` exit code 2
# as expected: the report is the deliverable and a red workflow node in front
# of a customer teaches nothing. Turn it on when the scan is a gate.
windows_compliance_fail_on_noncompliant: false

# ===========================================================================
# THE CHECKS.
#
# Each entry is one CIS control, cited by its rule number, that
# cis_profile.yml leaves at its default of true and therefore applied to this
# image. `title` is the benchmark's own wording, trimmed.
#
# `kind: registry` reads one value; `kind: policy` reads one key from
# `secedit /export`'s System Access section. Both are reads — nothing in this
# role writes to the guest, so it is safe to re-run mid-demo.
#
# `op` is one of eq, gte, lte, between, and encodes the benchmark's own
# tolerance. "24 or more passwords" is gte 24, not eq 24: a guest hardened
# harder than the benchmark asks is compliant, and a check written as eq would
# call that a failure.
# ===========================================================================
windows_compliance_checks:
  # --- 1.1 Password policy --------------------------------------------------
  - rule: "1.1.1"
    title: "Enforce password history is set to 24 or more passwords"
    kind: policy
    name: PasswordHistorySize
    op: gte
    expected: 24
  - rule: "1.1.2"
    title: "Maximum password age is set to 365 or fewer days, but not 0"
    kind: policy
    name: MaximumPasswordAge
    op: between
    min: 1
    max: 365
  - rule: "1.1.3"
    title: "Minimum password age is set to 1 or more days"
    kind: policy
    name: MinimumPasswordAge
    op: gte
    expected: 1
  - rule: "1.1.4"
    title: "Minimum password length is set to 14 or more characters"
    kind: policy
    name: MinimumPasswordLength
    op: gte
    expected: 14
  # THE ONE roles/windows_configure WOULD HAVE BROKEN. The account role ported
  # from aap.dailydemo.windows set PasswordComplexity to 0 machine-wide and
  # never restored it, so this control would fail on the very next node of the
  # same workflow. That is why the port creates accounts with a compliant
  # password instead.
  - rule: "1.1.5"
    title: "Password must meet complexity requirements is set to Enabled"
    kind: policy
    name: PasswordComplexity
    op: eq
    expected: 1
  - rule: "1.1.7"
    title: "Store passwords using reversible encryption is set to Disabled"
    kind: policy
    name: ClearTextPassword
    op: eq
    expected: 0

  # --- 1.2 Account lockout policy ------------------------------------------
  # The producer sets hosted_virtual_system_override: false specifically so
  # these are written in the non-cloud order; cis_profile.yml records that a
  # KubeVirt guest otherwise trips the role's cloud auto-detection and secedit
  # rejects LockoutDuration before ResetLockoutCount. So these three are worth
  # checking: they are the ones that silently would not have applied.
  - rule: "1.2.1"
    title: "Account lockout duration is set to 15 or more minutes"
    kind: policy
    name: LockoutDuration
    op: gte
    expected: 15
  - rule: "1.2.2"
    title: "Account lockout threshold is set to 5 or fewer invalid attempts, but not 0"
    kind: policy
    name: LockoutBadCount
    op: between
    min: 1
    max: 5
  - rule: "1.2.4"
    title: "Reset account lockout counter after is set to 15 or more minutes"
    kind: policy
    name: ResetLockoutCount
    op: gte
    expected: 15

  # --- 2.3 Security options -------------------------------------------------
  - rule: "2.3.2.1"
    title: "Audit: Force audit policy subcategory settings to override category settings"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    name: SCENoApplyLegacyAuditPolicy
    op: eq
    expected: 1
  - rule: "2.3.6.1"
    title: "Domain member: Digitally encrypt or sign secure channel data (always)"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    name: RequireSignOrSeal
    op: eq
    expected: 1
  - rule: "2.3.6.6"
    title: "Domain member: Require strong (Windows 2000 or later) session key is set to Enabled"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    name: RequireStrongKey
    op: eq
    expected: 1
  - rule: "2.3.7.1"
    title: "Interactive logon: Do not require CTRL+ALT+DEL is set to Disabled"
    kind: registry
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: DisableCAD
    op: eq
    expected: 0
  - rule: "2.3.7.2"
    title: "Interactive logon: Do not display last signed-in is set to Enabled"
    kind: registry
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: DontDisplayLastUserName
    op: eq
    expected: 1
  - rule: "2.3.8.1"
    title: "Microsoft network client: Digitally sign communications (always)"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    name: RequireSecuritySignature
    op: eq
    expected: 1
  - rule: "2.3.9.2"
    title: "Microsoft network server: Digitally sign communications (always)"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Lanmanserver\Parameters'
    name: RequireSecuritySignature
    op: eq
    expected: 1
  - rule: "2.3.10.2"
    title: "Network access: Do not allow anonymous enumeration of SAM accounts"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    name: RestrictAnonymousSAM
    op: eq
    expected: 1
  - rule: "2.3.11.5"
    title: "Network security: Do not store LAN Manager hash value on next password change"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    name: NoLMHash
    op: eq
    expected: 1
  - rule: "2.3.15.1"
    title: "System objects: Require case insensitivity for non-Windows subsystems"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel'
    name: ObCaseInsensitive
    op: eq
    expected: 1
  - rule: "2.3.15.2"
    title: "System objects: Strengthen default permissions of internal system objects"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    name: ProtectionMode
    op: eq
    expected: 1

  # --- 9 Windows Defender Firewall -----------------------------------------
  # THE THREE THE DEMO ITSELF LEANS ON. roles/windows_configure has to add an
  # inbound rule for port 80 precisely because 9.3.1 and 9.3.2 are applied and
  # a KubeVirt NIC lands on the Public profile. An explicit allow rule does not
  # violate 9.3.2, which governs the DEFAULT action, so these should still pass
  # on a fully configured guest — and if they do not, the demo page is being
  # served by a firewall that was turned off, which is worth catching.
  - rule: "9.1.1"
    title: "Windows Firewall: Domain: Firewall state is set to On"
    kind: registry
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
    name: EnableFirewall
    op: eq
    expected: 1
  - rule: "9.2.1"
    title: "Windows Firewall: Private: Firewall state is set to On"
    kind: registry
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile'
    name: EnableFirewall
    op: eq
    expected: 1
  - rule: "9.3.1"
    title: "Windows Firewall: Public: Firewall state is set to On"
    kind: registry
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile'
    name: EnableFirewall
    op: eq
    expected: 1
  - rule: "9.3.2"
    title: "Windows Firewall: Public: Inbound connections is set to Block (default)"
    kind: registry
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile'
    name: DefaultInboundAction
    op: eq
    expected: 1

  # --- 18 Administrative templates -----------------------------------------
  - rule: "18.4.2"
    title: "Configure SMB v1 client driver is set to Enabled: Disable driver"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10'
    name: Start
    op: eq
    expected: 4
  - rule: "18.4.3"
    title: "Configure SMB v1 server is set to Disabled"
    kind: registry
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    name: SMB1
    op: eq
    expected: 0
  - rule: "18.9.4.1"
    title: "Encryption Oracle Remediation is set to Enabled: Force Updated Clients"
    kind: registry
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    name: AllowEncryptionOracle
    op: eq
    expected: 0
  - rule: "18.9.20.1.1"
    title: "Turn off downloading of print drivers over HTTP is set to Enabled"
    kind: registry
    # \Windows NT\Printers, not \Windows (#382). The CIS role writes this to
    # HKLM:\SOFTWARE\Policies\Microsoft\Windows Nt\Printers; the old path
    # omitted both `Nt` and `\Printers`, so the value could not be found on any
    # machine and the report showed a hardened guest as 26/27 instead of 27/27
    # (now 28 controls after adding 2.3.6.6 in #241).
    #
    # THIS WAS THE THIRD COPY of one bug -- the same wrong path shipped in
    # utilities/inspect-golden-image.py (#370) and image.builder.pipeline's
    # verify_cis_disk.py (ibp#93). It survived the first two fixes because a
    # control that reads "absent" on UNHARDENED media proves nothing about
    # whether its path is right, and every report before #358 closed was taken
    # from an unhardened guest. When a control definition is wrong here, grep the
    # value name across every reader before closing.
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    name: DisableWebPnPDownload
    op: eq
    expected: 1

# ===========================================================================
# THE DOCUMENTED EXCEPTIONS.
#
# Controls the benchmark defines that this image deliberately does not apply.
# They are NOT failures and are not counted as any: a failure is a control that
# was supposed to be applied and is not.
#
# THE ISSUE SAID FOUR. IT IS SIXTEEN, and the difference is not pedantry.
# cis_profile.yml sets four `win22cis_rule_*: false` — but it ALSO sets
# `win_skip_for_test: true`, and the vendored role's defaults/main.yml
# documents that flag as skipping eleven further controls "even if they are set
# to true". Those eleven are left at true in cis_profile.yml, so reading only
# the explicit falses says they were applied. They were not. A check for
# 18.10.89.2.1 would have reported a red failure for something the producer
# deliberately skipped — in front of a customer, on a page the demo invites
# them to open.
#
# The sixteenth is ours, not the producer's: terraform/ocpvirt/main.tf sets
# LocalAccountTokenFilterPolicy back to 1 in the unattend so AAP can reach the
# guest at all. That one is the most interesting line in this file — it is the
# demo's own accepted risk, made by this repo, visible in this report.
#
# `source` says who owns each decision, so a customer asking "who decided
# that?" gets an answer rather than a shrug.
# ===========================================================================
windows_compliance_exceptions:
  # --- Producer, explicit: four `win22cis_rule_*: false` --------------------
  - rule: "2.3.17.1"
    title: "User Account Control: Admin Approval Mode for the Built-in Administrator account"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win22cis_rule_2_3_17_1: false)"
    reason: >-
      Enabling Admin Approval Mode breaks NTLM authentication mid-session
      during the image build: "ntlm: the specified credentials were rejected
      by the server". The build cannot reach sysprep with it on.
  - rule: "2.3.17.2"
    title: "User Account Control: Behavior of the elevation prompt for administrators"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win22cis_rule_2_3_17_2: false)"
    reason: >-
      The elevation prompt change combines with 2.3.17.1 to break the same
      NTLM session. Disabled with it, for the same reason.
  - rule: "18.9.19.4"
    title: "Configure security policy processing: Do not apply during periodic background processing"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win22cis_rule_18_9_19_4: false)"
    reason: >-
      Background security policy refresh immediately reprocesses every setting
      applied earlier in the run, including the NTLM and lockout changes, and
      kills the WinRM session: "Remote end closed connection without
      response". Safe on a deployed VM, fatal during a build.
  - rule: "18.9.19.5"
    title: "Configure security policy processing: Process even if the GPOs have not changed"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win22cis_rule_18_9_19_5: false)"
    reason: >-
      Forces the same reprocessing as 18.9.19.4 even when nothing changed.
      Same effect on the build, disabled for the same reason.

  # --- Producer, implicit: eleven skipped by win_skip_for_test --------------
  # Left at `true` in cis_profile.yml and skipped anyway. The list is the
  # vendored role's own, from its defaults/main.yml.
  - rule: "2.2.26"
    title: "Deny log on through Remote Desktop Services to include Guests (Domain Controller)"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: >-
      Breaks the local administrator connection the build runs over. Not
      applicable to this guest in any case — it is a member server, not a
      domain controller.
  - rule: "2.2.27"
    title: "Deny log on through Remote Desktop Services is set to Guests, Local account (Member Server)"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: >-
      Denies RDP to local accounts, which is every account on a non-domain
      demo guest. Applying it would leave the VM with no interactive login at
      all — and RDP to it is part of the demo.
  - rule: "2.3.1.3"
    title: "Configure Accounts: Rename administrator account"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: >-
      Renames the built-in Administrator mid-build, breaking the connection
      the build is running over. The demo guest's admin account is named by
      the sysprep unattend instead.
  - rule: "9.3.4"
    title: "Windows Firewall: Public: Settings: Apply local firewall rules is set to No"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: >-
      Would make locally created firewall rules inert. THIS DEMO DEPENDS ON IT
      BEING SKIPPED: both the WinRM listener rule in the sysprep unattend and
      the port 80 rule in roles/windows_configure are local rules on the
      Public profile.
  - rule: "18.10.89.1.1"
    title: "WinRM Client: Allow Basic authentication is set to Disabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: "One of six WinRM controls that would sever the channel AAP manages this guest over."
  - rule: "18.10.89.1.2"
    title: "WinRM Client: Allow unencrypted traffic is set to Disabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: "As 18.10.89.1.1. The channel in use is HTTPS on 5986 regardless."
  - rule: "18.10.89.1.3"
    title: "WinRM Client: Disallow Digest authentication is set to Enabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: "As 18.10.89.1.1."
  - rule: "18.10.89.2.1"
    title: "WinRM Service: Allow Basic authentication is set to Disabled"
    source: >-
      image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true),
      AND actively re-enabled by sales.demos terraform/ocpvirt/main.tf
    reason: >-
      Skipped by the producer, then explicitly turned ON by this repo's sysprep
      unattend (`Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true`)
      while bringing up the WinRM listener. The only exception in this list
      that two separate decisions land on.
  - rule: "18.10.89.2.2"
    title: "WinRM Service: Allow remote server management through WinRM is set to Disabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: >-
      Disabling remote management through WinRM would end every job template
      in this chain. The vendored role's own comment says this control has to
      stay enabled for continued management by Ansible.
  - rule: "18.10.89.2.3"
    title: "WinRM Service: Allow unencrypted traffic is set to Disabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: "As 18.10.89.2.2. The listener in use is HTTPS on 5986."
  - rule: "18.10.90.1"
    title: "Windows Remote Shell: Allow Remote Shell Access is set to Disabled"
    source: "image.builder.pipeline/playbooks/vars/cis_profile.yml (win_skip_for_test: true)"
    reason: "Ends WinRM shell access, which is how every task in this role reached the guest."

  # --- Consumer: ours, made at provisioning time ---------------------------
  - rule: "18.4.1"
    title: "Apply UAC restrictions to local accounts on network logons is set to Enabled"
    source: "sales.demos terraform/ocpvirt/main.tf (sysprep unattend, FirstLogonCommands order 2)"
    reason: >-
      The producer APPLIES this control; this repo then sets
      LocalAccountTokenFilterPolicy back to 1 at first boot. Without it, UAC
      remote-access restrictions strip the administrative token from any local
      admin other than the built-in Administrator (RID 500), and NTLM fails
      with "the specified credentials were rejected by the server" — for the
      demoadmin account every job template in this chain authenticates as.
      This is the demo platform's own accepted risk, not the golden image's.
