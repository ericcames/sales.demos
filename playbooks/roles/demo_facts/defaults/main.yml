---
# ===========================================================================
# demo_facts — gather, curate, cache and publish the guest's Ansible facts.
# Issue #647.
# ===========================================================================
# ONE ROLE FOR BOTH OPERATING SYSTEMS, against this repo's per-OS precedent
# (linux_configure / windows_configure). Those two differ in substance — httpd
# against IIS, firewalld against the Windows firewall — and splitting them was
# right. A fact report does not differ in substance: windows_configure's
# facts.json.j2 already insists both guests emit the same keys in the same order
# "so one parser reads both and the two can be diffed". Two roles here would be
# two copies of one schema, which is how #160 happened.
#
# Dispatching on `ansible_os_family` is safe BECAUSE this role runs after fact
# gathering. dc1.azure's webserver_manage dispatches on group membership instead,
# and that is not an inconsistency — it runs with `gather_facts: false`, so it
# has no facts to dispatch on.
# ===========================================================================

# Also print the entire ansible_facts dict to the job log. Off by default: on
# Windows it is roughly a megabyte and unreadable on screen, and the full set is
# stored in AAP's database either way, which is the point the demo is making.
demo_facts_show_full: false

# Compare against the previously cached facts and report what changed.
# Implemented in #648; referenced here so the survey variable name exists from
# the start and the two job templates do not need renaming later. The variable
# names ARE the contract.
demo_facts_compare: false

# WHICH FIELDS THE DRIFT REPORT COMPARES (#648), and the omissions are the
# design. `gathered` and `uptime.seconds` change on EVERY run by definition --
# reporting them would mean the report always says "drift" and the viewer learns
# to ignore it. `uptime.last_boot` is deliberately IN: a reboot is exactly the
# kind of change worth seeing, and unlike uptime.seconds it only moves when
# something actually happened.
#
# EACH FIELD CARRIES ITS SEVERITY (#658), decided here and never by anything
# downstream. It is the same kind of judgement as which fields to compare, so it
# lives in the same place, with its reason beside it:
#
#   investigate  nothing this repo runs should change it; ask who did
#   notable      a deliberate act changes it -- worth seeing, not alarming
#   expected     routine Day 2 work (patching, reboots) changes it
#
# WHY THIS IS NOT LEFT TO A MODEL: #657 gave two Granite sizes the same drift
# and the same explicit labelling rules. The 3B model silently dropped a row;
# the 8B model called an unrequested doubling of RAM EXPECTED and invented a
# reason. A rule that holds four times in five is not a control. Any narration
# layered on later explains these labels; it does not set them.
#
# A BARE STRING IS STILL ACCEPTED and reads as `notable`, so an override written
# against the #648 shape (a list of paths) keeps working. An unknown severity
# fails the comparison rather than being guessed at.
#
# `tolerance_pct` IS OPTIONAL, for a number that moves when nothing real did
# (#663). Within it, the field does not count as changed. The report still
# shows the exact values; only the drift claim is loosened.
demo_facts_compare_fields:
  # A guest renaming itself is not something any job here does.
  - {path: hostname, severity: investigate}
  # Teardown deregisters the host, so a rebuild starts with no prior facts --
  # a different OS or architecture under the SAME host record is a replacement
  # nobody recorded.
  - {path: os.distribution, severity: investigate}
  # Patching moves these. That is the Day 2 story working, not drift.
  - {path: os.version, severity: expected}
  - {path: os.kernel, severity: expected}
  - {path: os.architecture, severity: investigate}
  # Capacity nobody asked for. This is the row #657's 8B model downgraded.
  - {path: resources.vcpus, severity: investigate}
  # memory_mb IS MemTotal: RAM minus what the kernel reserves, and a new kernel
  # reserves a different amount. Measured in #663: a reboot into a patched
  # kernel moved it 15706 -> 15708 on an untouched 16 GiB guest, and every
  # patch cycle raised an INVESTIGATE row -- the noise that teaches a viewer
  # to skip the label that matters. 10% because the tiers are 4/8/16 GiB, so
  # the smallest real resize is +/-50%; even a 192 MiB crashkernel reservation
  # appearing on the 4 GiB tier is under 5%.
  - {path: resources.memory_mb, severity: investigate, tolerance_pct: 10}
  # The guest's view of what it runs on; no job here moves it.
  - {path: virtualization.type, severity: investigate}
  - {path: virtualization.role, severity: investigate}
  # Where the guest talks and who it asks for names -- the classic unexplained
  # change, and the one #657's 3B model called merely notable.
  - {path: network.addresses, severity: investigate}
  - {path: network.dns_servers, severity: investigate}
  # network.domain IS DELIBERATELY ABSENT, and it took three runs to earn that.
  # On Linux it comes from ansible_domain, derived from a reverse lookup, and the
  # guest has several Service DNS records pointing at it -- so which one answers
  # varies. Measured across jobs 252/258/259 with NOTHING changed on the guest:
  #   252  web-lnx-1.sales-demos-sandbox.svc.cluster.local
  #   258  web-lnx-1-web.sales-demos-sandbox.svc.cluster.local
  #   259  web-lnx-1-web.sales-demos-sandbox.svc.cluster.local
  # A value that moves while the machine does not is noise, and unlike
  # uptime.last_boot it cannot be rounded into stability.
  #
  # THE COST IS A WINDOWS SIGNAL, and it is worth naming. There the same summary
  # key carries ansible_windows_domain, which IS stable and meaningful -- a
  # guest leaving WORKGROUP for a domain is real drift. One key, two facts, so
  # comparison is all-or-nothing today. If that signal is wanted, split the key
  # per OS rather than re-adding this one; ansible_windows_domain_member is the
  # stable fact to compare.
  #
  # The field still DISPLAYS on the report either way. This only governs what
  # the drift comparison claims changed.
  # SELinux leaving enforcing is a control being switched off.
  - {path: platform.selinux, severity: investigate}
  # Firmware strings move when the cluster's virtualization stack is upgraded:
  # a change to the platform underneath, not to the guest.
  - {path: platform.product, severity: notable}
  - {path: platform.vendor, severity: notable}
  # A reboot. Patching does this on purpose; it is the reason the field is in.
  - {path: uptime.last_boot, severity: expected}
  # Registration metadata. It only changes when someone re-registers the host
  # on purpose -- a resize, a move between environments.
  - {path: provisioning.vm_size_tier, severity: notable}
  - {path: provisioning.instance_type, severity: notable}
  - {path: provisioning.environment, severity: notable}
  # A repoint to a new golden image tag is a deliberate act (#358).
  - {path: golden_image.source, severity: notable}
  # The hardening claim itself. A different level under the same host is a
  # compliance question before it is anything else.
  - {path: golden_image.cis_level, severity: investigate}

# Publish facts.html to the guest's docroot. The curated summary reaches AAP's
# Facts tab regardless of this — that copy is the job template's use_fact_cache,
# not anything this role does.
demo_facts_publish: true

# Set per OS by tasks/main.yml. Named here so the value has one documented home.
demo_facts_docroot: ""

# THE ALLOW-LIST FOR AGENTIC REMEDIATION (#665). Maps drift conditions to
# remediation job templates. The decide step looks up each investigate-severity
# diff row here; a match proposes the named template, a miss proposes nothing.
# The allow-list IS the safety boundary — only templates named here can ever be
# proposed, and the approval node sits between the proposal and the execution.
demo_facts_remediation_map:
  - field: platform.selinux
    expected: enforcing
    template: "Linux Day 2 - Fix SELinux"
    reason: "SELinux is not enforcing"

# OPTIONAL AI NARRATION (#682, #661 Phase 2). When true AND the inference
# endpoint is reachable, the diff is sent to the model for a human-readable
# explanation of WHY the drift matters and what to do next. The model NEVER
# sets severity — that is Ansible's job (#658). On any failure the narration
# is silently skipped and the job stays green.
demo_facts_narrate: false

# Inference endpoint for narration and for decide_remediation.yml (#680).
# Injected by the "Sales Demos - Inference Endpoint" credential type. Empty
# defaults satisfy the secrets-example-sync checker and mean "no endpoint."
inference_url: ""
inference_token: ""

# The EDA webhook endpoint for drift notification. When non-empty, the compare
# step POSTs to it after finding investigate-severity rows. When empty (the
# default), no notification is sent — graceful degradation per #661.
demo_facts_eda_webhook_url: ""

# Provisioning metadata, read from the host variables register_hosts.yml sets.
demo_facts_golden_image_source: "{{ golden_image_source | default('') }}"
demo_facts_golden_image_cis_level: "{{ golden_image_cis_level | default('') }}"
demo_facts_repo_url: "https://github.com/ericcames/sales.demos"
# The producer of the golden image, carried so facts.html and facts.json
# publish the same provenance. Matches {linux,windows}_configure's
# *_golden_image_pipeline_url.
demo_facts_golden_image_pipeline: "https://github.com/ericcames/image.builder.pipeline"
