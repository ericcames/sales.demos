---
# ===========================================================================
# linux_configure — turn a bare RHEL guest into the demo web server.
#
# Ported from dc1.azure/playbooks/roles/linux_configure, trimmed to what this
# demo actually needs. Dropped in the port: the bundled images (a Red Hat logo
# and a personal QR code), which would mean carrying personal assets in a public
# repo. The page below is self-contained — no external images, no CDN, nothing
# to 404.
#
# The MOTD/issue/banner set was dropped with them and came back in #50. The
# reason for dropping it was the personal assets, which is an argument about
# images and not about text: generic ASCII art carries none.
#
# TWO MESSAGES, TWO MOMENTS, AND THEY ARE NOT THE SAME FILE.
#   templates/issue.j2  the legal authorized-use notice, /etc/issue and
#                       /etc/issue.net, shown BEFORE authentication to anyone
#                       who can reach the box. No branding, no URL.
#   templates/motd.j2   the branded art, /etc/motd, AFTER authentication.
#
# The pre-authentication half touches sshd, which is how AAP reaches every one
# of these guests, so it is deliberately careful — a drop-in rather than an edit
# to sshd_config, `sshd -t` validation before the file is installed, and a
# reload rather than a restart. `linux_configure_ssh_banner: false` opts out.
#
# THIS IS WHAT MAKES web_url STOP RETURNING 503. terraform/ocpvirt wires a
# Service and a Route to port 80 (#29), and until something serves there the
# Route correctly reports 503. Installing and starting httpd is the other half
# of that story.
#
# REQUIRES A REGISTERED GUEST. Every dnf task here fails on an unregistered
# CNV rhel9 image, which has no repositories at all — run roles/linux_register
# first, as playbooks/run_demo.yml does.
# ===========================================================================

- name: Install the demo packages
  # One transaction rather than several: dnf resolves and downloads once, which
  # matters on a small VM. install_weak_deps skips recommended-but-unneeded
  # packages. dnf-utils supplies `needs-restarting`, used by the reboot gate.
  ansible.builtin.dnf:
    name:
      - httpd
      - firewalld
      - cockpit
      - chrony
      - dnf-utils
    state: present
    update_cache: true
    install_weak_deps: false

- name: Start and enable the services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - chronyd
    - firewalld
    - httpd
    # Socket-activated, so the console is reachable without a resident daemon.
    - cockpit.socket

- name: Open the firewall for HTTP and Cockpit
  # firewalld runs INSIDE the guest and is separate from anything OpenShift
  # does. The Route reaches the VM over the pod network, so without this the
  # Route still returns 503 with httpd running perfectly — a confusing failure
  # worth avoiding.
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - cockpit

- name: Publish the demo page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    group: apache
    mode: "0644"

- name: Publish the product logos
  # SERVED FROM THIS HOST, not fetched from redhat.com at render time. The page
  # is displayed from a cluster whose egress you do not control, in front of a
  # customer; a hotlinked logo is a blank box waiting to happen. See
  # files/logos/SOURCE.md for where they came from and how to refresh them.
  ansible.builtin.copy:
    src: logos/
    dest: /var/www/html/logos/
    owner: apache
    group: apache
    mode: "0644"
    directory_mode: "0755"

- name: Publish the gathered facts as JSON
  # ON DISK AND REACHABLE, at <web_url>/facts.json — the raw data behind the
  # page, for the part of a demo where someone asks "where is that coming
  # from?". AAP also caches facts in its database (use_fact_cache on the Check
  # VMs template), which is the same information in the controller UI; this is
  # the copy you can curl.
  #
  # CURATED, NOT A DUMP. `ansible_facts` in full is roughly a megabyte
  # including every interface, mount and environment variable — noise on a demo
  # page, and it changes shape between runs. These are the fields the page
  # itself uses, plus the provisioning metadata that proves the chain.
  ansible.builtin.copy:
    dest: /var/www/html/facts.json
    owner: apache
    group: apache
    mode: "0644"
    content: |
      {{
        {
          'hostname': inventory_hostname,
          'gathered': ansible_date_time.iso8601,
          'os': {
            'distribution': ansible_distribution,
            'version': ansible_distribution_version,
            'kernel': ansible_kernel,
          },
          'resources': {
            'vcpus': ansible_processor_vcpus,
            'memory_mb': ansible_memtotal_mb,
          },
          'virtualization': {
            'type': linux_configure_virt_type,
            'role': linux_configure_virt_role,
          },
          'provisioning': {
            'vm_size_tier': vm_size_tier | default(none),
            'instance_type': vm_size_chosen | default(none),
            'in_cluster_address': ansible_host | default(inventory_hostname),
            'repository': linux_configure_repo_url,
          },
          'golden_image': {
            'source': linux_configure_golden_image_source | default(none, true),
            'repo': linux_configure_golden_image_repo | default(none, true),
            'build_date': linux_configure_golden_image_build_date | default(none, true),
            'cis_level': linux_configure_golden_image_cis_level | default(none, true),
            'pipeline': linux_configure_golden_image_pipeline_url,
          },
        } | to_nice_json
      }}

- name: Write the login banner
  # /etc/motd, not /etc/motd.d/. pam_motd on RHEL 9 reads both, but /etc/motd
  # needs no assumption about the guest's PAM stack, and the CNV rhel9 image
  # already ships an empty one.
  #
  # Placed before the patching tasks so the banner lands even when
  # linux_configure_patch is false, and no package is required — the cow is
  # static text in the template, not cowsay.
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
  when: linux_configure_motd | bool

- name: Show the legal notice before authentication
  when: linux_configure_ssh_banner | bool
  block:
    # sshd is how AAP reaches this guest, so nothing here edits sshd_config
    # itself and nothing restarts the daemon. RHEL 9 ships
    # `Include /etc/ssh/sshd_config.d/*.conf` as the first line of sshd_config;
    # if that is ever missing, a drop-in is silently ignored and the banner just
    # never appears — which is why this checks rather than assumes.
    - name: Confirm sshd reads config drop-ins
      ansible.builtin.command: grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
      register: linux_configure_sshd_include
      changed_when: false
      failed_when: false

    - name: Write the pre-authentication notice
      # BOTH files, and they are not interchangeable: /etc/issue is what getty
      # prints on the console, /etc/issue.net is what sshd sends over the
      # network. Writing only one leaves a login path with no notice on it.
      #
      # Not the art — this is the legal warning, shown before anyone has proved
      # who they are, so it carries no branding and no demo URL.
      ansible.builtin.template:
        src: issue.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/issue
        - /etc/issue.net

    - name: Point sshd at it
      # A drop-in, not an edit to sshd_config. `validate` runs `sshd -t` against
      # the candidate file and the task fails without installing it if the
      # daemon would reject it, so the handler below can never be handed a
      # broken config.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-sales-demos-banner.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by sales.demos roles/linux_configure (#50).
          Banner /etc/issue.net
        validate: /usr/sbin/sshd -t -f %s
      when: linux_configure_sshd_include.rc == 0
      notify: Reload sshd

    - name: Warn when the guest cannot take a drop-in
      ansible.builtin.debug:
        msg: >-
          /etc/ssh/sshd_config has no `Include /etc/ssh/sshd_config.d/*.conf`
          line, so a drop-in would be ignored. /etc/issue and /etc/issue.net are
          written, but sshd was NOT pointed at the latter — set `Banner
          /etc/issue.net` by hand, or accept console-only. Nothing was edited in
          sshd_config, and /etc/motd is unaffected.
      when: linux_configure_sshd_include.rc != 0

- name: Apply security updates
  # Security-only and update_only: patch what is installed, never pull new
  # packages, and skip the much larger bugfix set that has little demo value.
  # Reuses the metadata cache warmed above.
  ansible.builtin.dnf:  # noqa: package-latest
    name: "*"
    state: latest
    security: true
    update_only: true
    skip_broken: true
  when: linux_configure_patch | bool

- name: Check whether a reboot is required
  # `needs-restarting -r` returns 0 = no reboot needed, 1 = reboot needed. The
  # Debian-ism of stat-ing /var/run/reboot-required never fires on RHEL, which
  # is a trap dc1.azure hit and fixed.
  ansible.builtin.command: needs-restarting -r
  register: linux_configure_needs_restarting
  changed_when: false
  failed_when: linux_configure_needs_restarting.rc not in [0, 1]
  when: linux_configure_patch | bool

- name: Reboot if the kernel or core libraries were updated
  # OFF BY DEFAULT, unlike dc1.azure. A reboot mid-demo takes the web page away
  # for a minute or two with someone watching, and these VMs are rebuilt daily
  # by the nightly teardown anyway — an unpatched-until-tomorrow kernel is a
  # smaller problem than a blank screen. Set linux_configure_reboot: true when
  # the patching story is the point of the demo.
  ansible.builtin.reboot:
  when:
    - linux_configure_patch | bool
    - linux_configure_reboot | bool
    - linux_configure_needs_restarting.rc | default(0) == 1

- name: Report where the demo page is
  # THE URL IS THE POINT OF THIS ROLE, so it is printed here rather than
  # described (#49). It used to say "comes from the terraform output web_url",
  # which meant the one job that turns the Route from 503 into a live page was
  # also the one job whose log could not tell you where to look.
  #
  # web_url and ssh_command arrive as HOST VARIABLES set by provision_vm.yml.
  # A guest provisioned before #49 does not carry them, hence the fallback.
  ansible.builtin.debug:
    msg:
      - "{{ inventory_hostname }} is serving on port 80."
      - >-
        {{ 'Reboot pending — a kernel or core library was updated (linux_configure_reboot is false).'
           if (linux_configure_patch | bool) and (linux_configure_needs_restarting.rc | default(0) == 1)
              and not (linux_configure_reboot | bool)
           else 'No reboot pending.' }}
      - >-
        {{ 'Open it:  ' ~ web_url if (web_url | default('', true) | length > 0)
           else 'Open it:  run `terraform output -raw web_url`; re-provision to have it printed here.' }}
      - >-
        {{ 'Log in:   ' ~ ssh_command if (ssh_command | default('', true) | length > 0)
           else 'Log in:   run `terraform output -raw ssh_command`; re-provision to have it printed here.' }}
