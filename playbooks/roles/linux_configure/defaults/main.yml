---
# THE HEADLINE on the demo page — the point of the whole thing, not a caption.
# American spelling: this is a US-facing sales demo.
linux_configure_message: >-
  Running on Red Hat Enterprise Linux, virtualized by Red Hat OpenShift
  Virtualization, provisioned by Terraform and configured by Red Hat Ansible
  Automation Platform.

# Shown in the "this VM is temporary" notice. Kept in step BY HAND with the
# schedules in inventory/group_vars/<env>/controller_schedules.yml — sandbox
# tears down at 6 PM and 10 PM, demo at 6 PM, both America/Phoenix. If those
# schedules change, change this too; the page has no way to read them.
linux_configure_teardown_time: "6 PM America/Phoenix"

# Linked in the page footer. The close for a technical audience: everything the
# demo just did is inspectable, in public, as code. Safe to publish — the repo
# holds no customer data, and its only credentials are vault-encrypted.
linux_configure_repo_url: "https://github.com/ericcames/sales.demos"

# Apply security updates. On by default — "patching" is one of the demo stories
# #5 names, and a freshly cloned image always has some.
linux_configure_patch: true

# Reboot when patching updates the kernel or core libraries. OFF by default: a
# reboot mid-demo takes the page away with someone watching, and these VMs are
# rebuilt nightly anyway. Turn it on when patching IS the demo.
linux_configure_reboot: false

# --- MOTD (#50) -------------------------------------------------------------
# Write the ASCII-art banner to /etc/motd, shown AFTER authentication. On by
# default: `virtctl ssh` used to land on a bare prompt with nothing to say the
# host was managed, which is a wasted beat in front of a customer.
linux_configure_motd: true

# Also show the same art BEFORE authentication, via /etc/issue.net and sshd's
# Banner directive. On by default.
#
# THIS ONE TOUCHES SSHD, which is how AAP reaches every one of these guests, so
# it is deliberately careful: a drop-in under /etc/ssh/sshd_config.d/ rather
# than an edit to sshd_config, `sshd -t` validation before the file is accepted,
# and a RELOAD rather than a restart. Set false if you would rather not have
# sshd touched at all.
linux_configure_ssh_banner: true

# The boxed line under the figlet. Padded to the box width by the template, so
# an override cannot knock the right border out of alignment — but keep it
# under 59 characters or it is truncated by the padding, not wrapped.
linux_configure_motd_tagline: "C V E   P A T C H I N G   E N G I N E"

# The "Powered by" block, as data rather than markup so a different demo story
# can swap it with -e without editing the template.
#
# THESE NAME WHAT THIS DEMO ACTUALLY RUNS. The art originally credited
# Lightspeed, Event-Driven Ansible and ServiceNow ITSM; none of those are wired
# up here yet, and a technical audience reads a login banner as a claim. Add
# them back as each one becomes real. Max 62 characters per line.
linux_configure_motd_credits:
  - "OpenShift Virtualization    (host)"
  - "Terraform                   (provision)"
  - "Ansible Automation Platform (configure/patch)"
  - "Red Hat Insights            (detect)"

# Printed under the box when non-empty. BELOW the box on purpose: a Route
# hostname runs to ~84 characters, wider than the box, and would tear the right
# border apart. `web_url` is a host variable set by provision_vm.yml (#49); a
# guest provisioned before that simply gets no URL line.
#
# MOTD ONLY. The pre-auth banner renders the same template with this forced
# empty — /etc/issue.net is shown to anyone who can open port 22, before they
# have proved who they are, and the demo URL does not need to be part of that.
linux_configure_motd_url: "{{ web_url | default('', true) }}"
