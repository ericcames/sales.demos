---
# ===========================================================================
# repair_windows_vm.yml — put an existing Windows demo VM back into demo shape.
# Issue #340.
#
# Launch it from the `Windows Day 1 - Repair` job template, or via the
# `ocpvirt-demo` skill.
#
# THIS IS A WRAPPER, NOT AN IMPLEMENTATION. It imports the same playbooks the
# workflow runs as separate nodes, in the same order, so there is exactly one
# copy of the logic — the shape repair_linux_vm.yml already has:
#
#   1. patch_windows_vm.yml       Wait for WinRM, then apply Security and
#                                 Critical updates. The wait is why this is
#                                 first and why it is safe to run against a VM
#                                 that has only just finished sysprep.
#   2. configure_windows_vm.yml   IIS, the port 80 firewall rule, the demo page
#                                 and its logos, facts.json, and the
#                                 pre-authentication legal notice.
#   3. windows_compliance_scan.yml  Re-verify the CIS L1 controls and republish
#                                 the report at <web_url>/compliance/.
#
# THE COMPLIANCE STEP IS HERE FROM THE START, and that is #300's lesson taken
# rather than re-learned. The Linux repair path did not run its scan at first,
# so a repair rewrote the demo page and left YESTERDAY'S report beside it,
# still being served, now describing a machine that no longer existed in that
# state. The workflow ran the scan and this path skipped it, and the two entry
# points disagreed about what "configured" means. Building the Windows wrapper
# with all three from the outset is cheaper than fixing it twice.
#
# WHEN TO USE WHICH. `Windows Day 1 - 0 Workflow` is the build path:
# provision, patch, configure, verify, check — one button, on a cluster with no
# VM on it. This playbook is for a VM that ALREADY EXISTS — a page tweak, a
# re-run after a failed step, or the recovery half of a break/fix story —
# without going anywhere near terraform.
#
# THIS RUNS FROM AAP, NOT FROM A LAPTOP. It targets `windemo`, a group that
# exists only in AAP's inventory; provision_vm.yml registers the VMs there at
# run time, and this repo's file inventory has no VM hosts. A laptop cannot
# resolve `*.svc.cluster.local` in any case.
#
# THE PAYOFF IS `web_url`. terraform/ocpvirt wires a Service and a Route to
# port 80 for the Windows VM too (#340 part 1), and until IIS serves there the
# Route correctly returns 503. After this runs it serves the demo page.
# ===========================================================================

- name: Repair (1/3) — patch the Windows demo VMs
  ansible.builtin.import_playbook: patch_windows_vm.yml

- name: Repair (2/3) — configure the Windows demo web server
  ansible.builtin.import_playbook: configure_windows_vm.yml

- name: Repair (3/3) — re-verify CIS compliance and republish the report
  ansible.builtin.import_playbook: windows_compliance_scan.yml
