---
# ===========================================================================
# register_hosts.yml — shared AAP inventory/group/host registration.
# Extracted from provision_vm.yml as part of the provider abstraction (#238).
#
# CALLER: provision_vm.yml, after the provider task file has set:
#   linux_inventory — LIST of dicts, each with host, ansible_host, ansible_user,
#                     vm_name, vm_role, vm_index, vm_size_tier, vm_size_chosen,
#                     aap_host_name, web_url, cockpit_url, ssh_command
#                     (empty list when this run is not Linux)
#   win_inventory   — same shape (empty list when this run is not Windows)
#
# LISTS SINCE #389, AND THE ACCESS URLs MOVED INSIDE THEM. They were single
# dicts beside a single `web_url` fact, which worked only because there was one
# VM to point at. A farm has one Route each, so the URL has to travel with the
# host it belongs to — otherwise every member of the farm gets host variables
# describing the first one, and the demo page, the compliance report link and
# check_*.yml would all agree on the wrong machine.
#
# Reads play-level vars: provision_aap_url, provision_aap_user,
# provision_aap_pass, provision_aap_inventory, provision_windows_group,
# provision_linux_group, provision_request_timeout, aap_validate_certs,
# aap_organization_name, aap_env_name, quay_rhel9_image.
#
# ansible.controller, not ansible.platform, and that is not an oversight:
# ansible.platform ships NO host or group module (#116).
# ===========================================================================

- name: Ensure the AAP inventory exists (idempotent guard)
  ansible.controller.inventory:
    controller_host: "{{ provision_aap_url }}"
    controller_username: "{{ provision_aap_user }}"
    controller_password: "{{ provision_aap_pass }}"
    validate_certs: "{{ aap_validate_certs | default(false) }}"
    request_timeout: "{{ provision_request_timeout }}"
    name: "{{ provision_aap_inventory }}"
    organization: "{{ aap_organization_name | default('IT Service Automation') }}"
    description: "Demo VMs provisioned by playbooks/provision_vm.yml"
    state: present

# --- Both groups always exist ------------------------------------
# Created unconditionally so a workflow node with limit: windemo or
# linuxweb always resolves. An empty group is a no-op; a missing group
# fails the job.
- name: Ensure the Windows group exists, with WinRM connection vars
  ansible.controller.group:
    controller_host: "{{ provision_aap_url }}"
    controller_username: "{{ provision_aap_user }}"
    controller_password: "{{ provision_aap_pass }}"
    validate_certs: "{{ aap_validate_certs | default(false) }}"
    request_timeout: "{{ provision_request_timeout }}"
    name: "{{ provision_windows_group }}"
    inventory: "{{ provision_aap_inventory }}"
    state: present
    variables:
      ansible_connection: winrm
      ansible_port: 5986
      ansible_winrm_transport: ntlm
      ansible_winrm_server_cert_validation: ignore

- name: Ensure the Linux group exists, with SSH connection vars
  ansible.controller.group:
    controller_host: "{{ provision_aap_url }}"
    controller_username: "{{ provision_aap_user }}"
    controller_password: "{{ provision_aap_pass }}"
    validate_certs: "{{ aap_validate_certs | default(false) }}"
    request_timeout: "{{ provision_request_timeout }}"
    name: "{{ provision_linux_group }}"
    inventory: "{{ provision_aap_inventory }}"
    state: present
    variables:
      ansible_connection: ssh
      ansible_port: 22

# --- Windows -------------------------------------------------------
# A LOOP RATHER THAN A `when: ... is mapping` BLOCK (#389). An empty list is
# already a no-op, so the "no Windows in this run" case needs no condition of
# its own — which is why the outputs return [] rather than null.
- name: Register the Windows VMs
  block:
    - name: Add each Windows VM as a host
      ansible.controller.host:
        controller_host: "{{ provision_aap_url }}"
        controller_username: "{{ provision_aap_user }}"
        controller_password: "{{ provision_aap_pass }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
        request_timeout: "{{ provision_request_timeout }}"
        name: "{{ item.aap_host_name }}"
        inventory: "{{ provision_aap_inventory }}"
        enabled: true
        state: present
        # THE WINDOWS HOST USED TO CARRY FIVE OF THESE AND THE LINUX HOST
        # TWELVE (#340). The extra four are not decoration -- windows_configure
        # renders web_url and the golden-image provenance onto the demo page,
        # windows_compliance links its report under web_url, and
        # check_windows_vm.yml curls it. Without them the Windows roles would
        # each need their own fallback and the page would disagree with the
        # Linux one about what it knows.
        #
        # web_url is PER VM since #389, read off this entry rather than off a
        # single play fact. Each member of a farm has its own Route, so the
        # host variable has to be the URL of the machine it is attached to.
        #
        # `| default('', true)` on the three URL fields, because Terraform emits
        # null for them when openshift_apps_domain is unset. Consumers already
        # write `web_url | default('', true)`, which copes either way -- this
        # just keeps a literal `null` out of the AAP host-variable UI.
        variables:
          ansible_host: "{{ item.ansible_host }}"
          ansible_user: "{{ item.ansible_user }}"
          vm_name: "{{ item.vm_name }}"
          vm_role: "{{ item.vm_role }}"
          vm_index: "{{ item.vm_index }}"
          vm_size_tier: "{{ item.vm_size_tier }}"
          vm_size_chosen: "{{ item.vm_size_chosen }}"
          web_url: "{{ item.web_url | default('', true) }}"
          golden_image_source: "{{ quay_windows_image | default('') }}"
          golden_image_cis_level: "L1"
          env_name: "{{ aap_env_name }}"
      loop: "{{ win_inventory | default([]) }}"
      loop_control:
        label: "{{ item.aap_host_name }}"

    # ONE CALL, NOT A LOOP. `hosts:` takes the whole list, so the whole farm is
    # associated in a single request.
    - name: Associate the Windows hosts with their group
      when: win_inventory | default([]) | length > 0
      ansible.controller.group:
        controller_host: "{{ provision_aap_url }}"
        controller_username: "{{ provision_aap_user }}"
        controller_password: "{{ provision_aap_pass }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
        request_timeout: "{{ provision_request_timeout }}"
        name: "{{ provision_windows_group }}"
        inventory: "{{ provision_aap_inventory }}"
        hosts: "{{ win_inventory | map(attribute='aap_host_name') | list }}"
        state: present

# --- Linux ---------------------------------------------------------
- name: Register the Linux VMs
  block:
    - name: Add each Linux VM as a host
      ansible.controller.host:
        controller_host: "{{ provision_aap_url }}"
        controller_username: "{{ provision_aap_user }}"
        controller_password: "{{ provision_aap_pass }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
        request_timeout: "{{ provision_request_timeout }}"
        name: "{{ item.aap_host_name }}"
        inventory: "{{ provision_aap_inventory }}"
        enabled: true
        state: present
        variables:
          ansible_host: "{{ item.ansible_host }}"
          ansible_user: "{{ item.ansible_user }}"
          vm_name: "{{ item.vm_name }}"
          vm_role: "{{ item.vm_role }}"
          vm_index: "{{ item.vm_index }}"
          vm_size_tier: "{{ item.vm_size_tier }}"
          vm_size_chosen: "{{ item.vm_size_chosen }}"
          web_url: "{{ item.web_url | default('', true) }}"
          cockpit_url: "{{ item.cockpit_url | default('', true) }}"
          ssh_command: "{{ item.ssh_command | default('', true) }}"
          golden_image_source: "{{ quay_rhel9_image | default('') }}"
          golden_image_cis_level: "L1"
          env_name: "{{ aap_env_name }}"
      loop: "{{ linux_inventory | default([]) }}"
      loop_control:
        label: "{{ item.aap_host_name }}"

    - name: Associate the Linux hosts with their group
      when: linux_inventory | default([]) | length > 0
      ansible.controller.group:
        controller_host: "{{ provision_aap_url }}"
        controller_username: "{{ provision_aap_user }}"
        controller_password: "{{ provision_aap_pass }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
        request_timeout: "{{ provision_request_timeout }}"
        name: "{{ provision_linux_group }}"
        inventory: "{{ provision_aap_inventory }}"
        hosts: "{{ linux_inventory | map(attribute='aap_host_name') | list }}"
        state: present
