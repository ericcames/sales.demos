---
# ===========================================================================
# assert_target_environment.yml — the environment-targeting guard.
#
# Included by every playbook that touches an environment. Shared rather than
# copied so the three call sites cannot drift apart. (#24)
#
# Playbooks target `hosts: aap` and rely on `--limit <env>` to pick one
# environment. That is what makes the limit the selector rather than a filter
# — see inventory/hosts.yml and #16, where both environment groups shared a
# host and `--limit demo` silently resolved to sandbox's credentials.
#
# The failure mode this closes: `hosts: aap` with no --limit matches EVERY
# environment, so a forgotten flag would configure sandbox and demo in the
# same run. Fail closed instead.
# ===========================================================================

- name: Assert exactly one environment is targeted
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
    fail_msg: >-
      This run targets {{ ansible_play_hosts_all | length }} environments
      ({{ ansible_play_hosts_all | join(', ') }}). Pass exactly one:
      `--limit sandbox` or `--limit demo`.
    quiet: true
  run_once: true

- name: Assert the targeted environment is the intended one
  # Optional belt-and-braces for callers that know which environment they
  # mean: `-e target_env=demo` fails loudly rather than silently applying
  # somewhere else. Skipped when the caller does not pass it.
  ansible.builtin.assert:
    that:
      - aap_env_name == target_env
    fail_msg: >-
      Requested target_env={{ target_env }} but the inventory resolved to
      aap_env_name={{ aap_env_name }}. Check your --limit.
    quiet: true
  when: target_env is defined
