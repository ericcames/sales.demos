---
# ===========================================================================
# teardown_ocpvirt.yml — OCP Virt provider for the teardown dispatch.
# Extracted from teardown.yml as part of the provider abstraction (#238).
#
# CALLER: teardown.yml, via include_tasks: tasks/teardown_{{ hypervisor }}.yml
#
# The ordering within this file is load-bearing:
#   1. Read terraform state (get hostnames)
#   2. Unregister guests from Insights and CDN (needs VMs running)
#   3. terraform destroy (kills VMs)
#   4. Clean up SSH host keys
#   5. Deregister hosts from AAP inventory
#
# Reads play-level vars: ocpvirt_*, provision_*, aap_env_name, and the
# group_vars connection values.
# ===========================================================================

- name: Assert the OpenShift connection is resolved
  ansible.builtin.assert:
    that:
      - ocpvirt_api_url | length > 0
      - ocpvirt_api_token | length > 0
    fail_msg: >-
      No OpenShift connection. Locally this comes from
      group_vars/<env>/connection.yml plus the vault-encrypted
      playbooks/group_vars/all/secrets.yml, with --vault-id passed. That
      file is gitignored (#130), so a fresh clone has only the .example.
      From AAP it arrives as an extra_var from the "Sales Demos - Env
      Secrets" credential (#129).
    quiet: true

- name: Report what is about to be destroyed
  ansible.builtin.debug:
    msg:
      - "Destroying role '{{ provision_vm_role }}' / {{ provision_os_type }} / {{ provision_size_tier }} in namespace {{ ocpvirt_namespace_resolved }} on {{ aap_env_name }}."
      - >-
        PRESERVED: OpenShift Virtualization, the boot-source DataSources
        (including the Windows golden image), the
        {{ ocpvirt_state_namespace }} state namespace, and -- since #348 --
        the {{ ocpvirt_namespace_resolved }} VM namespace and the sd1.*
        instance type catalog, which the other OS may still be using.

- name: Destroy the VMs and deregister them
  block:
    - name: Create a temporary kubeconfig for the Terraform backend
      ansible.builtin.tempfile:
        state: file
        suffix: .kubeconfig
      register: ocpvirt_kubeconfig
      changed_when: false

    - name: Write the kubeconfig
      ansible.builtin.copy:
        dest: "{{ ocpvirt_kubeconfig.path }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: demo
              cluster:
                server: {{ ocpvirt_api_url }}
                insecure-skip-tls-verify: {{ (not (openshift_validate_certs | default(false) | bool)) | lower }}
          users:
            - name: demo
              user:
                token: {{ ocpvirt_api_token }}
          contexts:
            - name: demo
              context:
                cluster: demo
                user: demo
          current-context: demo
      no_log: true
      changed_when: false

    # STATE IS PER OS (#301) AND PER ROLE (#389), so a teardown destroys only
    # the OS and role it was asked for. Tearing down Windows leaves a running
    # Linux VM alone, and tearing down `db` leaves the `web` farm alone -- the
    # shared state used to make both impossible.
    #
    # THE COROLLARY IS THAT A TEARDOWN CAN SUCCEED HAVING DESTROYED NOTHING.
    # Ask for a role that was never built and terraform init creates an empty
    # state, destroy reports "0 destroyed", and the play goes green. The
    # "Report what was found in state" task below prints "(none -- nothing to
    # destroy)" for exactly this case; read it before believing a teardown.
    - name: Initialize Terraform against the kubernetes backend
      ansible.builtin.command:
        argv:
          - terraform
          - init
          - -input=false
          - -no-color
          - -reconfigure
          - "-backend-config=secret_suffix={{ aap_env_name }}-{{ provision_os_type }}-{{ provision_vm_role }}"
          - "-backend-config=namespace={{ ocpvirt_state_namespace }}"
          - "-backend-config=config_path={{ ocpvirt_kubeconfig.path }}"
          - "-backend-config=insecure={{ (not (openshift_validate_certs | default(false) | bool)) | lower }}"
        chdir: "{{ ocpvirt_terraform_dir }}"
      changed_when: false
      register: tf_init_result
      failed_when: false

    - name: Fail with the Terraform init error
      when: tf_init_result.rc != 0
      ansible.builtin.fail:
        msg: >-
          terraform init exited {{ tf_init_result.rc }}:
          {{ tf_init_result.stderr | default(tf_init_result.stdout) | default('no output') }}

    - name: Read the Terraform outputs BEFORE destroying
      ansible.builtin.command:
        argv: [terraform, output, -json]
        chdir: "{{ ocpvirt_terraform_dir }}"
      changed_when: false
      failed_when: false
      register: tf_output

    # LISTS SINCE #389. `| flatten` accepts both shapes, so state written by
    # pre-#389 code -- where each output was a single dict -- still yields its
    # one entry here rather than being silently dropped. That matters precisely
    # once, on the first run after this change, and it is the run where getting
    # it wrong orphans a VM.
    - name: Collect inventory entries from Terraform state
      ansible.builtin.set_fact:
        teardown_inventories: >-
          {{ [
               (tf_output.stdout | default('{}') | from_json).linux_inventory.value | default([], true),
               (tf_output.stdout | default('{}') | from_json).windows_inventory.value | default([], true)
             ] | flatten | select('mapping') | list }}

    # Both aap_host_name (instance-unique, #354) and host (in-cluster FQDN)
    # are collected so that VMs registered under either name get cleaned up.
    # Old state without aap_host_name contributes only the FQDN.
    - name: Remember which hosts to deregister
      ansible.builtin.set_fact:
        teardown_hosts: >-
          {{ (teardown_inventories | map(attribute='aap_host_name', default='') | reject('equalto', '') | list)
             + (teardown_inventories | map(attribute='host') | list)
             | unique }}

    - name: Build the virtctl SSH host-key names to clean up
      ansible.builtin.set_fact:
        teardown_ssh_keys: >-
          {{ teardown_inventories | map(attribute='vm_name')
             | map('regex_replace', '^(.*)$', 'vm.\1.' ~ ocpvirt_namespace_resolved)
             | list }}

    - name: Report what was found in state
      ansible.builtin.debug:
        msg: >-
          {{ teardown_hosts | length }} host(s) in state:
          {{ teardown_hosts | join(', ') if teardown_hosts else '(none — nothing to destroy)' }}

    # EVERY Linux guest, not just the first. Each one holds its own Red Hat
    # subscription and its own Insights host, so a farm of three leaks three
    # entitlements if this only reaches one of them.
    - name: Add the Linux guests to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.host }}"
        groups: teardown_guests
        ansible_host: "{{ item.ansible_host }}"
        ansible_user: "{{ item.ansible_user }}"
        ansible_connection: ssh
        ansible_port: 22
      changed_when: false
      loop: >-
        {{ [(tf_output.stdout | default('{}') | from_json).linux_inventory.value | default([], true)]
           | flatten | select('mapping') | list }}
      loop_control:
        label: "{{ item.host }}"

    # --- Give the entitlement back BEFORE destroying -------------------
    - name: Disconnect the guest from Insights
      ansible.builtin.command: insights-client --unregister
      delegate_to: "{{ item }}"
      become: true
      loop: "{{ groups['teardown_guests'] | default([]) }}"
      register: teardown_insights
      changed_when: teardown_insights.rc == 0
      failed_when: false

    - name: Unregister the guest from the Red Hat CDN
      ansible.builtin.command: subscription-manager unregister
      delegate_to: "{{ item }}"
      become: true
      loop: "{{ groups['teardown_guests'] | default([]) }}"
      register: teardown_unregister
      changed_when: teardown_unregister.rc == 0
      failed_when: false

    - name: Report what was released
      ansible.builtin.debug:
        msg: >-
          {{ 'Released the subscription and removed the Insights host.'
             if (teardown_unregister.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) > 0
             else 'WARNING: could not unregister the guest — the subscription and Insights host will linger. Remove them at console.redhat.com.' }}
      when: groups['teardown_guests'] | default([]) | length > 0

    - name: Destroy the VMs
      ansible.builtin.command:
        argv:
          - terraform
          - destroy
          - -input=false
          - -auto-approve
          - -no-color
          - "-var=vm_size_tier={{ provision_size_tier }}"
          - "-var=os_type={{ provision_os_type }}"
          - "-var=vm_role={{ provision_vm_role }}"
          - "-var=vm_count={{ provision_vm_count }}"
          - "-var=namespace={{ ocpvirt_namespace_resolved }}"
          - "-var=name_suffix={{ provision_name_suffix }}"
          - "-var=linux_admin_username={{ linux_admin_username | default('cloud-user') }}"
          - "-var=windows_admin_username={{ windows_admin_username | default('demoadmin') }}"
          - "-var=openshift_apps_domain={{ openshift_apps_domain | default('') }}"
        chdir: "{{ ocpvirt_terraform_dir }}"
      environment:
        TF_VAR_openshift_api_url: "{{ ocpvirt_api_url }}"
        TF_VAR_openshift_api_token: "{{ ocpvirt_api_token }}"
        # `| lower`, NOT a ternary, and that is the fix for #342. This expression
        # exists once per task file, and the two copies disagreed: #238 split
        # provision and teardown apart and duplicated the then-buggy ternary into
        # both, then #295 fixed only the copy it was looking at. Teardown kept
        # `ternary('false', 'true')` and so ran with TLS verification ON against
        # RHDP's self-signed certs, failing every destroy with `x509: certificate
        # signed by unknown authority`.
        #
        # It hid well: the kubeconfig and backend flags above are correct, so
        # `init` and the state read both succeed and only the destroy step fails,
        # which reads like a cluster problem rather than a code defect.
        #
        # `| lower` is the same form those two already use, so all three TLS flags
        # in this file are now one idiom -- and an inverted ternary cannot be
        # written where there is no ternary. Verified equivalent to the correct
        # ternary for validate_certs true, false, and undefined.
        TF_VAR_openshift_insecure: "{{ (not (openshift_validate_certs | default(false) | bool)) | lower }}"
        TF_VAR_demo_ssh_public_key: "{{ demo_ssh_public_key | default('') }}"
        TF_IN_AUTOMATION: "1"
      no_log: true
      changed_when: "'0 destroyed' not in (tf_destroy_result.stdout | default(''))"
      register: tf_destroy_result
      ignore_errors: true

    - name: Show the Terraform error
      when: tf_destroy_result is failed
      ansible.builtin.debug:
        msg: "{{ tf_destroy_result.stderr_lines | default([tf_destroy_result.stderr | default('no stderr')]) }}"

    - name: Check whether a stale state lock caused it
      ansible.builtin.include_tasks: tasks/terraform_lock_check.yml
      vars:
        tf_lock_result: "{{ tf_destroy_result }}"
        tf_lock_operation: destroy
      when: tf_destroy_result is failed

    - name: Fail if the destroy failed
      when: tf_destroy_result is failed
      ansible.builtin.fail:
        msg: "terraform destroy exited {{ tf_destroy_result.rc | default('?') }}"

    - name: Remove stale SSH host keys from the operator's known_hosts
      ansible.builtin.command:
        argv: [ssh-keygen, -R, "{{ item }}"]
      loop: "{{ teardown_ssh_keys }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true
      failed_when: false

    - name: Deregister the VMs from the AAP inventory
      ansible.controller.host:
        controller_host: "{{ provision_aap_url }}"
        controller_username: "{{ provision_aap_user }}"
        controller_password: "{{ provision_aap_pass }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
        request_timeout: "{{ provision_request_timeout }}"
        name: "{{ item }}"
        inventory: "{{ provision_aap_inventory }}"
        state: absent
      loop: "{{ teardown_hosts }}"
      loop_control:
        label: "{{ item }}"

    - name: Clean up Host Metrics entries (#354)
      block:
        - name: Look up Host Metrics entries for deregistered hosts
          ansible.builtin.uri:
            url: "{{ provision_aap_url }}/api/controller/v2/host_metrics/?hostname={{ item | urlencode }}"
            user: "{{ provision_aap_user }}"
            password: "{{ provision_aap_pass }}"
            force_basic_auth: true
            validate_certs: "{{ aap_validate_certs | default(false) }}"
            return_content: true
          loop: "{{ teardown_hosts }}"
          loop_control:
            label: "{{ item }}"
          register: hm_lookup
          no_log: true

        - name: Soft-delete each Host Metrics entry
          ansible.builtin.uri:
            url: "{{ provision_aap_url }}/api/controller/v2/host_metrics/{{ item.json.results[0].id }}/"
            method: DELETE
            user: "{{ provision_aap_user }}"
            password: "{{ provision_aap_pass }}"
            force_basic_auth: true
            validate_certs: "{{ aap_validate_certs | default(false) }}"
            status_code: [204, 404]
          loop: "{{ hm_lookup.results | selectattr('json.count', 'gt', 0) | list }}"
          loop_control:
            label: "{{ item.item }}"
          no_log: true
      rescue:
        - name: Host Metrics cleanup failed (non-fatal)
          ansible.builtin.debug:
            msg: "Host Metrics cleanup failed — entries may need manual removal."

    - name: Summarize
      ansible.builtin.debug:
        msg:
          - "Destroyed the '{{ provision_vm_role }}' {{ provision_os_type }} VMs in {{ ocpvirt_namespace_resolved }} on {{ aap_env_name }}."
          - "Deregistered {{ teardown_hosts | length }} host(s) from '{{ provision_aap_inventory }}'."
          - >-
            Left intact: OpenShift Virtualization, the boot-source DataSources,
            {{ ocpvirt_state_namespace }}, the
            {{ ocpvirt_namespace_resolved }} VM namespace, and the sd1.*
            instance type catalog (#348).

  always:
    - name: Remove the temporary kubeconfig
      ansible.builtin.file:
        path: "{{ ocpvirt_kubeconfig.path }}"
        state: absent
      when: ocpvirt_kubeconfig.path is defined
      changed_when: false
