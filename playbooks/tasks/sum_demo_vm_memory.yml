---
# ===========================================================================
# tasks/sum_demo_vm_memory.yml — how much guest memory the demo VMs hold. #334
#
#   demo_vm_namespace  optional; omit or leave empty to search cluster-wide
#   demo_vm_exclude    optional; a LIST of VM names to leave out, for a caller
#                      that is about to converge its own VMs and must not count
#                      them twice. A LIST SINCE #389 — it was a single name,
#                      which was enough while a run built exactly one VM. A farm
#                      converges several, and excluding only the first would
#                      count the rest twice and refuse a re-run of the very
#                      thing that is already there. A bare string still works:
#                      it is wrapped below.
#
#   sets: demo_vm_total_gb, demo_vm_counted
#
# WHY THIS IS A SHARED FILE AND NOT AN EXPRESSION IN TWO PLACES. Both callers
# need the same number and got it wrong the same way (#334): probe_env.yml read
# `spec.template.spec.domain.memory.guest`, provision_vm.yml read the identical
# path, and BOTH silently totalled zero.
#
# THE MEMORY IS NOT IN THE VM. These VMs are instancetype-based —
# terraform/ocpvirt sets `spec.instancetype: {name: sd1.<tier>}` and the guest
# memory lives in the VirtualMachineClusterInstancetype that instancetypes.tf
# creates. `domain.memory` is genuinely absent, and `domain.resources` is `{}`,
# so the obvious read returns nothing and the obvious fallback finds nothing
# either. Measured, not guessed:
#
#     sd-lnx-large   spec.instancetype = {name: sd1.large}   domain.memory = None
#     sd1.large      memory.guest = 16Gi
#
# THE COST OF GETTING THIS WRONG WAS INVISIBLE, which is why it survived. A
# total of zero makes every budget assert pass, so provision_vm.yml's
# cluster-wide check — the one #301 added precisely because neither per-OS
# Terraform state can see the other — was asserting `0 + tier <= budget` and
# passing for that reason alone.
#
# INLINE MEMORY IS STILL HONOURED FIRST, so a VM built by hand without an
# instancetype is counted rather than skipped.
#
# EVERY kubernetes.core TASK HERE CARRIES ITS OWN `environment:` (#391), and
# this file is the THIRD place that has had to learn it -- see the same banner
# in tasks/terraform_ocpvirt.yml, which records #313 and #315.
#
# It is not decoration, and the way it failed is the point. This file was
# extracted from its two callers in #334, and they do not agree about where the
# credentials come from:
#
#   probe_env.yml     supplies K8S_AUTH_* at PLAY level, so it worked there
#   provision_vm.yml  has no play-level environment -- terraform_ocpvirt.yml
#                     puts one on each task instead -- so it supplied NOTHING
#
# So from an AAP job template both reads below failed with "Could not create API
# client: Invalid kube-config file. No configuration found.", `failed_when:
# false` swallowed it, and the total came back 0.0 GiB. The cluster-wide budget
# assert in provision_vm.yml was therefore evaluating `0 + tier <= budget` and
# passing for that reason alone -- exactly the failure #334 was opened to fix,
# reappearing with a different cause. Measured on sandbox job 522 with three
# VMs holding 48 GiB running at the time.
#
# Carrying the environment here rather than at the call sites makes the file
# self-sufficient, so a third caller cannot inherit the bug by not knowing.
# ===========================================================================

# `| ansible.builtin.flatten` on a wrapped scalar accepts both shapes, so a
# caller that still passes one name is not broken by the list.
- name: Normalize the exclusion list
  ansible.builtin.set_fact:
    _demo_vm_exclude: >-
      {{ [demo_vm_exclude | default([], true)] | flatten | reject('equalto', '') | list }}

- name: Read the demo VMs
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ demo_vm_namespace | default('', true) | ternary(demo_vm_namespace, omit) }}"
    label_selectors:
      - "app.kubernetes.io/part-of=sales-demos"
  environment:
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"
  register: _demo_vms
  failed_when: false

- name: Read the cluster instancetypes the VMs point at
  kubernetes.core.k8s_info:
    api_version: instancetype.kubevirt.io/v1beta1
    kind: VirtualMachineClusterInstancetype
  environment:
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"
  register: _demo_instancetypes
  failed_when: false

# ---------------------------------------------------------------------------
# `failed_when: false` STAYS, AND THIS IS WHAT MAKES IT SAFE (#391).
#
# It has to stay: playbooks/probe_env.yml runs against clusters where OpenShift
# Virtualization is not installed yet, and a missing CRD there is a legitimate
# zero, not an error. What it must NOT do is turn "I could not look" into the
# same zero.
#
# `resources` separates the two exactly, with no message matching. Measured on
# sandbox 2026-09-09:
#
#   success                  no msg,  resources populated
#   missing CRD (no CNV)     msg="Failed to find API for resource ...",
#                            resources = []          <- DEFINED, and empty
#   no credentials           msg="Could not create API client ...",
#                            resources ABSENT        <- the module never ran a query
#
# So "resources is defined" means the read happened, whatever it found. A total
# of zero is then a measurement rather than an absence of one, which is the
# property #334 and #391 both turn on.
# ---------------------------------------------------------------------------
- name: Fail rather than report a zero that was never measured
  ansible.builtin.assert:
    that:
      - _demo_vms.resources is defined
      - _demo_instancetypes.resources is defined
    fail_msg: >-
      Could not read the cluster, so any memory total here would be a zero
      nobody measured -- and the budget assert that consumes it would pass for
      that reason alone. VMs: {{ _demo_vms.msg | default('(no message)') }}
      Instancetypes: {{ _demo_instancetypes.msg | default('(no message)') }}
      This is almost always missing credentials: every kubernetes.core task in
      this file needs openshift_api_url and openshift_api_token in scope, which
      from AAP arrive through the "Sales Demos - Env Secrets" credential (#129)
      and locally from group_vars/<env>/connection.yml plus the vault.
    # `| default([])` ON BOTH, and that is not belt-and-braces. Ansible templates
    # success_msg and fail_msg BOTH before deciding which to show, so a bare
    # `_demo_vms.resources` here raises "'dict object' has no attribute
    # 'resources'" in precisely the case this assert exists to explain -- the
    # guard still fires, but prints a templating error instead of the reason.
    # Caught by the rescue test in the #391 PR rather than in production.
    success_msg: >-
      Cluster read OK -- {{ _demo_vms.resources | default([]) | length }} demo
      VM(s) and {{ _demo_instancetypes.resources | default([]) | length }}
      instancetype(s) visible.

- name: Map each instancetype to its guest memory
  ansible.builtin.set_fact:
    # dict() takes ONE argument -- dict(keys, values) is a TypeError, which is
    # what CI caught. Zip into pairs first.
    _demo_it_memory: >-
      {{ dict(
           ((_demo_instancetypes.resources | default([])) | map(attribute='metadata.name') | list)
           | zip((_demo_instancetypes.resources | default([])) | map(attribute='spec.memory.guest') | list)
         ) }}

- name: Total the guest memory the demo VMs hold
  ansible.builtin.set_fact:
    demo_vm_counted: >-
      {{ (_demo_vms.resources | default([]))
         | rejectattr('metadata.name', 'in', _demo_vm_exclude)
         | map(attribute='metadata.name') | list }}
    demo_vm_total_gb: >-
      {%- set ns = namespace(total=0.0) -%}
      {%- for vm in (_demo_vms.resources | default([])) -%}
        {%- if vm.metadata.name not in _demo_vm_exclude -%}
          {%- set dom = vm.spec.template.spec.domain | default({}) -%}
          {#- inline memory first, so a hand-built VM still counts -#}
          {%- set inline = (dom.memory | default({})).get('guest', '')
                            or ((dom.resources | default({})).get('requests', {})).get('memory', '') -%}
          {%- set itname = (vm.spec.instancetype | default({})).get('name', '') -%}
          {%- set q = (inline or _demo_it_memory.get(itname, '0')) | string -%}
          {%- set num = q | regex_replace('[^0-9.]', '') | default('0', true) | float -%}
          {%- set unit = q | regex_replace('[0-9.]', '') -%}
          {%- set gib = num if unit in ['Gi', 'G'] else (num / 1024 if unit in ['Mi', 'M'] else num / 1073741824) -%}
          {%- set ns.total = ns.total + gib -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.total | round(2) }}
