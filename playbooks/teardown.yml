---
# ===========================================================================
# teardown.yml — Phase 3's other half. Destroy the demo VMs and deregister
# them from AAP, without touching the expensive one-time setup. Issue #6, #238.
#
#   ansible-playbook playbooks/teardown.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# PROVIDER DISPATCH (#238). The `hypervisor` variable selects which teardown
# task file runs: tasks/teardown_{{ hypervisor }}.yml. Default is `ocpvirt`
# for backward compatibility.
#
# WHAT THIS DELIBERATELY DOES NOT DESTROY, because rebuilding either is roughly
# a 45-minute cost:
#
#   - The OpenShift Virtualization install (Phase 0, namespace openshift-cnv).
#   - The boot-source DataSources, including the Windows golden image from
#     Phase 2 (namespace openshift-virtualization-os-images) and its published
#     quay containerdisk.
#
# WHY THIS RUNS AGAINST THE CONTROL INVENTORY IN AAP. It removes hosts from
# `Sales Demo VMs`, and AAP locks the hosts of the inventory a running job is
# using — a job cannot delete hosts out from under itself. `Sales Demo VMs -
# Control` exists empty for exactly this. dc1.azure hit the same wall as AB#73.
# ===========================================================================

- name: Phase 3 — destroy the demo VMs and deregister them from AAP
  hosts: aap
  gather_facts: false

  vars:
    # --- Hypervisor dispatch (#238) ----------------------------------------
    provision_hypervisor: "{{ hypervisor | default('ocpvirt') }}"

    # Must match what provision_vm.yml applied, or destroy plans against a
    # different shape than the one that was built.
    provision_size_tier: "{{ vm_size_tier | default('small') }}"
    # One OS per run, matching provision — state is keyed per OS since #301.
    provision_os_type: "{{ os_type | default('linux') }}"
    provision_name_suffix: "{{ name_suffix | default('') }}"

    # --- Server farm (#389) -------------------------------------------------
    # The role is part of the Terraform state key, so a teardown MUST be told
    # which role it is destroying or it will init an empty state and destroy
    # nothing while reporting success. vm_count is passed for completeness —
    # `terraform destroy` works from state, not from the count — but keeping the
    # variable set means the plan it builds to destroy matches the one that was
    # applied, rather than tripping the budget precondition on the way past.
    provision_vm_role: "{{ vm_role | default('web') }}"
    provision_vm_count: "{{ vm_count | default(1) | int }}"

    # --- Every role at once (#393) ------------------------------------------
    # The nightly schedules pass all_roles=true through their extra_data, so a
    # `db` or `app` farm is swept as well as `web`. The roles come from the
    # Terraform state Secrets, not from a list kept here: a list would be a
    # second copy of the survey's choices, and a role missing from it runs all
    # night while the job goes green, which is the bug this fixes. The Secrets
    # also cover a role whose VMs were deleted by hand but whose state remains.
    #
    # A SEPARATE BOOLEAN, NOT vm_role=all. `all` passes the role regex, so a
    # real farm could carry that name. Manual launches leave this false and
    # remove exactly the vm_role they are given, as before.
    teardown_all_roles: "{{ all_roles | default(false) | bool }}"

    provision_aap_inventory: "{{ provision_inventory | default('Sales Demo VMs') }}"

    # --- AAP, from connection.yml or an AAP Controller credential -----------
    provision_aap_host: >-
      {{ aap_hostname | default(lookup('ansible.builtin.env', 'CONTROLLER_HOST'), true) }}
    provision_aap_user: >-
      {{ aap_username | default(lookup('ansible.builtin.env', 'CONTROLLER_USERNAME'), true) }}
    provision_aap_pass: >-
      {{ aap_password | default(lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD'), true) }}
    provision_aap_url: >-
      {{ provision_aap_host if provision_aap_host is match('^https?://') else 'https://' ~ provision_aap_host }}
    provision_request_timeout: "{{ aap_request_timeout | default(30) }}"

    # --- OCP Virt-specific (used when hypervisor=ocpvirt) -------------------
    ocpvirt_terraform_dir: "{{ playbook_dir }}/../terraform/ocpvirt"

    ocpvirt_api_url: >-
      {{ openshift_api_url | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST'), true) }}
    ocpvirt_api_token: >-
      {{ openshift_api_token | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY'), true) }}
    ocpvirt_namespace_resolved: "{{ ocpvirt_namespace | default('sales-demos-' ~ aap_env_name, true) }}"
    ocpvirt_state_namespace: "{{ tf_state_namespace | default('sales-demos-tfstate', true) }}"

  tasks:
    - name: Assert exactly one environment is targeted
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Require target_env to be stated explicitly
      ansible.builtin.assert:
        that:
          - target_env is defined
          - target_env | length > 0
        fail_msg: >-
          teardown.yml requires -e target_env=<sandbox|demo|edge>, stated explicitly
          and matching --limit. This playbook destroys VMs; it will not guess
          which environment you meant.
        quiet: true

    - name: Assert provisioning inputs are valid
      ansible.builtin.assert:
        that:
          - provision_hypervisor in ['ocpvirt']
        fail_msg: >-
          Unknown hypervisor '{{ provision_hypervisor }}'. Supported: ocpvirt.
        quiet: true

    - name: Assert the role is a valid role name
      when: not (teardown_all_roles | bool)
      ansible.builtin.assert:
        that:
          - provision_vm_role is match('^[a-z][a-z0-9]{0,7}$')
        fail_msg: >-
          vm_role '{{ provision_vm_role }}' is not a valid role (1-8 lowercase
          alphanumerics, starting with a letter). To remove every role that has
          state, pass all_roles=true instead.
        quiet: true

    # --- Every role with state (#393) ---------------------------------------
    # Terraform's kubernetes backend labels each state Secret
    # tfstateSecretSuffix=<env>-<os>-<role>, the same key tasks/teardown_*.yml
    # builds. no_log because the Secrets hold the state itself.
    - name: Find the Terraform state Secrets
      when: teardown_all_roles | bool
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ ocpvirt_state_namespace }}"
        label_selectors:
          - tfstate=true
      environment:
        K8S_AUTH_HOST: "{{ ocpvirt_api_url }}"
        K8S_AUTH_API_KEY: "{{ ocpvirt_api_token }}"
        K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"
      register: teardown_state_secrets
      no_log: true

    - name: Derive the roles that have state for this environment and OS
      when: teardown_all_roles | bool
      vars:
        _state_prefix: "{{ aap_env_name }}-{{ provision_os_type }}-"
      ansible.builtin.set_fact:
        teardown_roles: >-
          {{ teardown_state_secrets.resources
             | map(attribute='metadata.labels')
             | map(attribute='tfstateSecretSuffix', default='')
             | select('match', '^' ~ (_state_prefix | regex_escape) ~ '[a-z][a-z0-9]{0,7}$')
             | map('regex_replace', '^' ~ (_state_prefix | regex_escape), '')
             | unique | sort | list }}

    - name: Report the roles about to be torn down
      when: teardown_all_roles | bool
      ansible.builtin.debug:
        msg: >-
          all_roles=true: {{ teardown_roles | length }} role(s) with
          {{ provision_os_type }} state on {{ aap_env_name }}:
          {{ teardown_roles | join(', ') if teardown_roles else '(none — nothing to tear down)' }}

    # --- Provider dispatch -------------------------------------------------
    - name: "Run teardown: {{ provision_hypervisor }}"
      when: not (teardown_all_roles | bool)
      ansible.builtin.include_tasks: "tasks/teardown_{{ provision_hypervisor }}.yml"

    # ONCE PER ROLE. The task file keys its Terraform state by
    # provision_vm_role, so overriding it per iteration is all a role needs.
    # loop_var is not `item`, because the task file's own loops use `item`.
    - name: "Run teardown for every role: {{ provision_hypervisor }}"
      when: teardown_all_roles | bool
      ansible.builtin.include_tasks: "tasks/teardown_{{ provision_hypervisor }}.yml"
      vars:
        provision_vm_role: "{{ teardown_role }}"
      loop: "{{ teardown_roles }}"
      loop_control:
        loop_var: teardown_role
