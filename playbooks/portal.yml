---
# ===========================================================================
# portal.yml — deploy the AAP self-service portal. Issue #103.
#
#   ansible-playbook playbooks/portal.yml -i inventory --limit sandbox \
#     -e target_env=sandbox \
#     --vault-id sales.demos@~/secrets/.vault_pass_sales_demos
#
# Ported from aap.selfservice (bootstrap_portal.yml + sync_portal_orgs.yml).
# One playbook, two phases: bootstrap the portal, then sync the org list.
#
# THE HELM CHART, NOT THE RHDH OPERATOR. redhat-rhaap-portal bundles RHDH with
# the AAP plugin pre-wired. The RHDH operator deploys generic RHDH and would
# require wiring the plugin manually — a build, not a port. Both are available
# on the cluster; the chart path is proven (validated 2026-05-06, ~11 min).
#
# THREE FACTS FROM THE SOURCE REPO (AND LIVE DEBUGGING) THAT COST A DAY EACH:
#
#   1. OAuth applications live in the GATEWAY registry
#      (/api/gateway/v1/applications/), never the controller's.
#
#   2. Never PATCH client_secret. The gateway hashes it differently on PATCH
#      than on POST, giving invalid_client at /o/token/ every time. Delete and
#      recreate the application on each run.
#
#   3. AAP 2.7 defaults pkce_required to true. RHDH's RHAAP auth provider does
#      not send PKCE parameters (code_challenge/code_verifier), so the OAuth
#      authorize endpoint fails silently — AAP redirects back without a code
#      and the portal shows "You have to provide code or refreshToken". The
#      source repo never hit this because it was built against an older AAP
#      where the default was false. Set pkce_required: false explicitly.
#
# THE SERVICE TOKEN IS DURABLE BY DESIGN. The portal backend uses it to sync
# job templates and serve API requests. Same exception pattern as the MCP
# client token documented in CLAUDE.md — cleaned up in rescue: only if the
# OCP setup block fails, never on success.
#
# HELM NEEDS A KUBECONFIG FILE. The kubernetes.core.helm module wraps the helm
# CLI binary. Unlike k8s/k8s_info which support K8S_AUTH_* env vars natively,
# helm needs a file. This playbook SYNTHESISES one from openshift_api_url and
# openshift_api_token, which it already asserts are present (#324).
#
# IT USED TO READ .kube/<env>.kubeconfig from utilities/make-kubeconfig.sh, and
# that is precisely why the job template added in #300 failed ten seconds in on
# every launch: the file is gitignored, so AAP's SCM checkout never had one.
# Synthesising needs no new variable and no new credential, and gives the laptop
# and AAP a single code path rather than one that is only exercised in
# production. make-kubeconfig.sh is untouched -- the MCP servers are its job.
#
# IT ALSO NEEDS THE helm BINARY, which the EE did not carry until #324 added it.
# Fixing the kubeconfig alone only moved the failure one task later.
#
# ADDED TO setup.yml IN #547. Was a standalone addon (#92 Phase 4); now part
# of the base build, gated on `install_portal | default(true)`. Still runnable
# on its own via the sales-demos-portal skill or the job template.
# ===========================================================================

- name: Deploy the AAP self-service portal
  hosts: aap
  gather_facts: false

  environment:
    K8S_AUTH_HOST: "{{ openshift_api_url }}"
    K8S_AUTH_API_KEY: "{{ openshift_api_token }}"
    K8S_AUTH_VERIFY_SSL: "{{ openshift_validate_certs | default(false) | bool }}"

  vars:
    portal_namespace: aap-portal
    portal_helm_chart_version: "2.1.0"
    portal_wait_retries: 60
    portal_wait_delay: 15

  tasks:

    # -------------------------------------------------------------------
    # Guards
    # -------------------------------------------------------------------

    - name: Confirm the inventory resolved to the environment you meant
      ansible.builtin.include_tasks: tasks/assert_target_environment.yml

    - name: Assert connection variables are set
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_username | default('') | length > 0
          - aap_password | default('') | length > 0
          - openshift_api_url | default('') | length > 0
          - openshift_api_token | default('') | length > 0
        fail_msg: >-
          AAP or OpenShift connection variables are not set for
          '{{ aap_env_name | default("?") }}'. Check that environment's
          connection.yml, that playbooks/group_vars/all/secrets.yml exists --
          it is gitignored, so a fresh clone has only the .example (#130) --
          and that --vault-id was passed so env_secrets resolves. Run
          /sales-demos-first-time to build it.
        quiet: true

    # -------------------------------------------------------------------
    # Derived facts
    # -------------------------------------------------------------------

    - name: Derive clusterRouterBase from openshift_apps_domain
      ansible.builtin.set_fact:
        cluster_router_base: "{{ openshift_apps_domain }}"

    - name: Generate MCP static token for RHDH MCP endpoint (#555)
      ansible.builtin.set_fact:
        portal_mcp_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

    - name: Report the target
      ansible.builtin.debug:
        msg: "Deploying self-service portal to {{ aap_env_name }} ({{ aap_hostname }})."

    # -------------------------------------------------------------------
    # OAuth application — delete and recreate on every run.
    # NEVER PATCH client_secret: the gateway hashes differently on PATCH
    # vs POST, giving invalid_client at /o/token/.
    # -------------------------------------------------------------------

    - name: Query existing gateway OAuth application
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/applications/?name=aap-selfservice-portal"
        method: GET
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: oauth_app_query

    - name: Delete existing OAuth application
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/applications/{{ oauth_app_query.json.results[0].id }}/"
        method: DELETE
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: oauth_app_query.json.count > 0

    - name: Create gateway OAuth application and capture credentials
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/applications/"
        method: POST
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          name: "aap-selfservice-portal"
          organization: 1
          client_type: "confidential"
          authorization_grant_type: "authorization-code"
          redirect_uris: "https://placeholder.example.com/oauth/callback"
          skip_authorization: false
          pkce_required: false
        status_code: 201
      register: oauth_app_created
      no_log: true

    - name: Set OAuth credentials from creation response
      ansible.builtin.set_fact:
        oauth_client_id: "{{ oauth_app_created.json.client_id }}"
        oauth_client_secret: "{{ oauth_app_created.json.client_secret }}"
      no_log: true

    # -------------------------------------------------------------------
    # OCP namespace + secrets + portal token.
    # Token is cleaned up in rescue: if OCP steps fail, but NOT on
    # success — the portal backend needs it to talk to AAP.
    # -------------------------------------------------------------------

    - name: Create OCP namespace, secrets, and portal service token
      block:

        - name: Create portal namespace
          kubernetes.core.k8s:
            api_version: v1
            kind: Namespace
            name: "{{ portal_namespace }}"
            state: present

        - name: Create AAP service token for portal
          ansible.platform.token:
            aap_hostname: "https://{{ aap_hostname }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ aap_validate_certs }}"
            description: "aap-selfservice-portal service token"
            scope: write
            state: present
          register: portal_token_result
          no_log: true

        - name: Create secrets-rhaap-portal secret
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: secrets-rhaap-portal
                namespace: "{{ portal_namespace }}"
              type: Opaque
              stringData:
                aap-host-url: "https://{{ aap_hostname }}"
                oauth-client-id: "{{ oauth_client_id }}"
                oauth-client-secret: "{{ oauth_client_secret }}"
                aap-token: "{{ portal_token_result.ansible_facts.aap_token.token }}"

        - name: Read cluster global pull secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: pull-secret
            namespace: openshift-config
          register: cluster_pull_secret
          no_log: true

        - name: Create OCI registry auth secret for init container
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: rhaap-portal-dynamic-plugins-registry-auth
                namespace: "{{ portal_namespace }}"
              type: Opaque
              data:
                auth.json: "{{ cluster_pull_secret.resources[0].data['.dockerconfigjson'] }}"

        - name: Create secrets-scm secret
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: secrets-scm
                namespace: "{{ portal_namespace }}"
              type: Opaque
              stringData:
                github-token: ""
                gitlab-token: ""

        - name: Derive the AO hostname from the cluster domain
          ansible.builtin.set_fact:
            portal_ao_hostname: "ao-automation-orchestrator.{{ aap_hostname.split('.', 1)[1] }}"

        - name: Create API catalog ConfigMap (#767)
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: portal-api-catalog
                namespace: "{{ portal_namespace }}"
              data:
                apis.yaml: |
                  ---
                  apiVersion: backstage.io/v1alpha1
                  kind: API
                  metadata:
                    name: aap-controller-api
                    title: AAP Controller API
                    description: >-
                      Ansible Automation Platform Controller REST API.
                      Manages inventories, job templates, credentials,
                      projects, and automation execution.
                    links:
                      - url: https://{{ aap_hostname }}/api/v2/
                        title: API Browser
                  spec:
                    type: openapi
                    lifecycle: production
                    owner: group:default/aap-admins
                    definition: |
                      openapi: "3.0.0"
                      info:
                        title: AAP Controller API
                        version: "4.8"
                        description: Ansible Automation Platform Controller REST API
                      servers:
                        - url: https://{{ aap_hostname }}/api/v2/
                  ---
                  apiVersion: backstage.io/v1alpha1
                  kind: API
                  metadata:
                    name: aap-gateway-api
                    title: AAP Gateway API
                    description: >-
                      Ansible Automation Platform 2.7 unified gateway API.
                      Handles authentication, organisations, service
                      discovery, and platform-level settings.
                    links:
                      - url: https://{{ aap_hostname }}/api/gateway/v1/
                        title: API Browser
                  spec:
                    type: openapi
                    lifecycle: production
                    owner: group:default/aap-admins
                    definition: |
                      openapi: "3.0.0"
                      info:
                        title: AAP Gateway API
                        version: "2.7"
                        description: AAP 2.7 unified gateway REST API
                      servers:
                        - url: https://{{ aap_hostname }}/api/gateway/v1/
                  ---
                  apiVersion: backstage.io/v1alpha1
                  kind: API
                  metadata:
                    name: pah-galaxy-api
                    title: Private Automation Hub API
                    description: >-
                      Galaxy NG content management API. Manages collections,
                      execution environment images, namespaces, repositories,
                      and content synchronisation.
                    links:
                      - url: https://{{ aap_hostname }}/api/galaxy/
                        title: API Browser
                  spec:
                    type: openapi
                    lifecycle: production
                    owner: group:default/aap-admins
                    definition: |
                      openapi: "3.0.0"
                      info:
                        title: Private Automation Hub API
                        version: "3"
                        description: Galaxy NG content management REST API
                      servers:
                        - url: https://{{ aap_hostname }}/api/galaxy/
                  ---
                  apiVersion: backstage.io/v1alpha1
                  kind: API
                  metadata:
                    name: automation-orchestrator-api
                    title: Automation Orchestrator API
                    description: >-
                      Automation Orchestrator workflow API. Manages workflow
                      definitions, executions, approvals, integrations, and
                      credential proxying to AAP.
                    links:
                      - url: https://{{ portal_ao_hostname }}/api/docs/
                        title: API Documentation
                  spec:
                    type: openapi
                    lifecycle: production
                    owner: group:default/aap-admins
                    definition: |
                      openapi: "3.0.0"
                      info:
                        title: Automation Orchestrator API
                        version: "1.0"
                        description: Automation Orchestrator workflow REST API
                      servers:
                        - url: https://{{ portal_ao_hostname }}/api/v1/
                  ---
                  apiVersion: backstage.io/v1alpha1
                  kind: API
                  metadata:
                    name: granite-inference-api
                    title: Granite Inference API
                    description: >-
                      OpenAI-compatible inference endpoint served by vLLM on
                      Red Hat OpenShift AI. The live endpoint URL is stored in
                      the AAP credential "Sales Demos - Inference Endpoint"
                      and rotates with the GPU cluster.
                  spec:
                    type: openapi
                    lifecycle: production
                    owner: group:default/aap-admins
                    definition: |
                      openapi: "3.0.0"
                      info:
                        title: Granite Inference API (OpenAI-compatible)
                        version: "1.0"
                        description: vLLM inference endpoint — OpenAI chat completions format
                      paths:
                        /v1/chat/completions:
                          post:
                            summary: Create a chat completion
                            requestBody:
                              required: true
                              content:
                                application/json:
                                  schema:
                                    type: object
                                    required: [model, messages]
                                    properties:
                                      model:
                                        type: string
                                        example: granite-3.3-8b-instruct
                                      messages:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            role:
                                              type: string
                                              enum: [system, user, assistant]
                                            content:
                                              type: string
                                      temperature:
                                        type: number
                                      max_tokens:
                                        type: integer
                            responses:
                              '200':
                                description: Chat completion response
                        /v1/models:
                          get:
                            summary: List available models
                            responses:
                              '200':
                                description: Model list

      rescue:
        - name: Delete portal service token on failure
          ansible.platform.token:
            aap_hostname: "https://{{ aap_hostname }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ aap_validate_certs }}"
            existing_token_id: "{{ portal_token_result.ansible_facts.aap_token.id }}"
            state: absent
          when: portal_token_result.ansible_facts is defined

        - name: Re-raise failure
          ansible.builtin.fail:
            msg: "Portal bootstrap failed during OCP setup. Portal service token has been cleaned up."

    # -------------------------------------------------------------------
    # Helm chart deployment
    # -------------------------------------------------------------------

    # -------------------------------------------------------------------
    # THE KUBECONFIG IS SYNTHESISED, NOT READ FROM THE REPO (#324).
    #
    # This used to point at .kube/<env>.kubeconfig from make-kubeconfig.sh,
    # which is gitignored -- so AAP's SCM checkout had no such file and the job
    # template failed ten seconds in, every time. Built here from
    # openshift_api_url / openshift_api_token, which this playbook ALREADY
    # asserts are present, it needs no new variable and no new credential.
    #
    # ALWAYS SYNTHESISED, with no fallback to the repo file. One code path is
    # the point: a branch would leave the AAP path exercised only in production,
    # which is exactly how this bug survived to begin with.
    #
    # BLOCK/ALWAYS BECAUSE THE FILE HOLDS A BEARER TOKEN. It is removed even
    # when Helm fails -- same shape tasks/terraform_ocpvirt.yml already uses for
    # Terraform's backend kubeconfig.
    #
    # make-kubeconfig.sh is untouched: its real job is the MCP servers.
    # -------------------------------------------------------------------
    - name: Deploy the portal chart with a synthesised kubeconfig
      block:
        - name: Create a temporary kubeconfig for Helm
          ansible.builtin.tempfile:
            state: file
            suffix: .kubeconfig
          register: portal_kubeconfig_tmp

        - name: Write the kubeconfig
          ansible.builtin.copy:
            dest: "{{ portal_kubeconfig_tmp.path }}"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: portal
                  cluster:
                    server: {{ openshift_api_url }}
                    insecure-skip-tls-verify: {{ (not (openshift_validate_certs | default(false) | bool)) | lower }}
              users:
                - name: portal
                  user:
                    token: {{ openshift_api_token }}
              contexts:
                - name: portal
                  context:
                    cluster: portal
                    user: portal
              current-context: portal
          no_log: true

        - name: Deploy redhat-rhaap-portal Helm chart
          kubernetes.core.helm:
            name: rhaap-portal
            chart_ref: redhat-rhaap-portal
            chart_repo_url: "https://charts.openshift.io/"
            chart_version: "{{ portal_helm_chart_version }}"
            release_namespace: "{{ portal_namespace }}"
            create_namespace: false
            kubeconfig: "{{ portal_kubeconfig_tmp.path }}"
            values:
              redhat-developer-hub:
                global:
                  clusterRouterBase: "{{ cluster_router_base }}"
                  # oci pulls the AAP plugins from registry.redhat.io, authed
                  # by rhaap-portal-dynamic-plugins-registry-auth above. The
                  # chart default, tarball, is deprecated and needs a
                  # plugin-registry service this chart does not deploy.
                  pluginMode: oci
                  dynamic:
                    includes:
                      - dynamic-plugins.default.yaml
                    # HELM REPLACES LISTS, IT DOES NOT MERGE THEM (#592).
                    # Setting `plugins` at all discards the chart's default
                    # list, so that list is carried here verbatim from
                    # redhat-rhaap-portal 2.1.0 values.yaml, with the MCP
                    # plugins (#555) appended. #555 set only the MCP three, and
                    # the portal lost the AAP plugins with them: no rhaap
                    # sign-in page, so RHDH fell back to GitHub sign-in.
                    #
                    # A CHART BUMP MUST RE-COPY THIS LIST from the new
                    # version's values.yaml:
                    #   helm show values redhat-rhaap-portal \
                    #     --repo https://charts.openshift.io/ --version <v>
                    #
                    # The four AAP entries are written as what the chart's
                    # plugins.load.* helpers RENDER for pluginMode oci and the
                    # chart's imageTagInfo "2.1", not as the helper calls
                    # themselves. The calls are Helm template strings, which
                    # Ansible and ansible-lint both read as broken Jinja. In oci
                    # mode the chart's integrity helpers render empty, so no
                    # integrity field is carried either.
                    plugins:
                      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
                        disabled: false
                      - package: >-
                          oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.1!ansible-plugin-scaffolder-backend-module-backstage-rhaap
                        disabled: false
                        pluginConfig:
                          dynamicPlugins:
                            backend:
                              ansible.plugin-scaffolder-backend-module-backstage-rhaap: {}
                      - package: >-
                          oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.1!ansible-backstage-plugin-catalog-backend-module-rhaap
                        disabled: false
                      - package: >-
                          oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.1!ansible-plugin-backstage-self-service
                        disabled: false
                        pluginConfig:
                          dynamicPlugins:
                            frontend:
                              ansible.plugin-backstage-self-service:
                                signInPage:
                                  importName: SignInPage
                                providerSettings:
                                  - title: RHAAP
                                    description: Sign in with RHAAP
                                    provider: ansible.auth.rhaap
                                scaffolderFieldExtensions:
                                  - importName: AAPTokenFieldExtension
                                  - importName: AAPResourcePickerExtension
                                dynamicRoutes:
                                  - importName: LandingPage
                                    path: /
                                  - importName: SelfServicePage
                                    path: /self-service
                                  - importName: ExecutionEnvironmentPage
                                    path: /self-service/ee
                                mountPoints:
                                  - mountPoint: application/listener
                                    importName: LocationListener
                      - package: >-
                          oci://registry.redhat.io/ansible-automation-platform/automation-portal:2.1!ansible-backstage-plugin-auth-backend-module-rhaap-provider
                        disabled: false
                        pluginConfig: {}
                      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
                        disabled: false
                      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-gitlab-dynamic
                        disabled: false
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-catalog-backend-module-marketplace-dynamic
                        disabled: true
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-quickstart
                        disabled: false
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-adoption-insights
                        disabled: true
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-adoption-insights-backend-dynamic
                        disabled: true
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-analytics-module-adoption-insights-dynamic
                        disabled: true
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-dynamic-home-page
                        disabled: false
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-marketplace
                        disabled: true
                      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-marketplace-backend-dynamic
                        disabled: true
                      # MCP plugins (#555)
                      - package: >-
                          oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.42.5__0.1.2!backstage-plugin-mcp-actions-backend
                        disabled: false
                      - package: >-
                          oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-tool:bs_1.42.5__0.2.3!red-hat-developer-hub-backstage-plugin-software-catalog-mcp-tool
                        disabled: false
                      - package: >-
                          oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-tool:bs_1.42.5__0.3.0!red-hat-developer-hub-backstage-plugin-techdocs-mcp-tool
                        disabled: false
                upstream:
                  backstage:
                    # HELM REPLACES LISTS, IT DOES NOT MERGE THEM (#592, #769).
                    # The chart's default extraVolumes define the 6 volumes the
                    # init container needs (dynamic-plugins-root, etc.). Setting
                    # extraVolumes at all discards that default list, so the
                    # chart's defaults are carried here verbatim from
                    # redhat-rhaap-portal 2.1.0, with api-catalog (#767)
                    # appended.
                    #
                    # The ConfigMap/Secret names resolve from the chart's
                    # janus-idp.name helper, which yields the nameOverride
                    # "rhaap-portal". A CHART BUMP MUST RE-RENDER THIS LIST:
                    #   helm template rhaap-portal redhat-rhaap-portal \
                    #     --repo https://charts.openshift.io/ --version <v> \
                    #     --set redhat-developer-hub.global.clusterRouterBase=x \
                    #     --debug | grep -A40 'volumes:'
                    extraVolumes:
                      - name: dynamic-plugins-root
                        ephemeral:
                          volumeClaimTemplate:
                            spec:
                              accessModes:
                                - ReadWriteOnce
                              resources:
                                requests:
                                  storage: 5Gi
                      - name: dynamic-plugins
                        configMap:
                          defaultMode: 420
                          name: rhaap-portal-dynamic-plugins
                          optional: true
                      - name: dynamic-plugins-npmrc
                        secret:
                          defaultMode: 420
                          optional: true
                          secretName: rhaap-portal-dynamic-plugins-npmrc
                      - name: dynamic-plugins-registry-auth
                        secret:
                          defaultMode: 416
                          optional: true
                          secretName: rhaap-portal-dynamic-plugins-registry-auth
                      - name: npmcacache
                        emptyDir: {}
                      - name: temp
                        emptyDir: {}
                      - name: api-catalog
                        configMap:
                          name: portal-api-catalog
                    extraVolumeMounts:
                      - name: dynamic-plugins-root
                        mountPath: /opt/app-root/src/dynamic-plugins-root
                      - name: temp
                        mountPath: /tmp
                      - name: api-catalog
                        mountPath: /opt/app-root/src/api-catalog
                    appConfig:
                      integrations:
                        github: []
                        gitlab: []
                      backend:
                        auth:
                          externalAccess:
                            - type: static
                              options:
                                token: "{{ portal_mcp_token }}"
                                subject: mcp-clients
                        actions:
                          pluginSources:
                            - software-catalog-mcp-tool
                            - techdocs-mcp-tool
            wait: true
            wait_timeout: "600s"
            state: present
      always:
        - name: Remove the temporary kubeconfig
          ansible.builtin.file:
            path: "{{ portal_kubeconfig_tmp.path }}"
            state: absent
          when: portal_kubeconfig_tmp.path is defined

    # -------------------------------------------------------------------
    # Wait for the deployment and get the portal Route
    # -------------------------------------------------------------------

    - name: Wait for portal deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: rhaap-portal
        namespace: "{{ portal_namespace }}"
      register: portal_deploy
      until:
        - portal_deploy.resources | length > 0
        - (portal_deploy.resources[0].status.readyReplicas | default(0)) | int > 0
      retries: "{{ portal_wait_retries }}"
      delay: "{{ portal_wait_delay }}"

    - name: Get portal route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ portal_namespace }}"
      register: portal_routes
      retries: 20
      delay: 15
      until: portal_routes.resources | length > 0

    - name: Set portal URL
      ansible.builtin.set_fact:
        portal_url: "https://{{ portal_routes.resources[0].spec.host }}"

    # -------------------------------------------------------------------
    # Store MCP token in a K8s Secret so make-portal-mcp.sh can read it
    # -------------------------------------------------------------------

    - name: Create portal-mcp-token Secret (#555)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: portal-mcp-token
            namespace: "{{ portal_namespace }}"
          type: Opaque
          stringData:
            token: "{{ portal_mcp_token }}"

    # -------------------------------------------------------------------
    # Update OAuth redirect URI now that we know the portal URL
    # -------------------------------------------------------------------

    - name: Update OAuth application redirect URI
      ansible.platform.application:
        aap_hostname: "https://{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        name: aap-selfservice-portal
        organization: Default
        authorization_grant_type: authorization-code
        client_type: confidential
        redirect_uris:
          - "{{ portal_url }}/api/auth/rhaap/handler/frame"
        state: present

    # -------------------------------------------------------------------
    # Org sync — configure the portal to show all AAP organizations
    # -------------------------------------------------------------------

    - name: Get all organizations from AAP
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/organizations/?page_size=200"
        method: GET
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: org_response

    - name: Build org name list
      ansible.builtin.set_fact:
        aap_org_names: "{{ org_response.json.results | map(attribute='name') | list }}"

    - name: Show orgs that will be configured
      ansible.builtin.debug:
        msg: "Configuring portal for orgs: {{ aap_org_names }}"

    - name: Get current portal app-config configmap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: rhaap-portal-app-config
        namespace: "{{ portal_namespace }}"
      register: app_config_cm

    - name: Fail if portal configmap not found
      ansible.builtin.fail:
        msg: "rhaap-portal-app-config not found in {{ portal_namespace }}. The Helm deployment may have failed."
      when: app_config_cm.resources | length == 0

    - name: Parse current app-config
      ansible.builtin.set_fact:
        current_app_config: "{{ app_config_cm.resources[0].data['app-config.yaml'] | from_yaml }}"

    - name: Build updated app-config with orgs, sync, permissions, branding, menu items, API catalog, and feedback (#767)
      ansible.builtin.set_fact:
        updated_app_config: >-
          {{ current_app_config | combine(
            {
              'catalog': {
                'providers': {'rhaap': {'production': {
                  'orgs': aap_org_names,
                  'sync': {
                    'orgsUsersTeams': {'schedule': {'frequency': {'minutes': 1}}},
                    'jobTemplates': {'enabled': true, 'schedule': {'frequency': {'minutes': 1}}}
                  }
                }}},
                'locations': current_app_config.catalog.locations | default([]) + [
                  {'type': 'file', 'target': '/opt/app-root/src/api-catalog/apis.yaml',
                   'rules': [{'allow': ['API']}]}
                ]
              },
              'permission': {'enabled': false},
              'ansible': {'feedback': {'enabled': true}},
              'app': {'branding': {'theme': {'defaultMode': 'dark'}}, 'sidebar': {'settings': true}},
              'dynamicPlugins': {'frontend': {'default.main-menu-items': {'menuItems': {
                'default.ee': {'enabled': true},
                'default.learning-path': {'enabled': true, 'title': 'Learning Paths'},
                'default.home': {'title': 'Home'},
                'default.apis': {'title': 'APIs'}
              }}}}
            },
            recursive=True
          ) }}

    - name: Patch portal app-config configmap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: rhaap-portal-app-config
            namespace: "{{ portal_namespace }}"
          data:
            app-config.yaml: "{{ updated_app_config | to_nice_yaml(indent=2) }}"
      register: configmap_patch

    # -------------------------------------------------------------------
    # Restart portal to apply new config (only when configmap changed)
    # -------------------------------------------------------------------

    - name: Restart portal deployment to pick up new config
      kubernetes.core.k8s:
        state: patched
        api_version: apps/v1
        kind: Deployment
        name: rhaap-portal
        namespace: "{{ portal_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(utc=True, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      when: configmap_patch.changed

    - name: Wait for portal rollout to complete
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: rhaap-portal
        namespace: "{{ portal_namespace }}"
      register: portal_rollout
      until:
        - portal_rollout.resources | length > 0
        - (portal_rollout.resources[0].status.updatedReplicas | default(0)) | int
            == (portal_rollout.resources[0].status.replicas | default(1)) | int
        - (portal_rollout.resources[0].status.availableReplicas | default(0)) | int
            == (portal_rollout.resources[0].status.replicas | default(1)) | int
        - (portal_rollout.resources[0].status.unavailableReplicas | default(0)) | int == 0
      retries: "{{ portal_wait_retries }}"
      delay: "{{ portal_wait_delay }}"
      when: configmap_patch.changed

    # -------------------------------------------------------------------
    # Summary
    # -------------------------------------------------------------------

    - name: Report what is now running
      ansible.builtin.debug:
        msg:
          - "Self-service portal deployed to {{ aap_env_name }}."
          - "Namespace:     {{ portal_namespace }}"
          - "Portal URL:    {{ portal_url }}"
          - "Helm chart:    redhat-rhaap-portal {{ portal_helm_chart_version }}"
          - "AAP orgs:      {{ aap_org_names | join(', ') }}"
          - "Permissions:   disabled (non-admin users can see and launch templates)"
          - "Sync interval: 1 minute"
          - "MCP endpoint:  {{ portal_url }}/api/mcp-actions/v1"
          - "MCP token:     stored in Secret portal-mcp-token (run make-portal-mcp.sh to generate client files)"
